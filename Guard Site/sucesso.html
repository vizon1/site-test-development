<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guard - Solicitação Recebida</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            box-sizing: border-box;
            font-family: 'Fira Sans', sans-serif;
        }
        body {
            background-color: #000000;
            color: #F5F5F5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .sucesso-container {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 60px;
            width: 100%;
            max-width: 1100px;
        }
        .conteudo-sucesso {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .icone-check-circulo {
            width: 80px;
            height: 80px;
            background-color: #FFFF00;
            color: #000000;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            font-weight: bold;
            margin-bottom: 30px;
            box-shadow: 0 0 20px rgba(255, 255, 0, 0.2);
        }
        .conteudo-sucesso h1 {
            font-size: 46px;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        .conteudo-sucesso h1 span {
            color: #FFFF00;
        }
        .conteudo-sucesso p {
            font-size: 18px;
            color: #cccccc;
            margin-bottom: 35px;
        }
        .alerta-contato {
            background: rgba(255, 255, 0, 0.05);
            border-left: 4px solid #FFFF00;
            padding: 25px 30px;
            border-radius: 0 20px 20px 0;
            width: 100%;
            max-width: 550px;
        }
        .alerta-contato h3 {
            color: #FFFFFF;
            font-size: 22px;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .alerta-contato p {
            font-size: 15px;
            color: #aaaaaa;
            margin-bottom: 0;
            line-height: 1.5;
        }
        .alerta-contato strong {
            color: #FFFF00;
        }
        .imagem-sucesso-lado {
            flex: 1;
            height: 450px;
            border: 2px solid #FFFF00;
            border-radius: 60px 15px 15px 15px; 
            overflow: hidden;
            background-color: #121212;
        }
        .imagem-sucesso-lado img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            opacity: 0.9;
        }
        
        /* Celulares */
        @media (max-width: 768px) {
            .sucesso-container {
                flex-direction: column;
                text-align: center;
                gap: 40px;
            }
            .conteudo-sucesso {
                align-items: center;
            }
            .conteudo-sucesso h1 {
                font-size: 32px;
            }
            .alerta-contato {
                text-align: left;
                border-radius: 15px;
            }
            .imagem-sucesso-lado {
                width: 100%;
                max-width: 400px;
                height: 300px;
            }
        }
    </style>
</head>
<body>

    <div class="sucesso-container">
        <div class="conteudo-sucesso">
            <div class="icone-check-circulo">&#10003;</div>
            <h1>Sua solicitação foi<br><span>enviada com sucesso!</span></h1>
            <p>Parabéns por dar o primeiro passo para garantir a sua segurança.</p>
            
            <div class="alerta-contato">
                <h3>Estamos ligando agora!</h3>
                <p>Mantenha o seu celular por perto. Um monitor técnico da <strong>Guard</strong> entrará em contato com você em <strong>poucos instantes!</strong></p>
            </div>
        </div>
        
        <div class="imagem-sucesso-lado">
            <img src="imagens/guard-operator-monitor.png" alt="Central de Atendimento Guard">
        </div>
    </div>

</body>
</html>
