<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Meus Pedidos - Guard</title>
    <link rel="icon" type="image/webp" href="imagens/logo.webp">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Style.css">
</head>
<body style="background-color: #0a0a0a;">

    <header>
        <div id="header">
            <div id="logo-container"> 
                <a href="index.html"><img src="imagens/logo.webp" alt="Logo Guard" id="logo"></a>
            </div>
            <div class="panel-header-title">
                <span style="color: #fff; font-weight: 600;">MEUS PEDIDOS</span>
            </div>
            <div class="header-action-btn">
                <a href="store.html" style="text-decoration: none;">
                    <button class="header-submit-button">VOLTAR À LOJA</button>
                </a>
            </div>
        </div>
    </header>

    <main class="pedidos-wrapper">
        <h1 class="pedidos-title">Acompanhar Pedidos</h1>
        <p class="pedidos-subtitle">Verifique o status das suas compras recentes.</p>
        
        <div id="lista-pedidos" class="pedidos-grid">
            </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Credenciais do seu Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBLDntUspio2er8xe71wOCyObbYa-HaH20",
            authDomain: "loja-guard.firebaseapp.com",
            projectId: "loja-guard",
            storageBucket: "loja-guard.firebasestorage.app",
            messagingSenderId: "1084706871985",
            appId: "1:1084706871985:web:c3af274bfb7f99843d6090"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Função inteligente para decidir a cor do botão baseado no texto do status
        function obterClasseStatus(status) {
            const s = status ? status.toLowerCase() : '';
            if (s.includes('enviando') || s.includes('caminho')) return 'status-verde';
            if (s.includes('entregue')) return 'status-azul';
            return 'status-amarelo'; // Padrão para "Aguardando pagamento" ou erro
        }

        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const auth = getAuth(app);
        const db = getFirestore(app);

        // Monitora se o usuário está logado antes de buscar informações
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Usuário logado: executa a busca passando o UID dele
                carregarPedidosProtegidos(user.uid);
            } else {
                // Usuário deslogado: barra o acesso e joga para a tela de login
                alert("Sessão expirada ou não iniciada. Por favor, faça login.");
                window.location.href = "login.html";
            }
        });

        async function carregarPedidosProtegidos(userUid) {
            const container = document.getElementById('lista-pedidos');
            container.innerHTML = '<p style="color: #FFFF00; text-align: center;">Buscando seus pedidos...</p>';

            try {
                // MÁGICA DE SEGURANÇA: Filtra trazendo apenas documentos onde userId == ID do usuário logado
                const q = query(collection(db, "pedidos"), where("userId", "==", userUid));
                const querySnapshot = await getDocs(q);
                let html = '';

                if (querySnapshot.empty) {
                    container.innerHTML = '<p style="color: #888; text-align: center; margin-top: 20px;">Nenhum pedido encontrado para esta conta.</p>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const pedido = doc.data();
                    const idReal = doc.id;
                    const idCurto = idReal.substring(0, 8).toUpperCase();

                    let dataFormatada = pedido.data || "Data indisponível";
                    let nomeItem = pedido.item || "Equipamento Guard";
                    const total = pedido.total || "0,00";
                    const statusStr = pedido.status || "Aguardando pagamento";
                    const classeCss = obterClasseStatus(statusStr);

                    html += `
                        <div class="pedido-card">
                            <div class="pedido-header">
                                <div>
                                    <span class="pedido-id">Pedido #${idCurto}</span>
                                    <span class="pedido-data">${dataFormatada}</span>
                                </div>
                                <div class="pedido-badge ${classeCss}">${statusStr}</div>
                            </div>
                            <div class="pedido-body">
                                <p class="pedido-item">${nomeItem}</p>
                                <p class="pedido-total">R$ ${total}</p>
                            </div>
                            <div class="pedido-footer">
                                <a href="detalhes-pedido.html?id=${idReal}" style="text-decoration: none;">
                                    <button class="btn-detalhes">Ver Detalhes</button>
                                </a>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;

            } catch (error) {
                console.error("Erro:", error);
                container.innerHTML = '<p style="color: red; text-align: center;">Erro ao processar histórico.</p>';
            }
        }

        // Executa assim que a página abre
        carregarPedidos();
    </script>
</body>
</html>
