<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Finalizar Compra - Guard</title>
    <link rel="icon" type="image/webp" href="imagens/logo.webp">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Style.css">
</head>
<body>

    <header>
        <div id="header">
            <div id="logo-container"> 
                <a href="index.html"><img src="imagens/logo.webp" alt="Logo Guard" id="logo"></a>
            </div>
            <div class="panel-header-title">
                <span>CHECKOUT SEGURO</span>
            </div>
            <div class="header-action-btn">
                <a href="loja.html" style="text-decoration: none;">
                    <button class="header-submit-button"><div class="icon-circle-header">&#8249;</div> VOLTAR À LOJA</button>
                </a>
            </div>
        </div>
    </header>

    <main class="checkout-wrapper">
        <section class="checkout-section checkout-form">
            <h2>Detalhes da Entrega</h2>
            <form id="checkoutForm">
                
                <div class="form-row">
                    <div class="input-group">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" placeholder="Seu nome completo" required>
                    </div>
                    <div class="input-group">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" placeholder="000.000.000-00" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label for="email">E-mail</label>
                        <input type="text" id="email" placeholder="seu@email.com" required>
                    </div>
                    <div class="input-group">
                        <label for="telefone">Telefone / WhatsApp</label>
                        <input type="text" id="telefone" placeholder="(00) 00000-0000" required>
                    </div>
                </div>

                <h2 style="margin-top: 30px;">Endereço</h2>
                
                <div class="form-row">
                    <div class="input-group">
                        <label for="cep">CEP (Busca Automática)</label>
                        <input type="text" id="cep" placeholder="00000-000" maxlength="9" required>
                    </div>
                    <div class="input-group">
                        <label for="rua">Endereço</label>
                        <input type="text" id="rua" placeholder="Rua, Avenida, etc." required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label for="numero">Número</label>
                        <input type="text" id="numero" placeholder="Ex: 123" required>
                    </div>
                    <div class="input-group">
                        <label for="bairro">Bairro</label>
                        <input type="text" id="bairro" placeholder="Seu bairro" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" placeholder="Sua cidade" required>
                    </div>
                    <div class="input-group">
                        <label for="estado">Estado</label>
                        <input type="text" id="estado" placeholder="UF" maxlength="2" required>
                    </div>
                </div>

                <h2 style="margin-top: 30px;">Pagamento</h2>
                <div class="input-group">
                    <label for="pagamento">Forma de Pagamento</label>
                    <select id="pagamento" required>
                        <option value="pix">PIX (Aprovação Imediata)</option>
                        <option value="cartao">Cartão de Crédito</option>
                        <option value="boleto">Boleto Bancário</option>
                    </select>
                </div>

                <button type="submit" class="btn-panel-submit" style="margin-top: 20px; font-size: 1.2rem;">CONFIRMAR E PAGAR</button>
            </form>
        </section>

        <section class="checkout-section checkout-summary">
            <h2>Resumo do Pedido</h2>
            <div id="checkout-items-container">
                </div>
            
            <div class="summary-totals">
                <div class="summary-line">
                    <span>Subtotal</span>
                    <span id="checkout-subtotal">R$ 0,00</span>
                </div>
                <div class="summary-line">
                    <span>Frete Expresso</span>
                    <span id="checkout-frete" style="color: #4CAF50;">R$ 25,00</span>
                </div>
                <div class="summary-total-final">
                    <span>Total a Pagar</span>
                    <span id="checkout-total-final">R$ 0,00</span>
                </div>
            </div>
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const carrinho = JSON.parse(localStorage.getItem('guard_carrinho')) || [];
            const itemsContainer = document.getElementById('checkout-items-container');
            const subtotalEl = document.getElementById('checkout-subtotal');
            const totalFinalEl = document.getElementById('checkout-total-final');
            
            const valorFrete = 25.00; 

            if (carrinho.length === 0) {
                alert("O seu carrinho está vazio. Vamos levá-lo de volta para a loja.");
                window.location.href = "loja.html";
                return;
            }

            let subtotal = 0;

            // Renderiza os itens e soma
            carrinho.forEach(item => {
                const precoNumerico = parseFloat(item.preco.replace(/\./g, '').replace(',', '.'));
                const totalDoItem = precoNumerico * item.quantidade;
                subtotal += totalDoItem;

                itemsContainer.innerHTML += `
                    <div class="summary-item">
                        <div class="summary-item-info">
                            <img src="${item.imagem}" class="summary-item-img" alt="${item.titulo}" onerror="this.src='imagens/logo.webp'">
                            <div>
                                <div class="summary-item-title">${item.titulo}</div>
                                <div class="summary-item-qty">Qtd: ${item.quantidade}</div>
                            </div>
                        </div>
                        <div class="summary-item-price">R$ ${(totalDoItem).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
                    </div>
                `;
            });

            const totalFinal = subtotal + valorFrete;
            subtotalEl.textContent = 'R$ ' + subtotal.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            totalFinalEl.textContent = 'R$ ' + totalFinal.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

            // ==========================================
            // MÁSCARAS E PREVENÇÃO DE ENTRADA DE DADOS
            // ==========================================
            const nomeInput = document.getElementById('nome');
            const cpfInput = document.getElementById('cpf');
            const telefoneInput = document.getElementById('telefone');
            const cepInput = document.getElementById('cep');
            const emailInput = document.getElementById('email');

            // Impede números no nome enquanto digita
            nomeInput.addEventListener('input', (e) => {
                e.target.value = e.target.value.replace(/[0-9]/g, '');
            });

            // Máscara CPF (Trava em 11 dígitos estritos)
            cpfInput.addEventListener('input', (e) => {
                let v = e.target.value.replace(/\D/g, ""); // Tira tudo que não é número
                v = v.substring(0, 11); // Limita a exatamente 11 números
                
                // Aplica a formatação 000.000.000-00
                v = v.replace(/(\d{3})(\d)/, "$1.$2");
                v = v.replace(/(\d{3})(\d)/, "$1.$2");
                v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
                
                e.target.value = v;
            });

            // Máscara Telefone
            telefoneInput.addEventListener('input', (e) => {
                let v = e.target.value.replace(/\D/g, "");
                v = v.replace(/^(\d{2})(\d)/g, "($1) $2");
                v = v.replace(/(\d)(\d{4})$/, "$1-$2");
                e.target.value = v.substring(0, 15);
            });

            // Máscara CEP
            cepInput.addEventListener('input', (e) => {
                let v = e.target.value.replace(/\D/g, "");
                v = v.replace(/^(\d{5})(\d)/, "$1-$2");
                e.target.value = v.substring(0, 9);
            });

            // ==========================================
            // VALIDAÇÕES EM TEMPO REAL (Ao sair do campo)
            // ==========================================
            
            // Valida Nome
            nomeInput.addEventListener('blur', (e) => {
                const val = e.target.value.trim();
                if (val && val.split(' ').length < 2) {
                    alert('Por favor, informe o seu nome completo (Nome e Sobrenome).');
                    e.target.style.borderColor = 'red';
                } else {
                    e.target.style.borderColor = '';
                }
            });

            // Valida Email
            emailInput.addEventListener('blur', (e) => {
                const val = e.target.value.trim();
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (val && !emailRegex.test(val)) {
                    alert('Por favor, informe um e-mail válido.');
                    e.target.style.borderColor = 'red';
                } else {
                    e.target.style.borderColor = '';
                }
            });

            // Valida Telefone
            telefoneInput.addEventListener('blur', (e) => {
                if (e.target.value && e.target.value.length < 14) {
                    alert('Por favor, informe um telefone válido com DDD.');
                    e.target.style.borderColor = 'red';
                } else {
                    e.target.style.borderColor = '';
                }
            });

            // Função Matemática Oficial para Validar CPF
            function testaCPF(strCPF) {
                let Soma;
                let Resto;
                Soma = 0;
                strCPF = strCPF.replace(/\D/g, ""); // Remove pontuação
                
                if (strCPF == "00000000000" || strCPF.length !== 11) return false;

                for (i = 1; i <= 9; i++) Soma = Soma + parseInt(strCPF.substring(i - 1, i)) * (11 - i);
                Resto = (Soma * 10) % 11;

                if ((Resto == 10) || (Resto == 11)) Resto = 0;
                if (Resto != parseInt(strCPF.substring(9, 10))) return false;

                Soma = 0;
                for (i = 1; i <= 10; i++) Soma = Soma + parseInt(strCPF.substring(i - 1, i)) * (12 - i);
                Resto = (Soma * 10) % 11;

                if ((Resto == 10) || (Resto == 11)) Resto = 0;
                if (Resto != parseInt(strCPF.substring(10, 11))) return false;
                
                return true;
            }

            // Aplica a validação matemática ao sair do campo CPF
            cpfInput.addEventListener('blur', (e) => {
                const val = e.target.value;
                if (val && !testaCPF(val)) {
                    alert('O CPF informado é inválido. Verifique os números.');
                    e.target.style.borderColor = 'red';
                    e.target.value = ''; // Limpa o campo se for falso
                } else {
                    e.target.style.borderColor = '';
                }
            });

            // Busca Automática de CEP e Validação
            cepInput.addEventListener('blur', async (e) => {
                let cepVal = e.target.value.replace(/\D/g, ''); 
                if (cepVal.length === 8) {
                    try {
                        const res = await fetch(`https://viacep.com.br/ws/${cepVal}/json/`);
                        const data = await res.json();
                        if (!data.erro) {
                            document.getElementById('rua').value = data.logradouro;
                            document.getElementById('bairro').value = data.bairro;
                            document.getElementById('cidade').value = data.localidade;
                            document.getElementById('estado').value = data.uf;
                            e.target.style.borderColor = '';
                            document.getElementById('numero').focus(); 
                        } else {
                            alert("CEP não encontrado no sistema dos Correios.");
                            e.target.style.borderColor = 'red';
                        }
                    } catch (err) {
                        console.error("Erro na busca de CEP:", err);
                    }
                } else if (cepVal.length > 0) {
                    alert("O CEP precisa ter 8 números.");
                    e.target.style.borderColor = 'red';
                }
            });

            // ==========================================
            // SUBMISSÃO FINAL
            // ==========================================
            document.getElementById('checkoutForm').addEventListener('submit', (e) => {
                e.preventDefault(); 
                
                // Dupla checagem de segurança antes de prosseguir
                if (!testaCPF(cpfInput.value)) return alert("CPF Inválido. Corrija antes de finalizar.");
                if (nomeInput.value.trim().split(' ').length < 2) return alert("Preencha o nome completo.");
                
                const pagamento = document.getElementById('pagamento').options[document.getElementById('pagamento').selectedIndex].text;
                
                alert(`✅ Pedido Validado com Sucesso!\n\nDados confirmados matematicamente.\nO seu pedido de ${totalFinalEl.textContent} será processado via ${pagamento}.\n\nObrigado por escolher a Guard!`);
                
                localStorage.removeItem('guard_carrinho');
                window.location.href = "index.html";
            });
        });
    </script>
</body>
</html>
