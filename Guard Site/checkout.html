<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Finalizar Compra - Guard</title>
    <link rel="icon" type="image/webp" href="imagens/logo.webp">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Style.css">
    <style>
        /* Correção Anti-Tremulação (Flicker) para o Header */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: #000;
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
            will-change: transform;
        }

        /* Estilo da Seta de Voltar */
        .back-arrow { color: #86868b; transition: color 0.2s ease; display: flex; align-items: center; }
        .back-arrow:hover { color: #ffffff; }

        /* Ajuste do Header */
        #header { position: relative; display: flex; justify-content: space-between; align-items: center; padding: 0 24px; width: 100%; box-sizing: border-box; height: 80px; }
        
        .secure-badge { display: flex; align-items: center; gap: 6px; color: #32cd32; }
        
        .checkout-logo-img { height: 48px; width: auto; display: block; }
        .checkout-title-text { color: #fff; font-weight: 800; font-size: 1.15rem; letter-spacing: 0.5px; text-transform: uppercase; }

        @media (max-width: 768px) {
            #header { padding: 0 15px; height: 65px; }
            .secure-badge span { display: none; } 
            .checkout-logo-img { height: 35px; }
            .checkout-title-text { font-size: 0.95rem; }
        }

        /* ==========================================
           NOVOS ESTILOS DO CARTÃO DE ENDEREÇO
           ========================================== */
        .endereco-salvo-card {
            background-color: rgba(29, 29, 31, 0.6);
            border: 1px solid #424245;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            display: none; /* Oculto até ser preenchido pelo Firebase */
            position: relative;
        }
        
        .endereco-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }
        
        .endereco-nome { font-weight: 600; color: #fff; font-size: 1.05rem; }
        .endereco-telefone { color: #86868b; font-size: 0.9rem; }
        .endereco-badge { background-color: #0071e3; color: white; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; text-transform: uppercase; }
        
        .endereco-detalhes { color: #d2d2d7; font-size: 0.95rem; line-height: 1.4; margin-bottom: 12px; }
        
        .endereco-acoes { display: flex; gap: 15px; }
        .btn-link-action { background: none; border: none; padding: 0; color: #0071e3; font-size: 0.9rem; font-weight: 500; cursor: pointer; text-decoration: none; transition: color 0.2s; }
        .btn-link-action:hover { color: #66b4ff; }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
            cursor: pointer;
        }
        .checkbox-container input {
            accent-color: #0071e3;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .checkbox-container label {
            color: #d2d2d7;
            font-size: 0.95rem;
            cursor: pointer;
        }

        /* ==========================================
           MODAL DE "MEUS ENDEREÇOS" (TIPO SHOPEE)
           ========================================== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active { display: flex; opacity: 1; }

        .modal-content {
            background-color: #111;
            border: 1px solid #333;
            border-radius: 16px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            transform: translateY(20px);
            transition: transform 0.3s ease;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h3 { margin: 0; color: #fff; font-size: 1.2rem; }
        .modal-close { background: none; border: none; color: #86868b; font-size: 1.5rem; cursor: pointer; padding: 0; line-height: 1; }
        .modal-close:hover { color: #fff; }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            flex-grow: 1;
        }
        
        .modal-footer {
            padding: 15px 20px;
            border-top: 1px solid #333;
            display: flex;
            justify-content: flex-end;
        }

        .endereco-lista-item {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            padding: 15px;
            border: 1px solid #424245;
            border-radius: 12px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
        }
        .endereco-lista-item:hover { background-color: rgba(29, 29, 31, 0.4); }
        .endereco-lista-item.selected { border-color: #0071e3; background-color: rgba(0, 113, 227, 0.1); }
        
        .endereco-lista-radio { margin-top: 4px; accent-color: #0071e3; transform: scale(1.2); }
        
        .endereco-lista-info { flex-grow: 1; display: flex; flex-direction: column; gap: 4px; }
        .endereco-lista-info .nome-tel { color: #fff; font-weight: 500; font-size: 1rem; }
        .endereco-lista-info .nome-tel span { color: #86868b; font-weight: 400; font-size: 0.9rem; margin-left: 8px; }
        .endereco-lista-info .texto { color: #a0a0a5; font-size: 0.9rem; line-height: 1.4; }

        .btn-novo-endereco {
            background-color: transparent; border: 1px dashed #424245; border-radius: 12px;
            color: #d2d2d7; padding: 15px; text-align: center; cursor: pointer; width: 100%;
            font-size: 0.95rem; font-weight: 500; transition: all 0.2s;
            display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .btn-novo-endereco:hover { border-color: #fff; color: #fff; }

        @media (max-width: 480px) {
            .modal-content {
                width: 100%; max-width: none; border-radius: 20px 20px 0 0;
                position: absolute; bottom: 0; transform: translateY(100%);
            }
        }
    </style>
</head>
<body style="background-color: #000;">

    <header>
        <div id="header">
            <div style="display: flex; align-items: center; gap: 20px;">
                <a href="store.html" class="back-arrow" title="Voltar à Loja">
                    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </a>
                
                <div style="display: flex; align-items: center; gap: 15px;">
                    <a href="index.html" style="display: flex;"><img src="imagens/logo.webp" alt="Logo Guard" class="checkout-logo-img"></a>
                    <div style="height: 24px; width: 3px; background-color: #FFFF00; border-radius: 2px;"></div>
                    <span class="checkout-title-text">CHECKOUT SEGURO</span>
                </div>
            </div>

            <div class="header-action-btn secure-badge">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                <span style="font-size: 0.8rem; font-weight: 600;">100% SEGURO</span>
            </div>
        </div>
    </header>

    <main class="checkout-wrapper">
        <section class="checkout-section checkout-form">
            <h2>Detalhes Pessoais</h2>
            
            <form id="checkoutForm">
                <div class="form-row">
                    <div class="input-group">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" placeholder="Seu nome completo" required>
                    </div>
                    <div class="input-group">
                        <label for="cpf">CPF ou CNPJ</label>
                        <input type="text" id="cpf" placeholder="000.000.000-00" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label for="email">E-mail</label>
                        <input type="text" id="email" placeholder="seu@email.com" required>
                    </div>
                    <div class="input-group">
                        <label for="telefone">Telefone / WhatsApp</label>
                        <input type="text" id="telefone" placeholder="(00) 00000-0000" required>
                    </div>
                </div>

                <h2 style="margin-top: 30px; margin-bottom: 15px;">Endereço de Entrega</h2>

                <div id="card-endereco-selecionado" class="endereco-salvo-card">
                    <div class="endereco-header">
                        <span class="endereco-nome" id="card-nome">Carregando...</span>
                        <span class="endereco-telefone" id="card-telefone"></span>
                        <span class="endereco-badge" id="card-badge" style="display: none;">Padrão</span>
                    </div>
                    <div class="endereco-detalhes" id="card-endereco-texto"></div>
                    <div class="endereco-acoes">
                        <button type="button" class="btn-link-action" id="btn-mudar-endereco">Escolher outro endereço</button>
                        <button type="button" class="btn-link-action" id="btn-editar-endereco">Editar</button> 
                    </div>
                </div>

                <div id="bloco-inputs-endereco">
                    <div class="form-row">
                        <div class="input-group">
                            <label for="cep-frete">CEP</label>
                            <input type="text" id="cep-frete" placeholder="00000-000" maxlength="9">
                        </div>
                        <div class="input-group">
                            <label for="rua">Endereço</label>
                            <input type="text" id="rua" placeholder="Rua, Avenida, etc.">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="input-group">
                            <label for="numero">Número</label>
                            <input type="text" id="numero" placeholder="Ex: 123">
                        </div>
                        <div class="input-group">
                            <label for="bairro">Bairro</label>
                            <input type="text" id="bairro" placeholder="Seu bairro">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="input-group">
                            <label for="cidade">Cidade</label>
                            <input type="text" id="cidade" placeholder="Sua cidade">
                        </div>
                        <div class="input-group">
                            <label for="estado">Estado</label>
                            <input type="text" id="estado" placeholder="UF" maxlength="2">
                        </div>
                    </div>

                    <div id="auth-save-options" style="display: none;">
                        <div class="checkbox-container">
                            <input type="checkbox" id="chk-salvar-endereco" checked>
                            <label for="chk-salvar-endereco">Salvar este endereço para futuras compras</label>
                        </div>
                        <div class="checkbox-container">
                            <input type="checkbox" id="chk-endereco-padrao">
                            <label for="chk-endereco-padrao">Definir como meu endereço Padrão</label>
                        </div>
                    </div>
                </div>

                <h2 style="margin-top: 30px; margin-bottom: 15px;">Opções de Entrega</h2>
                <div id="frete-container" style="background-color: rgba(29, 29, 31, 0.4); border: 1px solid #424245; border-radius: 12px; padding: 16px; margin-bottom: 20px;">
                    <div id="frete-vazio" style="color: #a0a0a5; font-size: 0.95rem; text-align: center;">Informe ou selecione um endereço para ver as opções.</div>
                    <div id="frete-resultados" style="display: none; flex-direction: column; gap: 10px;"></div>
                </div>

                <h2 style="margin-top: 30px; margin-bottom: 15px;">Pagamento</h2>
                <div class="input-group">
                    <label for="pagamento">Forma de Pagamento</label>
                    <select id="pagamento" required>
                        <option value="pix">PIX (Aprovação Imediata)</option>
                        <option value="cartao">Cartão de Crédito</option>
                        <option value="boleto">Boleto Bancário</option>
                    </select>
                </div>

                <input type="hidden" id="editando-endereco-id" value="">

                <button type="submit" class="btn-panel-submit" id="btn-finalizar-pedido" style="margin-top: 20px; font-size: 1.2rem;">CONFIRMAR E PAGAR</button>
            </form>
        </section>

        <section class="checkout-section checkout-summary">
            <h2>Resumo do Pedido</h2>
            <div id="checkout-items-container"></div>
            
            <div class="summary-totals">
                <div class="summary-line">
                    <span>Subtotal</span>
                    <span id="checkout-subtotal">R$ 0,00</span>
                </div>
                <div class="summary-line">
                    <span>Frete Expresso</span>
                    <span id="checkout-frete" style="color: #4CAF50;">R$ 0,00</span>
                </div>
                <div class="summary-total-final">
                    <span>Total a Pagar</span>
                    <span id="checkout-total-final">R$ 0,00</span>
                </div>
            </div>
        </section>
    </main>

    <div class="modal-overlay" id="modal-enderecos">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Meus Endereços</h3>
                <button class="modal-close" id="fechar-modal">&times;</button>
            </div>
            <div class="modal-body">
                <div id="lista-enderecos-modal">
                    <p style="text-align:center; color:#888;">Procurando endereços...</p>
                </div>
                
                <button type="button" class="btn-novo-endereco" id="btn-add-novo-end">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Adicionar Novo Endereço
                </button>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-panel-submit" id="btn-confirmar-selecao" style="padding: 10px 20px;">Confirmar Seleção</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBLDntUspio2er8xe71wOCyObbYa-HaH20",
            authDomain: "loja-guard.firebaseapp.com",
            projectId: "loja-guard",
            storageBucket: "loja-guard.firebasestorage.app",
            messagingSenderId: "1084706871985",
            appId: "1:1084706871985:web:c3af274bfb7f99843d6090"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // VARIÁVEIS GLOBAIS
        let usuarioAtual = null;
        let listaDeEnderecos = []; 
        let enderecoSelecionado = null; 

        // ELEMENTOS UI DO ENDEREÇO
        const cardEnderecoSalvo = document.getElementById('card-endereco-selecionado');
        const blocoInputsEndereco = document.getElementById('bloco-inputs-endereco');
        const authSaveOptions = document.getElementById('auth-save-options');
        const editandoEnderecoId = document.getElementById('editando-endereco-id');

        // ELEMENTOS DO MODAL E FRETE
        const modalEnderecos = document.getElementById('modal-enderecos');
        const listaModal = document.getElementById('lista-enderecos-modal');
        const cepInput = document.getElementById('cep-frete');
        const freteResultados = document.getElementById('frete-resultados');
        const freteVazio = document.getElementById('frete-vazio');

        // =========================================
        // 1. CARREGAMENTO DO USUÁRIO E ENDEREÇOS
        // =========================================
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                usuarioAtual = user;
                authSaveOptions.style.display = 'block';
                
                document.getElementById('email').value = user.email || '';
                
                try {
                    const userRef = doc(db, "usuarios", user.uid);
                    const docSnap = await getDoc(userRef);
                    
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        if(data.nome) document.getElementById('nome').value = data.nome;
                        if(data.telefone) document.getElementById('telefone').value = data.telefone;
                        if(data.cpf) document.getElementById('cpf').value = data.cpf;

                        if (data.enderecos && Array.isArray(data.enderecos) && data.enderecos.length > 0) {
                            listaDeEnderecos = data.enderecos;
                            let endPadrao = listaDeEnderecos.find(e => e.isPadrao) || listaDeEnderecos[0];
                            aplicarEnderecoSelecionado(endPadrao);
                        } else if (data.endereco) {
                            const endMigrado = { id: Date.now().toString(), ...data.endereco, isPadrao: true };
                            listaDeEnderecos = [endMigrado];
                            aplicarEnderecoSelecionado(endMigrado);
                            await setDoc(userRef, { enderecos: listaDeEnderecos }, { merge: true });
                        }
                    } else if(user.displayName) {
                        document.getElementById('nome').value = user.displayName;
                    }
                } catch (error) {
                    console.error("Erro ao carregar dados do usuário:", error);
                }
            } else {
                usuarioAtual = null;
                authSaveOptions.style.display = 'none';
            }
        });

        // =========================================
        // 2. FUNÇÕES DE EXIBIÇÃO DE ENDEREÇO E FRETE
        // =========================================
        
        function aplicarEnderecoSelecionado(endObj) {
            enderecoSelecionado = endObj;

            blocoInputsEndereco.style.display = 'none';
            cardEnderecoSalvo.style.display = 'block';

            document.getElementById('cep-frete').value = endObj.cep || '';
            document.getElementById('rua').value = endObj.rua || '';
            document.getElementById('numero').value = endObj.numero || '';
            document.getElementById('bairro').value = endObj.bairro || '';
            document.getElementById('cidade').value = endObj.cidade || '';
            document.getElementById('estado').value = endObj.estado || '';
            
            document.getElementById('card-nome').textContent = document.getElementById('nome').value || "Destinatário";
            document.getElementById('card-telefone').textContent = document.getElementById('telefone').value || "";
            document.getElementById('card-badge').style.display = endObj.isPadrao ? 'inline-block' : 'none';

            const strEndereco = `${endObj.rua}, ${endObj.numero} ${endObj.complemento ? ' - '+endObj.complemento : ''}<br>${endObj.bairro}, ${endObj.cidade} - ${endObj.estado}<br>${endObj.cep}`;
            document.getElementById('card-endereco-texto').innerHTML = strEndereco;

            // Invoca o cálculo do frete para o CEP do cartão
            const cepLimpo = (endObj.cep || '').replace(/\D/g, '');
            if(cepLimpo.length === 8) buscarOpcoesDeFrete();
        }

        document.getElementById('btn-editar-endereco').addEventListener('click', () => {
            cardEnderecoSalvo.style.display = 'none';
            blocoInputsEndereco.style.display = 'block';
            
            editandoEnderecoId.value = enderecoSelecionado.id;
            document.getElementById('chk-salvar-endereco').checked = true;
            document.getElementById('chk-endereco-padrao').checked = enderecoSelecionado.isPadrao;
            document.getElementById('cep-frete').focus();
        });


        // =========================================
        // 3. LÓGICA DO MODAL "MEUS ENDEREÇOS"
        // =========================================
        document.getElementById('btn-mudar-endereco').addEventListener('click', () => {
            modalEnderecos.classList.add('active');
            renderizarListaModal();
        });

        document.getElementById('fechar-modal').addEventListener('click', () => {
            modalEnderecos.classList.remove('active');
        });

        document.getElementById('btn-add-novo-end').addEventListener('click', () => {
            modalEnderecos.classList.remove('active');
            
            document.getElementById('cep-frete').value = '';
            document.getElementById('rua').value = '';
            document.getElementById('numero').value = '';
            document.getElementById('bairro').value = '';
            document.getElementById('cidade').value = '';
            document.getElementById('estado').value = '';
            
            limparFrete();
            
            editandoEnderecoId.value = ""; 
            document.getElementById('chk-salvar-endereco').checked = true;
            document.getElementById('chk-endereco-padrao').checked = false;

            cardEnderecoSalvo.style.display = 'none';
            blocoInputsEndereco.style.display = 'block';
            document.getElementById('cep-frete').focus();
        });

        let radioSelecionadoModal = null;

        function renderizarListaModal() {
            if (listaDeEnderecos.length === 0) {
                listaModal.innerHTML = '<p style="text-align:center; color:#888;">Você não tem endereços salvos.</p>';
                return;
            }

            listaModal.innerHTML = '';
            radioSelecionadoModal = enderecoSelecionado ? enderecoSelecionado.id : listaDeEnderecos[0].id;

            listaDeEnderecos.forEach(end => {
                const isChecked = end.id === radioSelecionadoModal;
                const classeSelected = isChecked ? 'selected' : '';

                const div = document.createElement('div');
                div.className = `endereco-lista-item ${classeSelected}`;
                div.innerHTML = `
                    <input type="radio" name="endereco_modal" value="${end.id}" class="endereco-lista-radio" ${isChecked ? 'checked' : ''}>
                    <div class="endereco-lista-info">
                        <div class="nome-tel">${document.getElementById('nome').value || "Eu"} <span>${document.getElementById('telefone').value || ""}</span></div>
                        <div class="texto">
                            ${end.rua}, ${end.numero} ${end.complemento ? '- '+end.complemento : ''}<br>
                            ${end.bairro}, ${end.cidade} - ${end.estado}<br>
                            ${end.cep}
                        </div>
                        ${end.isPadrao ? '<span class="endereco-badge" style="width: max-content; margin-top: 5px;">Padrão</span>' : ''}
                    </div>
                `;

                div.addEventListener('click', () => {
                    document.querySelectorAll('.endereco-lista-item').forEach(el => el.classList.remove('selected'));
                    div.classList.add('selected');
                    div.querySelector('input').checked = true;
                    radioSelecionadoModal = end.id;
                });

                listaModal.appendChild(div);
            });
        }

        document.getElementById('btn-confirmar-selecao').addEventListener('click', () => {
            if (radioSelecionadoModal) {
                const encontrado = listaDeEnderecos.find(e => e.id === radioSelecionadoModal);
                if (encontrado) aplicarEnderecoSelecionado(encontrado);
            }
            modalEnderecos.classList.remove('active');
        });


        // =========================================
        // 4. LÓGICA DE FRETE E VIA CEP
        // =========================================
        function limparFrete() {
            freteResultados.style.display = 'none';
            freteVazio.style.display = 'block';
            valorFrete = 0.00;
            document.getElementById('checkout-frete').textContent = 'R$ 0,00';
            renderizarResumo();
        }

        function buscarOpcoesDeFrete() {
            freteVazio.style.display = 'none';
            freteResultados.style.display = 'flex';
            freteResultados.innerHTML = '<div style="color: #FFFF00; font-size: 0.9rem; padding: 10px; text-align: center;">A calcular opções de entrega...</div>';
            
            setTimeout(() => {
                const pacValor = 22.50;
                const sedexValor = 45.90;

                freteResultados.innerHTML = `
                    <div class="frete-opcao" id="opcao-pac" data-valor="${pacValor}" onclick="selecionarFrete(this)">
                        <div class="frete-info-container">
                            <div class="frete-radio-circle"></div>
                            <div>
                                <span class="frete-nome">Correios PAC</span>
                                <span class="frete-prazo">Entrega em até 8 dias úteis</span>
                            </div>
                        </div>
                        <div class="frete-valor">R$ ${pacValor.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</div>
                    </div>
                    <div class="frete-opcao" data-valor="${sedexValor}" onclick="selecionarFrete(this)">
                        <div class="frete-info-container">
                            <div class="frete-radio-circle"></div>
                            <div>
                                <span class="frete-nome">Correios SEDEX</span>
                                <span class="frete-prazo">Entrega em até 3 dias úteis</span>
                            </div>
                        </div>
                        <div class="frete-valor">R$ ${sedexValor.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</div>
                    </div>
                `;
                selecionarFrete(document.getElementById('opcao-pac'));
            }, 800);
        }

        cepInput.addEventListener('input', async (e) => {
            let v = e.target.value.replace(/\D/g, "");
            v = v.replace(/^(\d{5})(\d)/, "$1-$2");
            e.target.value = v.substring(0, 9);

            const cepLimpo = v.replace(/\D/g, '');

            if (cepLimpo.length === 8) {
                buscarOpcoesDeFrete(); // Chama o frete independente do ViaCep
                
                try {
                    const res = await fetch(`https://viacep.com.br/ws/${cepLimpo}/json/`);
                    const data = await res.json();
                    
                    if (!data.erro) {
                        document.getElementById('rua').value = data.logradouro || '';
                        document.getElementById('bairro').value = data.bairro || '';
                        document.getElementById('cidade').value = data.localidade || '';
                        document.getElementById('estado').value = data.uf || '';
                        limparErro(cepInput);
                        document.getElementById('numero').focus(); 
                    } else {
                        mostrarErro(cepInput, 'CEP não encontrado.');
                    }
                } catch (err) {
                    console.error("Erro na busca do CEP:", err);
                }
            } else if (cepLimpo.length < 8) {
                limparFrete();
            }
        });

        window.selecionarFrete = function(elemento) {
            document.querySelectorAll('.frete-opcao').forEach(el => el.classList.remove('selecionado'));
            elemento.classList.add('selecionado');
            
            valorFrete = parseFloat(elemento.getAttribute('data-valor'));
            const freteDisplay = document.getElementById('checkout-frete');
            if(freteDisplay) {
                freteDisplay.textContent = 'R$ ' + valorFrete.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            }
            renderizarResumo();
        };

        // =========================================
        // 5. LÓGICA DO CARRINHO E RESUMO
        // =========================================
        const urlParams = new URLSearchParams(window.location.search);
        const isDireto = urlParams.get('direto') === 'true';
        const storageKey = isDireto ? 'guard_compra_direta' : 'guard_carrinho';
        let itensCheckout = JSON.parse(localStorage.getItem(storageKey)) || [];
        
        const itemsContainer = document.getElementById('checkout-items-container');
        const subtotalEl = document.getElementById('checkout-subtotal');
        const totalFinalEl = document.getElementById('checkout-total-final');

        function renderizarResumo() {
            if (itensCheckout.length === 0) {
                alert("A sua sessão de compra está vazia. Vamos levá-lo de volta para a loja.");
                window.location.href = "store.html";
                return;
            }

            itemsContainer.innerHTML = '';
            let subtotal = 0;

            itensCheckout.forEach(item => {
                const precoNumerico = parseFloat(String(item.preco).replace(/\./g, '').replace(',', '.'));
                const totalDoItem = precoNumerico * item.quantidade;
                subtotal += totalDoItem;

                itemsContainer.innerHTML += `
                    <div class="summary-item">
                        <div class="summary-item-info">
                            <img src="${item.imagem}" class="summary-item-img" alt="${item.titulo}" onerror="this.src='imagens/logo.webp'">
                            <div>
                                <div class="summary-item-title">${item.titulo}</div>
                                <div class="summary-qty-controls">
                                    <button type="button" class="summary-qty-btn qty-minus" data-id="${item.id}">-</button>
                                    <input type="number" class="summary-qty-input qty-input" data-id="${item.id}" value="${item.quantidade}" min="1">
                                    <button type="button" class="summary-qty-btn qty-plus" data-id="${item.id}">+</button>
                                </div>
                            </div>
                        </div>
                        <div class="summary-item-price">R$ ${(totalDoItem).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
                    </div>
                `;
            });

            const totalFinal = subtotal + valorFrete;
            subtotalEl.textContent = 'R$ ' + subtotal.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            totalFinalEl.textContent = 'R$ ' + totalFinal.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            localStorage.setItem(storageKey, JSON.stringify(itensCheckout));
        }

        renderizarResumo();

        itemsContainer.addEventListener('click', (e) => {
            if (e.target.classList.contains('qty-plus')) {
                const item = itensCheckout.find(i => i.id === e.target.dataset.id);
                if (item) { item.quantidade += 1; renderizarResumo(); }
            }
            if (e.target.classList.contains('qty-minus')) {
                const index = itensCheckout.findIndex(i => i.id === e.target.dataset.id);
                if (index !== -1) {
                    if (itensCheckout[index].quantidade > 1) {
                        itensCheckout[index].quantidade -= 1;
                    } else {
                        itensCheckout.splice(index, 1);
                    }
                    renderizarResumo();
                }
            }
        });

        itemsContainer.addEventListener('change', (e) => {
            if (e.target.classList.contains('qty-input')) {
                let novaQuantidade = parseInt(e.target.value);
                if (isNaN(novaQuantidade) || novaQuantidade < 1) novaQuantidade = 1;
                const item = itensCheckout.find(i => i.id === e.target.dataset.id);
                if (item) { item.quantidade = novaQuantidade; renderizarResumo(); }
            }
        });

        // =========================================
        // 6. VALIDAÇÕES DE FORMULÁRIO E FINALIZAÇÃO
        // =========================================
        function mostrarErro(input, mensagem) {
            input.style.borderColor = '#ff4444';
            let pai = input.parentElement;
            let erroTag = pai.querySelector('.error-text');
            if (!erroTag) {
                erroTag = document.createElement('span');
                erroTag.className = 'error-text';
                pai.appendChild(erroTag);
            }
            erroTag.textContent = mensagem;
        }

        function limparErro(input) {
            input.style.borderColor = '';
            let pai = input.parentElement;
            let erroTag = pai.querySelector('.error-text');
            if (erroTag) erroTag.remove();
        }

        const nomeInput = document.getElementById('nome');
        const cpfInput = document.getElementById('cpf');
        const telefoneInput = document.getElementById('telefone');
        const emailInput = document.getElementById('email');

        nomeInput.addEventListener('input', (e) => { e.target.value = e.target.value.replace(/[0-9]/g, ''); });
        nomeInput.addEventListener('blur', (e) => {
            const val = e.target.value.trim();
            if (val && val.split(' ').length < 2) mostrarErro(e.target, 'Por favor, informe nome e sobrenome.');
            else limparErro(e.target);
        });

        cpfInput.addEventListener('input', (e) => {
            let v = e.target.value.replace(/\D/g, ""); 
            if (v.length <= 11) {
                v = v.replace(/(\d{3})(\d)/, "$1.$2");
                v = v.replace(/(\d{3})(\d)/, "$1.$2");
                v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
            } else {
                v = v.substring(0, 14);
                v = v.replace(/^(\d{2})(\d)/, "$1.$2");
                v = v.replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2.$3");
                v = v.replace(/\.(\d{3})(\d)/, ".$1/$2");
                v = v.replace(/(\d{4})(\d)/, "$1-$2");
            }
            e.target.value = v;
        });

        telefoneInput.addEventListener('input', (e) => {
            let v = e.target.value.replace(/\D/g, "");
            v = v.replace(/^(\d{2})(\d)/g, "($1) $2");
            v = v.replace(/(\d)(\d{4})$/, "$1-$2");
            e.target.value = v.substring(0, 15);
        });
        telefoneInput.addEventListener('blur', (e) => {
            if (e.target.value && e.target.value.length < 14) mostrarErro(e.target, 'O telefone precisa ter o DDD e o número.');
            else limparErro(e.target);
        });

        emailInput.addEventListener('blur', (e) => {
            const val = e.target.value.trim();
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (val && !emailRegex.test(val)) mostrarErro(e.target, 'Por favor, informe um e-mail válido.');
            else limparErro(e.target);
        });

        function testaCPF(strCPF) {
            let Soma = 0, Resto;
            strCPF = strCPF.replace(/\D/g, ""); 
            if (strCPF == "00000000000" || strCPF.length !== 11) return false;
            for (let i = 1; i <= 9; i++) Soma = Soma + parseInt(strCPF.substring(i - 1, i)) * (11 - i);
            Resto = (Soma * 10) % 11;
            if ((Resto == 10) || (Resto == 11)) Resto = 0;
            if (Resto != parseInt(strCPF.substring(9, 10))) return false;
            Soma = 0;
            for (let i = 1; i <= 10; i++) Soma = Soma + parseInt(strCPF.substring(i - 1, i)) * (12 - i);
            Resto = (Soma * 10) % 11;
            if ((Resto == 10) || (Resto == 11)) Resto = 0;
            if (Resto != parseInt(strCPF.substring(10, 11))) return false;
            return true;
        }

        function testaCNPJ(cnpj) {
            cnpj = cnpj.replace(/\D/g, '');
            if (cnpj.length !== 14 || /^(\d)\1+$/.test(cnpj)) return false;
            let tamanho = cnpj.length - 2;
            let numeros = cnpj.substring(0, tamanho);
            let digitos = cnpj.substring(tamanho);
            let soma = 0, pos = tamanho - 7;
            for (let i = tamanho; i >= 1; i--) {
                soma += numeros.charAt(tamanho - i) * pos--;
                if (pos < 2) pos = 9;
            }
            let resultado = soma % 11 < 2 ? 0 : 11 - soma % 11;
            if (resultado != digitos.charAt(0)) return false;
            tamanho = tamanho + 1;
            numeros = cnpj.substring(0, tamanho);
            soma = 0;
            pos = tamanho - 7;
            for (let i = tamanho; i >= 1; i--) {
                soma += numeros.charAt(tamanho - i) * pos--;
                if (pos < 2) pos = 9;
            }
            resultado = soma % 11 < 2 ? 0 : 11 - soma % 11;
            if (resultado != digitos.charAt(1)) return false;
            return true;
        }

        cpfInput.addEventListener('blur', (e) => {
            const val = e.target.value.replace(/\D/g, '');
            if (val.length > 0) {
                if (val.length <= 11) {
                    if (!testaCPF(val)) mostrarErro(e.target, 'CPF inválido.');
                    else limparErro(e.target);
                } else {
                    if (!testaCNPJ(val)) mostrarErro(e.target, 'CNPJ inválido.');
                    else limparErro(e.target);
                }
            } else limparErro(e.target);
        });

        document.getElementById('checkoutForm').addEventListener('submit', async (e) => {
            e.preventDefault(); 
            let temErro = false;

            // Validações básicas (Dados Pessoais)
            if (nomeInput.value.trim().split(' ').length < 2) { mostrarErro(nomeInput, 'Obrigatório.'); temErro = true; }
            if (telefoneInput.value.length < 14) { mostrarErro(telefoneInput, 'Obrigatório.'); temErro = true; }
            
            const valDoc = cpfInput.value.replace(/\D/g, '');
            if (valDoc.length <= 11 && !testaCPF(valDoc)) { mostrarErro(cpfInput, 'CPF Inválido.'); temErro = true; }
            else if (valDoc.length > 11 && !testaCNPJ(valDoc)) { mostrarErro(cpfInput, 'CNPJ Inválido.'); temErro = true; }

            // Valida os campos de endereço APENAS se o bloco estiver visível (ou seja, não usou o cartão salvo)
            if (blocoInputsEndereco.style.display !== 'none') {
                const checkEmpty = (el) => {
                    if(!el.value.trim()) { mostrarErro(el, 'Obrigatório.'); temErro = true; }
                    else { limparErro(el); }
                };
                if (cepInput.value.replace(/\D/g, '').length !== 8) { mostrarErro(cepInput, 'Obrigatório.'); temErro = true; }
                else { limparErro(cepInput); }
                
                checkEmpty(document.getElementById('rua'));
                checkEmpty(document.getElementById('numero'));
                checkEmpty(document.getElementById('bairro'));
                checkEmpty(document.getElementById('cidade'));
                checkEmpty(document.getElementById('estado'));
            }

            if (valorFrete === 0) {
                alert("Por favor, selecione uma opção de entrega.");
                temErro = true;
            }

            if (temErro || document.querySelectorAll('.error-text').length > 0) {
                return alert("Existem campos incorretos. Verifique os avisos vermelhos.");
            }
            
            const btnSalvar = document.getElementById('btn-finalizar-pedido');
            btnSalvar.textContent = "Processando...";
            btnSalvar.disabled = true;

            // Lógica de Salvar Endereço no BD
            if (usuarioAtual && blocoInputsEndereco.style.display !== 'none' && document.getElementById('chk-salvar-endereco').checked) {
                const novoEndereco = {
                    cep: document.getElementById('cep-frete').value,
                    rua: document.getElementById('rua').value.trim(),
                    numero: document.getElementById('numero').value.trim(),
                    bairro: document.getElementById('bairro').value.trim(),
                    cidade: document.getElementById('cidade').value.trim(),
                    estado: document.getElementById('estado').value.toUpperCase(),
                    isPadrao: document.getElementById('chk-endereco-padrao').checked,
                    id: editandoEnderecoId.value !== "" ? editandoEnderecoId.value : Date.now().toString()
                };

                if (novoEndereco.isPadrao) {
                    listaDeEnderecos.forEach(e => e.isPadrao = false);
                }

                if (editandoEnderecoId.value !== "") {
                    const index = listaDeEnderecos.findIndex(e => e.id === editandoEnderecoId.value);
                    if(index !== -1) listaDeEnderecos[index] = novoEndereco;
                } else {
                    if (listaDeEnderecos.length === 0) novoEndereco.isPadrao = true;
                    listaDeEnderecos.push(novoEndereco);
                }

                try {
                    await setDoc(doc(db, "usuarios", usuarioAtual.uid), {
                        nome: document.getElementById('nome').value.trim(),
                        telefone: document.getElementById('telefone').value,
                        cpf: document.getElementById('cpf').value,
                        enderecos: listaDeEnderecos
                    }, { merge: true });
                } catch(error) {
                    console.error("Falha ao salvar usuário no bd", error);
                }
            }

            const pagamento = document.getElementById('pagamento').options[document.getElementById('pagamento').selectedIndex].text;
            alert(`✅ Pedido Validado com Sucesso!\n\nO seu pedido de ${totalFinalEl.textContent} será processado via ${pagamento}.`);
            
            localStorage.removeItem(storageKey);
            window.location.href = "index.html";
        });
    </script>
</body>
