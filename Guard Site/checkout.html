<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Finalizar Compra - Guard</title>
    <link rel="icon" type="image/webp" href="imagens/logo.webp">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div id="header">
            <div id="logo-container"> 
                <a href="index.html"><img src="imagens/logo.webp" alt="Logo Guard" id="logo"></a>
            </div>
            <div class="panel-header-title">
                <span>CHECKOUT SEGURO</span>
            </div>
            <div class="header-action-btn">
                <a href="store.html" style="text-decoration: none;">
                    <button class="header-submit-button"><div class="icon-circle-header">&#8249;</div> VOLTAR À LOJA</button>
                </a>
            </div>
        </div>
    </header>

    <main class="checkout-wrapper">
        <section class="checkout-section checkout-form">
            <h2>Detalhes da Entrega</h2>
            <form id="checkoutForm">
                
                <div class="form-row">
                    <div class="input-group">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" placeholder="Seu nome completo" required>
                    </div>
                    <div class="input-group">
                        <label for="cpf">CPF ou CNPJ</label>
                        <input type="text" id="cpf" placeholder="000.000.000-00" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label for="email">E-mail</label>
                        <input type="text" id="email" placeholder="seu@email.com" required>
                    </div>
                    <div class="input-group">
                        <label for="telefone">Telefone / WhatsApp</label>
                        <input type="text" id="telefone" placeholder="(00) 00000-0000" required>
                    </div>
                </div>

                <h2 style="margin-top: 30px;">Endereço</h2>
                
                <div class="form-row">
                    <div style="margin-bottom: 20px;">
                        <label>CEP DE ENTREGA</label>
                        <div style="display: flex; gap: 10px; margin-top: 5px;">
                            <input type="text" id="cep-frete" placeholder="00000-000" maxlength="9" style="width: 100%;">
                        </div>
                        
                        <div id="frete-resultados" style="display: none; margin-top: 15px; flex-direction: column; gap: 10px;">
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="rua">Endereço</label>
                        <input type="text" id="rua" placeholder="Rua, Avenida, etc." required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label for="numero">Número</label>
                        <input type="text" id="numero" placeholder="Ex: 123" required>
                    </div>
                    <div class="input-group">
                        <label for="bairro">Bairro</label>
                        <input type="text" id="bairro" placeholder="Seu bairro" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" placeholder="Sua cidade" required>
                    </div>
                    <div class="input-group">
                        <label for="estado">Estado</label>
                        <input type="text" id="estado" placeholder="UF" maxlength="2" required>
                    </div>
                </div>

                <h2 style="margin-top: 30px;">Pagamento</h2>
                <div class="input-group">
                    <label for="pagamento">Forma de Pagamento</label>
                    <select id="pagamento" required>
                        <option value="pix">PIX (Aprovação Imediata)</option>
                        <option value="cartao">Cartão de Crédito</option>
                        <option value="boleto">Boleto Bancário</option>
                    </select>
                </div>

                <button type="submit" class="btn-panel-submit" style="margin-top: 20px; font-size: 1.2rem;">CONFIRMAR E PAGAR</button>
            </form>
        </section>

        <section class="checkout-section checkout-summary">
            <h2>Resumo do Pedido</h2>
            <div id="checkout-items-container">
            </div>
            
            <div class="summary-totals">
                <div class="summary-line">
                    <span>Subtotal</span>
                    <span id="checkout-subtotal">R$ 0,00</span>
                </div>
                <div class="summary-line">
                    <span>Frete Expresso</span>
                    <span id="checkout-frete" style="color: #4CAF50;">R$ 0,00</span>
                </div>
                <div class="summary-total-final">
                    <span>Total a Pagar</span>
                    <span id="checkout-total-final">R$ 0,00</span>
                </div>
            </div>
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // 1. LÓGICA DE SEPARAÇÃO DE CARRINHO VS COMPRA DIRETA
            const urlParams = new URLSearchParams(window.location.search);
            const isDireto = urlParams.get('direto') === 'true';
            const storageKey = isDireto ? 'guard_compra_direta' : 'guard_carrinho';
            let itensCheckout = JSON.parse(localStorage.getItem(storageKey)) || [];
            
            const itemsContainer = document.getElementById('checkout-items-container');
            const subtotalEl = document.getElementById('checkout-subtotal');
            const totalFinalEl = document.getElementById('checkout-total-final');
            let valorFrete = 0.00;

            // 2. FUNÇÃO DE RENDERIZAR RESUMO
            function renderizarResumo() {
                if (itensCheckout.length === 0) {
                    alert("A sua sessão de compra está vazia. Vamos levá-lo de volta para a loja.");
                    window.location.href = "store.html";
                    return;
                }

                itemsContainer.innerHTML = '';
                let subtotal = 0;

                itensCheckout.forEach(item => {
                    const precoNumerico = parseFloat(String(item.preco).replace(/\./g, '').replace(',', '.'));
                    const totalDoItem = precoNumerico * item.quantidade;
                    subtotal += totalDoItem;

                    itemsContainer.innerHTML += `
                        <div class="summary-item">
                            <div class="summary-item-info">
                                <img src="${item.imagem}" class="summary-item-img" alt="${item.titulo}" onerror="this.src='imagens/logo.webp'">
                                <div>
                                    <div class="summary-item-title">${item.titulo}</div>
                                    <div class="summary-qty-controls">
                                        <button type="button" class="summary-qty-btn qty-minus" data-id="${item.id}">-</button>
                                        <input type="number" class="summary-qty-input qty-input" data-id="${item.id}" value="${item.quantidade}" min="1">
                                        <button type="button" class="summary-qty-btn qty-plus" data-id="${item.id}">+</button>
                                    </div>
                                </div>
                            </div>
                            <div class="summary-item-price">R$ ${(totalDoItem).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
                        </div>
                    `;
                });

                const totalFinal = subtotal + valorFrete;
                subtotalEl.textContent = 'R$ ' + subtotal.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                totalFinalEl.textContent = 'R$ ' + totalFinal.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                localStorage.setItem(storageKey, JSON.stringify(itensCheckout));
            }

            renderizarResumo();

            // 3. EVENTOS DE QUANTIDADE NO CHECKOUT
            itemsContainer.addEventListener('click', (e) => {
                if (e.target.classList.contains('qty-plus')) {
                    const item = itensCheckout.find(i => i.id === e.target.dataset.id);
                    if (item) { item.quantidade += 1; renderizarResumo(); }
                }
                if (e.target.classList.contains('qty-minus')) {
                    const index = itensCheckout.findIndex(i => i.id === e.target.dataset.id);
                    if (index !== -1) {
                        if (itensCheckout[index].quantidade > 1) {
                            itensCheckout[index].quantidade -= 1;
                        } else {
                            itensCheckout.splice(index, 1);
                        }
                        renderizarResumo();
                    }
                }
            });

            itemsContainer.addEventListener('change', (e) => {
                if (e.target.classList.contains('qty-input')) {
                    let novaQuantidade = parseInt(e.target.value);
                    if (isNaN(novaQuantidade) || novaQuantidade < 1) novaQuantidade = 1;
                    const item = itensCheckout.find(i => i.id === e.target.dataset.id);
                    if (item) { item.quantidade = novaQuantidade; renderizarResumo(); }
                }
            });

            // 4. FUNÇÕES DE ERRO VISUAL E MÁSCARAS
            function mostrarErro(input, mensagem) {
                input.style.borderColor = '#ff4444';
                let pai = input.parentElement;
                let erroTag = pai.querySelector('.error-text');
                if (!erroTag) {
                    erroTag = document.createElement('span');
                    erroTag.className = 'error-text';
                    pai.appendChild(erroTag);
                }
                erroTag.textContent = mensagem;
            }

            function limparErro(input) {
                input.style.borderColor = '';
                let pai = input.parentElement;
                let erroTag = pai.querySelector('.error-text');
                if (erroTag) erroTag.remove();
            }

            const nomeInput = document.getElementById('nome');
            const cpfInput = document.getElementById('cpf');
            const telefoneInput = document.getElementById('telefone');
            const emailInput = document.getElementById('email');

            nomeInput.addEventListener('input', (e) => {
                e.target.value = e.target.value.replace(/[0-9]/g, '');
            });
            nomeInput.addEventListener('blur', (e) => {
                const val = e.target.value.trim();
                if (val && val.split(' ').length < 2) mostrarErro(e.target, 'Por favor, informe nome e sobrenome.');
                else limparErro(e.target);
            });

            cpfInput.addEventListener('input', (e) => {
                let v = e.target.value.replace(/\D/g, ""); 
                if (v.length <= 11) {
                    v = v.replace(/(\d{3})(\d)/, "$1.$2");
                    v = v.replace(/(\d{3})(\d)/, "$1.$2");
                    v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
                } else {
                    v = v.substring(0, 14);
                    v = v.replace(/^(\d{2})(\d)/, "$1.$2");
                    v = v.replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2.$3");
                    v = v.replace(/\.(\d{3})(\d)/, ".$1/$2");
                    v = v.replace(/(\d{4})(\d)/, "$1-$2");
                }
                e.target.value = v;
            });

            telefoneInput.addEventListener('input', (e) => {
                let v = e.target.value.replace(/\D/g, "");
                v = v.replace(/^(\d{2})(\d)/g, "($1) $2");
                v = v.replace(/(\d)(\d{4})$/, "$1-$2");
                e.target.value = v.substring(0, 15);
            });
            telefoneInput.addEventListener('blur', (e) => {
                if (e.target.value && e.target.value.length < 14) mostrarErro(e.target, 'O telefone precisa ter o DDD e o número.');
                else limparErro(e.target);
            });

            emailInput.addEventListener('blur', (e) => {
                const val = e.target.value.trim();
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (val && !emailRegex.test(val)) mostrarErro(e.target, 'Por favor, informe um e-mail válido.');
                else limparErro(e.target);
            });

            function testaCPF(strCPF) {
                let Soma = 0, Resto;
                strCPF = strCPF.replace(/\D/g, ""); 
                if (strCPF == "00000000000" || strCPF.length !== 11) return false;
                for (let i = 1; i <= 9; i++) Soma = Soma + parseInt(strCPF.substring(i - 1, i)) * (11 - i);
                Resto = (Soma * 10) % 11;
                if ((Resto == 10) || (Resto == 11)) Resto = 0;
                if (Resto != parseInt(strCPF.substring(9, 10))) return false;
                Soma = 0;
                for (let i = 1; i <= 10; i++) Soma = Soma + parseInt(strCPF.substring(i - 1, i)) * (12 - i);
                Resto = (Soma * 10) % 11;
                if ((Resto == 10) || (Resto == 11)) Resto = 0;
                if (Resto != parseInt(strCPF.substring(10, 11))) return false;
                return true;
            }

            function testaCNPJ(cnpj) {
                cnpj = cnpj.replace(/\D/g, '');
                if (cnpj.length !== 14 || /^(\d)\1+$/.test(cnpj)) return false;
                let tamanho = cnpj.length - 2;
                let numeros = cnpj.substring(0, tamanho);
                let digitos = cnpj.substring(tamanho);
                let soma = 0, pos = tamanho - 7;
                for (let i = tamanho; i >= 1; i--) {
                    soma += numeros.charAt(tamanho - i) * pos--;
                    if (pos < 2) pos = 9;
                }
                let resultado = soma % 11 < 2 ? 0 : 11 - soma % 11;
                if (resultado != digitos.charAt(0)) return false;
                tamanho = tamanho + 1;
                numeros = cnpj.substring(0, tamanho);
                soma = 0;
                pos = tamanho - 7;
                for (let i = tamanho; i >= 1; i--) {
                    soma += numeros.charAt(tamanho - i) * pos--;
                    if (pos < 2) pos = 9;
                }
                resultado = soma % 11 < 2 ? 0 : 11 - soma % 11;
                if (resultado != digitos.charAt(1)) return false;
                return true;
            }

            cpfInput.addEventListener('blur', (e) => {
                const val = e.target.value.replace(/\D/g, '');
                if (val.length > 0) {
                    if (val.length <= 11) {
                        if (!testaCPF(val)) mostrarErro(e.target, 'CPF inválido.');
                        else limparErro(e.target);
                    } else {
                        if (!testaCNPJ(val)) mostrarErro(e.target, 'CNPJ inválido.');
                        else limparErro(e.target);
                    }
                } else limparErro(e.target);
            });

            // =========================================
            // AUTOMAÇÃO DO CEP E FRETE
            // =========================================
            const cepInput = document.getElementById('cep-frete');
            const resultadosFrete = document.getElementById('frete-resultados');

            cepInput.addEventListener('input', async (e) => {
                let v = e.target.value.replace(/\D/g, "");
                v = v.replace(/^(\d{5})(\d)/, "$1-$2");
                e.target.value = v.substring(0, 9);

                const cepLimpo = v.replace(/\D/g, '');

                if (cepLimpo.length === 8) {
                    resultadosFrete.style.display = 'flex';
                    resultadosFrete.innerHTML = '<div style="color: #FFFF00; font-size: 0.9rem; padding: 10px;">A calcular frete e endereço...</div>';
                    
                    try {
                        const res = await fetch(`https://viacep.com.br/ws/${cepLimpo}/json/`);
                        const data = await res.json();
                        
                        if (!data.erro) {
                            document.getElementById('rua').value = data.logradouro || '';
                            document.getElementById('bairro').value = data.bairro || '';
                            document.getElementById('cidade').value = data.localidade || '';
                            document.getElementById('estado').value = data.uf || '';
                            limparErro(cepInput);
                            document.getElementById('numero').focus(); 
                        } else {
                            mostrarErro(cepInput, 'CEP não encontrado.');
                            resultadosFrete.style.display = 'none';
                            return; 
                        }
                    } catch (err) {
                        console.error("Erro na busca do CEP:", err);
                    }

                    setTimeout(() => {
                        const pacValor = 22.50;
                        const sedexValor = 45.90;

                        resultadosFrete.innerHTML = `
                            <div class="frete-opcao" id="opcao-pac" data-valor="${pacValor}" onclick="selecionarFrete(this)">
                                <div class="frete-info-container">
                                    <div class="frete-radio-circle"></div>
                                    <div>
                                        <span class="frete-nome">Correios PAC</span>
                                        <span class="frete-prazo">Entrega em até 8 dias úteis</span>
                                    </div>
                                </div>
                                <div class="frete-valor">R$ ${pacValor.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</div>
                            </div>
                            <div class="frete-opcao" data-valor="${sedexValor}" onclick="selecionarFrete(this)">
                                <div class="frete-info-container">
                                    <div class="frete-radio-circle"></div>
                                    <div>
                                        <span class="frete-nome">Correios SEDEX</span>
                                        <span class="frete-prazo">Entrega em até 3 dias úteis</span>
                                    </div>
                                </div>
                                <div class="frete-valor">R$ ${sedexValor.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</div>
                            </div>
                        `;
                        
                        selecionarFrete(document.getElementById('opcao-pac'));
                    }, 800);

                } else if (cepLimpo.length < 8) {
                    resultadosFrete.style.display = 'none';
                    resultadosFrete.innerHTML = '';
                    valorFrete = 0.00;
                    document.getElementById('checkout-frete').textContent = 'R$ 0,00';
                    renderizarResumo();
                }
            });

            window.selecionarFrete = function(elemento) {
                document.querySelectorAll('.frete-opcao').forEach(el => el.classList.remove('selecionado'));
                elemento.classList.add('selecionado');
                
                valorFrete = parseFloat(elemento.getAttribute('data-valor'));
                const freteDisplay = document.getElementById('checkout-frete');
                if(freteDisplay) {
                    freteDisplay.textContent = 'R$ ' + valorFrete.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                }
                
                renderizarResumo();
            };

            // FINALIZAR E VALIDAR COMPRA
            document.getElementById('checkoutForm').addEventListener('submit', (e) => {
                e.preventDefault(); 
                let temErro = false;

                if (nomeInput.value.trim().split(' ').length < 2) { mostrarErro(nomeInput, 'Obrigatório.'); temErro = true; }
                if (telefoneInput.value.length < 14) { mostrarErro(telefoneInput, 'Obrigatório.'); temErro = true; }
                if (cepInput.value.replace(/\D/g, '').length !== 8) { mostrarErro(cepInput, 'Obrigatório.'); temErro = true; }
                
                const valDoc = cpfInput.value.replace(/\D/g, '');
                if (valDoc.length <= 11 && !testaCPF(valDoc)) { mostrarErro(cpfInput, 'CPF Inválido.'); temErro = true; }
                else if (valDoc.length > 11 && !testaCNPJ(valDoc)) { mostrarErro(cpfInput, 'CNPJ Inválido.'); temErro = true; }

                if (temErro || document.querySelectorAll('.error-text').length > 0) {
                    return alert("Existem campos incorretos. Verifique os avisos vermelhos.");
                }
                
                const pagamento = document.getElementById('pagamento').options[document.getElementById('pagamento').selectedIndex].text;
                alert(`✅ Pedido Validado com Sucesso!\n\nO seu pedido de ${totalFinalEl.textContent} será processado via ${pagamento}.`);
                
                localStorage.removeItem(storageKey);
                window.location.href = "index.html";
            });
        });
    </script>
</body>
</html>
