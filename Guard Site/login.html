<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Iniciar Sessão - Guard</title>
    <link rel="icon" type="image/webp" href="imagens/logo.webp">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Style.css">
    <style>
        /* Estilos do Checklist de Senha (se já não estiverem no Style.css) */
        .check-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ff4444;
            transition: color 0.3s ease;
        }
        .check-item.valid {
            color: #32CD32;
        }
        .check-circle {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid #ff4444;
            background-color: transparent;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        .check-item.valid .check-circle {
            border-color: #32CD32;
            background-color: #32CD32;
        }
    </style>
</head>
<body style="background-color: #000; margin: 0; font-family: 'Fira Sans', sans-serif; color: #fff;">

    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-header">
                <img src="imagens/logo.webp" alt="Guard Logo" class="login-logo">

                <p id="login-subtitle">Inicie a sessão para gerenciar seus equipamentos e pedidos.</p>
            </div>

            <form id="auth-form" novalidate>
                <div id="cadastro-fields" style="display: none;">

                        <span class="error-text" id="error-nome" style="display:none; color:#ff4444; font-size:0.8rem; margin-top:4px; text-align:left;">Informe nome e sobrenome.</span>
                    </div>
                </div>

                <div class="apple-input-group">
                    <input type="email" id="auth-email" placeholder="E-mail" required>
                    <span class="error-text" id="error-email" style="display:none; color:#ff4444; font-size:0.8rem; margin-top:4px; text-align:left;">E-mail com formato inválido.</span>
                </div>
                
                <div class="apple-input-group">

                    <span class="error-text" id="error-password" style="display:none; color:#ff4444; font-size:0.8rem; margin-top:4px; text-align:left;"></span>
