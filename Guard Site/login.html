<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Iniciar Sessão - Guard</title>
    <link rel="icon" type="image/webp" href="imagens/logo.webp">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Style.css">
</head>
<body style="background-color: #000; margin: 0; font-family: 'Fira Sans', sans-serif; color: #fff;">

    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-header">
                <img src="imagens/logo.webp" alt="Guard Logo" class="login-logo">
                <h1 id="login-title">Guard ID</h1>
                <p id="login-subtitle">Inicie a sessão para gerenciar seus equipamentos e pedidos.</p>
            </div>

            <form id="auth-form" novalidate>
                <div id="cadastro-fields" style="display: none;">
                    <div class="apple-input-group">
                        <input type="text" id="auth-nome" placeholder="Nome Completo">
                        <span class="error-text" id="error-nome" style="display:none; color:#ff4444; font-size:0.8rem; margin-top:4px; text-align:left;">Informe nome e sobrenome (apenas letras).</span>
                    </div>
                </div>

                <div class="apple-input-group">
                    <input type="email" id="auth-email" placeholder="E-mail" required>
                    <span class="error-text" id="error-email" style="display:none; color:#ff4444; font-size:0.8rem; margin-top:4px; text-align:left;">E-mail com formato inválido.</span>
                </div>
                
                <div class="apple-input-group">
                    <input type="password" id="auth-password" placeholder="Senha" required>
                    
                    <div id="password-strength-container" style="display: none; margin-top: 8px; text-align: left;">
                        <div style="height: 4px; width: 100%; background-color: #333; border-radius: 2px; overflow: hidden; display: flex;">
                            <div id="strength-bar" style="height: 100%; width: 0%; transition: all 0.3s ease;"></div>
                        </div>
                        <span id="strength-text" style="font-size: 0.75rem; font-weight: 600; margin-top: 4px; display: inline-block;">Fraca</span>
                    </div>
                </div>

                <button type="submit" id="btn-submit" class="btn-apple-primary">Continuar</button>
            </form>

            <div class="login-footer-toggle">
                <span id="toggle-text">Não tem um Guard ID?</span>
                <a href="#" id="btn-toggle-mode">Crie o seu agora.</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBLDntUspio2er8xe71wOCyObbYa-HaH20",
            authDomain: "loja-guard.firebaseapp.com",
            projectId: "loja-guard",
            storageBucket: "loja-guard.firebasestorage.app",
            messagingSenderId: "1084706871985",
            appId: "1:1084706871985:web:c3af274bfb7f99843d6090"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let modoCadastro = false;
        let senhaValida = false;

        const btnToggle = document.getElementById('btn-toggle-mode');
        const cadastroFields = document.getElementById('cadastro-fields');
        const loginTitle = document.getElementById('login-title');
        const loginSubtitle = document.getElementById('login-subtitle');
        const toggleText = document.getElementById('toggle-text');
        const form = document.getElementById('auth-form');

        // Elementos de Validação
        const inputNome = document.getElementById('auth-nome');
        const inputEmail = document.getElementById('auth-email');
        const inputSenha = document.getElementById('auth-password');
        const strengthContainer = document.getElementById('password-strength-container');
        const strengthBar = document.getElementById('strength-bar');
        const strengthText = document.getElementById('strength-text');
        const errorNome = document.getElementById('error-nome');
        const errorEmail = document.getElementById('error-email');

        // Alternar Modos
        btnToggle.addEventListener('click', (e) => {
            e.preventDefault();
            modoCadastro = !modoCadastro;
            if (modoCadastro) {
                cadastroFields.style.display = 'block';
                strengthContainer.style.display = 'block';
                loginTitle.textContent = "Criar Guard ID";
                loginSubtitle.textContent = "Preencha seus dados para começar.";
                toggleText.textContent = "Já possui uma conta?";
                btnToggle.textContent = "Inicie sessão aqui.";
            } else {
                cadastroFields.style.display = 'none';
                strengthContainer.style.display = 'none';
                loginTitle.textContent = "Guard ID";
                loginSubtitle.textContent = "Inicie a sessão para gerenciar seus equipamentos e pedidos.";
                toggleText.textContent = "Não tem um Guard ID?";
                btnToggle.textContent = "Crie o seu agora.";
                limparErros();
            }
        });

        // ==========================================
        // REGRAS DE VALIDAÇÃO
        // ==========================================
        
        function limparErros() {
            errorNome.style.display = 'none';
            errorEmail.style.display = 'none';
            inputNome.style.borderColor = '#424245';
            inputEmail.style.borderColor = '#424245';
        }

        // Validação de Nome (Sem números, 2 palavras min)
        inputNome.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[0-9]/g, ''); // Remove números na hora
        });

        function validarNome() {
            if (!modoCadastro) return true;
            const val = inputNome.value.trim();
            if (val.split(' ').length < 2) {
                errorNome.style.display = 'block';
                inputNome.style.borderColor = '#ff4444';
                return false;
            }
            errorNome.style.display = 'none';
            inputNome.style.borderColor = '#FFFF00';
            return true;
        }

        // Validação de E-mail
        function validarEmail() {
            const val = inputEmail.value.trim();
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(val)) {
                errorEmail.style.display = 'block';
                inputEmail.style.borderColor = '#ff4444';
                return false;
            }
            errorEmail.style.display = 'none';
            inputEmail.style.borderColor = modoCadastro ? '#FFFF00' : '#424245';
            return true;
        }

        // Validação de Força da Senha
        inputSenha.addEventListener('input', (e) => {
            if (!modoCadastro) return;
            
            const pwd = e.target.value;
            const hasUpper = /[A-Z]/.test(pwd);
            const hasLower = /[a-z]/.test(pwd);
            const hasNumber = /[0-9]/.test(pwd);
            const hasSequence = /(012|123|234|345|456|567|678|789|890)/.test(pwd);
            
            let forca = 0;
            
            if (pwd.length >= 6) forca++;
            if (hasUpper && hasLower) forca++;
            if (hasNumber) forca++;
            if (pwd.length >= 8 && /[!@#$%^&*]/.test(pwd)) forca++;
            
            // Penaliza se tiver sequência numérica
            if (hasSequence) forca = 1;

            if (pwd.length === 0) {
                strengthBar.style.width = '0%';
                strengthText.textContent = '';
                senhaValida = false;
            } else if (forca <= 1 || !hasUpper || !hasLower || !hasNumber || hasSequence) {
                strengthBar.style.width = '33%';
                strengthBar.style.backgroundColor = '#ff4444';
                strengthText.textContent = 'Fraca (Exige Maiúscula, Minúscula, Número e sem sequências)';
                strengthText.style.color = '#ff4444';
                senhaValida = false;
            } else if (forca === 2 || forca === 3) {
                strengthBar.style.width = '66%';
                strengthBar.style.backgroundColor = '#FFFF00';
                strengthText.textContent = 'Média';
                strengthText.style.color = '#FFFF00';
                senhaValida = true;
            } else {
                strengthBar.style.width = '100%';
                strengthBar.style.backgroundColor = '#32CD32';
                strengthText.textContent = 'Forte';
                strengthText.style.color = '#32CD32';
                senhaValida = true;
            }
        });

        // Eventos Blur
        inputNome.addEventListener('blur', validarNome);
        inputEmail.addEventListener('blur', validarEmail);

        // ==========================================
        // SUBMISSÃO DO FORMULÁRIO
        // ==========================================
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            limparErros();

            const isEmailValid = validarEmail();
            const isNomeValid = validarNome();

            if (modoCadastro) {
                if (!isEmailValid || !isNomeValid) return alert("Verifique os campos em vermelho.");
                if (!senhaValida) return alert("A senha é muito fraca. Siga os requisitos exibidos na barra.");
                
                try {
                    const btn = document.getElementById('btn-submit');
                    btn.textContent = "Criando...";
                    
                    const userCredential = await createUserWithEmailAndPassword(auth, inputEmail.value.trim(), inputSenha.value);
                    const user = userCredential.user;

                    // Salva apenas nome, e-mail e data no Firebase
                    await setDoc(doc(db, "usuarios", user.uid), {
                        nome: inputNome.value.trim(),
                        email: inputEmail.value.trim(),
                        dataCadastro: new Date()
                    });

                    alert("Guard ID criado com sucesso!");
                    window.location.href = "store.html";
                } catch (error) {
                    let msg = error.message;
                    if(error.code === 'auth/email-already-in-use') msg = "Este e-mail já está cadastrado.";
                    alert("Erro ao criar conta: " + msg);
                    document.getElementById('btn-submit').textContent = "Continuar";
                }
            } else {
                if (!isEmailValid) return;
                
                try {
                    document.getElementById('btn-submit').textContent = "Acessando...";
                    await signInWithEmailAndPassword(auth, inputEmail.value.trim(), inputSenha.value);
                    window.location.href = "meus-pedidos.html";
                } catch (error) {
                    let msg = "E-mail ou senha incorretos.";
                    if(error.code === 'auth/too-many-requests') msg = "Conta temporariamente bloqueada por muitas tentativas.";
                    alert(msg);
                    document.getElementById('btn-submit').textContent = "Continuar";
                }
            }
        });
    </script>
</body>
</html>
