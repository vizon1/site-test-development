<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Painel Administrativo - Guard</title>
    <link rel="icon" type="image/webp" href="imagens/logo.webp">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Style.css">
    <style>
        /* Correção de Overflow e Header */
        body {
            overflow-x: hidden;
            width: 100%;
            margin: 0;
            padding-top: 80px; /* Garante que o header não corte o conteúdo */
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            background: #000;
        }

        .panel-container {
            display: flex;
            flex-direction: row;
            gap: 40px;
            max-width: 1200px;
            margin: 40px auto 80px;
            padding: 0 24px;
            box-sizing: border-box;
            align-items: flex-start;
        }

        .panel-form-section {
            flex: 1.5;
            background-color: #0a0a0a;
            border: 1px solid #222;
            border-radius: 20px;
            padding: 32px;
            box-sizing: border-box;
        }

        .panel-preview-section {
            flex: 1;
            position: sticky;
            top: 100px;
            background-color: #0a0a0a;
            border: 1px solid #222;
            border-radius: 20px;
            padding: 32px;
            box-sizing: border-box;
        }

        /* Estilo responsivo para o Preview no Mobile */
        @media (max-width: 900px) {
            body { padding-top: 65px; }
            .panel-container { flex-direction: column; padding: 0 16px; }
            
            /* Esta classe controla a ordem no mobile */
            .order-mobile-last { order: 2; }
            .panel-preview-section { order: 1; margin-bottom: 20px; }
        }

        .input-group { display: flex; flex-direction: column; width: 100%; margin-bottom: 20px; }
        .input-group label { font-size: 0.75rem; color: #86868b; margin-bottom: 8px; font-weight: 600; text-transform: uppercase; }
        .input-group input, .input-group select, .input-group textarea {
            background-color: #1c1c1e; border: 1.5px solid #333; color: #fff;
            padding: 16px; border-radius: 12px; font-size: 1rem; width: 100%; box-sizing: border-box;
        }
        
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        .btn-panel-submit {
            background-color: #FFFF00; color: #000; border: none; padding: 22px;
            border-radius: 14px; font-weight: 800; cursor: pointer; width: 100%;
            text-transform: uppercase; margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <div id="header">
            <div id="logo-container"> 
                <a href="index.html"><img src="imagens/logo.webp" alt="Logo Guard" id="logo"></a>
            </div>
            <div class="panel-header-title"><span>PAINEL DE CONTROLE</span></div>
            <div class="header-action-btn">
                <a href="store.html"><button class="header-submit-button">VER LOJA</button></a>
            </div>
        </div>
    </header>

    <main class="panel-container">
        <section class="panel-form-section order-mobile-last">
            <form id="productForm">
                <h2>Adicionar Novo Produto</h2>
                
                <div class="input-group">
                    <label for="productTitle">Título</label>
                    <input type="text" id="productTitle" required>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label for="productCategory">Categoria</label>
                        <select id="productCategory" required>
                            <option value="cameras">Câmeras</option>
                            <option value="dvrs">DVRs</option>
                            <option value="alarmes">Alarmes</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="productPrice">Preço</label>
                        <input type="text" id="productPrice" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label for="productWeight">Peso (kg)</label>
                        <input type="number" id="productWeight" step="0.01" required>
                    </div>
                    <div class="input-group">
                        <label for="productHeight">Altura (cm)</label>
                        <input type="number" id="productHeight" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="productDescription">Descrição</label>
                    <textarea id="productDescription" rows="3" required></textarea>
                </div>

                <div class="input-group">
                    <label for="productImageUrl">Link da Imagem</label>
                    <input type="url" id="productImageUrl" required>
                </div>

                <div class="panel-preview-section" id="previewArea">
                    <h3>Visualização</h3>
                    <div class="shop-card" id="livePreviewCard" style="margin: 0;">
                        <span class="shop-card-category" id="previewCategory">Câmeras</span>
                        <div class="shop-card-img"><img id="previewImg" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 24 24' fill='%23333'><path d='M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z'/></svg>"></div>
                        <div class="shop-card-body">
                            <h4 id="previewTitle">Nome do Equipamento</h4>
                            <div class="shop-card-price" id="previewPrice">R$ 0,00</div>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-panel-submit">PUBLICAR ITEM</button>
            </form>
        </section>
    </main>

    <script type="module">
        // [Seu script Firebase permanece o mesmo, certifique-se apenas de capturar os novos inputs de logística]
    </script>
</body>
</html>
