<head>
    <title>Loja Oficial Guard - Equipamentos de Segurança</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Style.css">
    <style>
        /* ==========================================
           CABEÇALHO NÍVEL APPLE (ANTI-TREMULAÇÃO)
           ========================================== */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: rgba(15, 15, 15, 0.5) !important;
            backdrop-filter: blur(25px) !important;
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid transparent;
            width: 100%;
            transition: background-color 0.3s ease, border-color 0.3s ease;
            transform: translateZ(0); /* Anti-Flicker */
            -webkit-transform: translateZ(0);
            will-change: transform;
        }

        header.header-scrolled {
            background-color: rgba(10, 10, 10, 0.85) !important; /* Escurece */
            border-bottom: 1px solid rgba(255, 255, 255, 0.08); /* Mostra linha */
        }

        #header {
            position: relative; /* Ancoragem para o menu central absoluto */
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            height: 86px; /* Altura Premium (Maior) */
            padding: 0 24px;
            box-sizing: border-box;
            transition: height 0.3s ease; /* Animação sem flicking */
        }

        header.header-scrolled #header {
            height: 60px; /* Encolhe suavemente */
        }

        #logo-container img {
            height: 60px;
            width: auto;
            display: block;
            transition: height 0.3s ease;
        }

        header.header-scrolled #logo-container img {
            height: 45px; /* Logo encolhe para acompanhar */
        }

        /* O SEGREDO DO MENU CENTRALIZADO E FIXO */
        #nav-container {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
        }

        #navigation-bar {
            display: flex;
            gap: 28px;
            list-style: none;
            padding: 0;
            margin: 0;
            align-items: center;
        }

        #navigation-bar a {
            color: #d2d2d7;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            transition: color 0.2s ease;
            white-space: nowrap; /* Impede os textos de quebrarem/tremerem */
        }

        #navigation-bar a:hover { color: #ffffff; }

        #navigation-bar a.active-nav {
            color: #FFFF00;
            font-weight: 600;
            border-bottom: 2px solid #FFFF00;
            padding-bottom: 4px;
        }

        /* Agrupamento da Direita */
        #desktop-cart-group {
            display: flex !important; 
            align-items: center;
            gap: 20px;
        }

        #open-cart-btn {
            cursor: pointer;
            color: #d2d2d7;
            display: flex;
            align-items: center;
            position: relative;
            transition: color 0.2s ease;
        }
        #open-cart-btn:hover { color: #ffffff; }

        #cart-count {
            position: absolute;
            top: -6px;
            right: -8px;
            background: #ff3b30;
            color: white;
            border-radius: 12px;
            padding: 2px 5px;
            font-size: 0.65rem;
            font-weight: 700;
            min-width: 16px;
            text-align: center;
            box-sizing: border-box;
            border: 2px solid rgba(10, 10, 10, 0.85);
        }

        /* Espaço Fixo e Alinhado à Direita para Autenticação */
        #auth-section {
            display: flex;
            align-items: center;
            justify-content: flex-end; /* Cresce da direita para a esquerda */
            border-left: 1px solid rgba(255, 255, 255, 0.15);
            padding-left: 20px;
            height: 28px;
            min-width: 155px; /* Aumentado para garantir espaço do login/cadastre-se */
        }

        .auth-link { color: #86868b; text-decoration: none; transition: color 0.2s ease; font-size: 0.85rem; font-weight: 500; white-space: nowrap; }
        .auth-link:hover { color: #ffffff; }
        .auth-separator { color: #424245; font-size: 0.8rem; margin: 0 8px; }

        #logged-in-ui { display: flex; align-items: center; gap: 10px; cursor: pointer; position: relative; }
        #logged-in-ui:hover #user-first-name { color: #ffffff; }
        #user-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 1px solid #424245; transition: transform 0.2s; }
        #user-first-name { font-size: 0.9rem; font-weight: 500; color: #d2d2d7; transition: color 0.2s ease; white-space: nowrap; }

        .profile-dropdown {
            display: none; position: absolute; top: 100%; right: 0; margin-top: 20px;
            background-color: #1d1d1f; border: 1px solid #424245; border-radius: 12px;
            width: 200px; flex-direction: column; overflow: hidden; z-index: 1000; box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }
        .profile-dropdown.active { display: flex; animation: fadeIn 0.2s ease forwards; }
        .dropdown-item { padding: 12px 16px; color: #f5f5f7; text-decoration: none; font-size: 0.9rem; transition: background-color 0.2s ease; display: flex; align-items: center; }
        .dropdown-item:hover { background-color: #2c2c2e; }
        .dropdown-divider { height: 1px; background-color: #424245; margin: 4px 0; }
        .dropdown-item.logout { color: #ff4444; }
        .dropdown-item.logout:hover { background-color: rgba(255, 68, 68, 0.1); }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        /* ==========================================
           RESPONSIVIDADE INTELIGENTE (1050px até 769px)
           ========================================== */
        @media (min-width: 769px) and (max-width: 1050px) {
            #navigation-bar { gap: 14px; } 
            #navigation-bar a { font-size: 0.75rem; } 
            #desktop-cart-group { gap: 14px; }
            #auth-section { padding-left: 14px; }
            #user-first-name { display: none; } /* Oculta o nome, mantem a foto */
        }

        /* Mobile (Abaixo de 768px) */
        @media (max-width: 768px) {
            #nav-container { display: none; }
            #desktop-cart-group { display: none !important; }
            #header { padding: 0 15px; height: 60px !important; } /* Fixa altura no mobile */
            #logo-container img { height: 32px !important; } /* Fixa tamanho logo no mobile */
        }
    </style>
</head>
