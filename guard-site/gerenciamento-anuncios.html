<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Gerenciar Anúncios - Admin Guard</title>
    <link rel="icon" type="image/webp" href="imagens/logo.webp">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&family=Fira+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Style.css">
    <style>
        /* =========================================================
           VARIÁVEIS APPLE DARK MODE E RESET
           ========================================================= */
        :root {
            --bg-color: #000000;
            --surface-color: rgba(28, 28, 30, 0.6);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f5f5f7;
            --text-secondary: #86868b;
            --apple-red: #ff453a;
            --accent: #FFFF00;
        }

        html, body {
            overflow-x: hidden; width: 100%; margin: 0; padding: 0;
            background-color: var(--bg-color); color: var(--text-primary);
            font-family: 'Fira Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-image: radial-gradient(circle at 50% 0%, rgba(255,255,0,0.02) 0%, transparent 60%);
            -webkit-font-smoothing: antialiased;
        }

        /* =========================================================
           CABEÇALHO ADMINISTRATIVO BLINDADO
           ========================================================= */
        header {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 1000;
        }
        .header-content {
            max-width: 1200px; margin: 0 auto; padding: 0 24px; height: 70px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .back-arrow { 
            color: var(--text-secondary); text-decoration: none; display: flex; align-items: center; 
            font-weight: 500; font-size: 1rem; transition: color 0.2s ease; gap: 4px; padding-bottom: 0 !important; border-bottom: 0 !important;
        }
        .back-arrow:hover { color: #ffffff; }
        
        .admin-title {
            color: var(--apple-red); font-weight: 700; font-size: 1.1rem; 
            letter-spacing: 1.5px; text-transform: uppercase;
        }
        
        .store-link {
            background: rgba(255, 255, 255, 0.1); color: #fff; text-decoration: none;
            padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 600;
            transition: all 0.2s ease; display: flex; align-items: center; gap: 6px;
        }
        .store-link:hover { background: rgba(255, 255, 255, 0.2); }

        /* =========================================================
           LAYOUT PRINCIPAL E TABELA
           ========================================================= */
        .panel-container {
            display: block; 
            max-width: 1200px; margin: 40px auto 20px; padding: 0 20px; 
            width: 100%; box-sizing: border-box;
        }
        
        .page-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; margin-top: 120px; width: 100%;
        }
        .page-header h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 30px; margin-top: 10px; letter-spacing: -0.5px;}
        
        .btn-novo-anuncio {
            background-color: #000; color: #fff; text-decoration: none; border: 2px dashed rgba(255, 255, 255, 0.15); cursor: pointer;
            padding: 12px 24px; border-radius: 12px; font-weight: 800; font-size: 0.95rem; display: inline-block;
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s; text-transform: uppercase;
        }
        .btn-novo-anuncio:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255, 255, 0, 0.2); background-color: #fff433; }

        .table-wrapper {
            background: var(--surface-color); border: 1px solid var(--border-color);
            border-radius: 24px; padding: 0px 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            width: 100%; box-sizing: border-box;
        }

        .admin-table { 
            width: 100%; border-collapse: collapse;
        }
        .admin-table th {
            text-align: left; padding: 15px 10px; color: var(--text-secondary); 
            font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(255,255,255,0.1); border-radius: 15px;
        }
        .admin-table td {
            padding: 18px 10px; vertical-align: middle; border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.95rem; color: #fff; font-weight: 500;
        }
        .admin-table tbody tr:hover { background-color: rgba(255,255,255,0.02); }
        .admin-table tbody tr:last-child td { border-bottom: none; }

        .prod-img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; border: 1px solid #333; background: #111; }
        .prod-title { font-weight: 600; display: block; line-height: 1.3; }
        .badge-cat { background: #222; padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; color: #d2d2d7; text-transform: uppercase;}

        .btn-action {
            background: none; border: none; padding: 8px 14px; border-radius: 8px; font-size: 0.85rem; 
            font-weight: 600; cursor: pointer; transition: all 0.2s ease;
        }
        .btn-edit { background: rgba(255,255,255,0.1); color: #fff; margin-right: 8px; }
        .btn-edit:hover { background: rgba(255,255,255,0.2); }
        .btn-delete { background: rgba(255, 69, 58, 0.1); color: var(--apple-red); }
        .btn-delete:hover { background: rgba(255, 69, 58, 0.2); }

        /* =========================================================
           MODAL DE EDIÇÃO APPLE
           ========================================================= */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 2000;
            display: none; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s ease;
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        
        .modal-content {
            background-color: #111; border: 1px solid rgba(255,255,255,0.1); border-radius: 20px;
            width: 95%; max-width: 700px; max-height: 85vh; display: flex; flex-direction: column;
            transform: translateY(20px) scale(0.98); transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8); overflow: hidden;
        }
        .modal-overlay.active .modal-content { transform: translateY(0) scale(1); }

        .modal-header { padding: 24px 30px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { margin: 0; color: #fff; font-size: 1.25rem; font-weight: 700;}
        .modal-close { background: #222; border: none; color: #86868b; width: 32px; height: 32px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .modal-close:hover { color: #fff; background: #333; }

        .modal-body { padding: 30px; overflow-y: auto; flex-grow: 1; }
        
        .modal-footer { padding: 20px 30px; border-top: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: flex-end; gap: 15px;}
        .btn-cancelar { background: transparent; color: #86868b; border: 1px solid #424245; padding: 12px 24px; border-radius: 10px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-cancelar:hover { color: #fff; border-color: #666; background: rgba(255,255,255,0.05);}
        .btn-salvar-modal { background-color: var(--accent); color: #000; border: none; padding: 12px 32px; border-radius: 10px; font-size: 0.95rem; font-weight: 800; cursor: pointer; transition: all 0.2s; text-transform: uppercase; }
        .btn-salvar-modal:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255, 255, 0, 0.2); background-color: #fff433; }

        /* Inputs Modal */
        .form-row { display: flex; gap: 20px; width: 100%; margin-bottom: 15px;}
        .input-group { display: flex; flex-direction: column; width: 100%; margin-bottom: 15px; }
        .input-group label { font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; }
        .input-group input, .input-group select, .input-group textarea {
            background-color: rgba(0,0,0,0.4); border: 1.5px solid rgba(255,255,255,0.1);
            color: #fff; padding: 14px 16px; border-radius: 12px; font-size: 0.95rem; font-family: inherit; transition: all 0.3s ease; outline: none; width: 100%; box-sizing: border-box;
        }
        .input-group select {
            appearance: none; -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2386868b%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat; background-position: right 15px top 50%; background-size: 12px auto; cursor: pointer;
        }
        .input-group select option { background-color: #1c1c1e; color: #fff; }
        .input-group input:focus, .input-group select:focus, .input-group textarea:focus {
            border-color: var(--accent); background-color: rgba(0,0,0,0.6); box-shadow: 0 0 0 3px rgba(255, 255, 0, 0.1);
        }

        .section-divider { font-size: 1rem; color: #fff; margin-top: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; font-weight: 600;}

        /* RESPONSIVIDADE MOBILE COM CARDS (Correção definitiva) */
        @media (max-width: 768px) {
            .page-header { flex-direction: column; align-items: stretch; gap: 15px; margin-bottom: 15px; margin-top: 120px;}
            .btn-novo-anuncio { width: 100%; text-align: center; }
            .table-wrapper { padding: 0px; border-radius: 16px; background: transparent; border: none; box-shadow: none; backdrop-filter: none; }
            .form-row { flex-direction: column; gap: 0; }
            .admin-title { font-size: 1rem; }
            .header-content { padding: 0 15px; height: 100px; }
            
            .modal-content { width: 100%; max-width: none; border-radius: 24px 24px 0 0; position: absolute; bottom: 0; transform: translateY(100%); max-height: 90vh; }
            .modal-footer { flex-direction: column; }
            .btn-cancelar, .btn-salvar-modal { width: 100%; text-align: center; padding: 16px;}

            /* MAGIA DO CARD NO MOBILE */
            table thead {
                display: none;
            }
            
            table, tbody, tr, td {
                display: block;
                width: 100%;
                box-sizing: border-box;
            }
            
            tr {
                margin-bottom: 20px;
                background-color: var(--surface-color);
                border: 1px solid var(--border-color);
                border-radius: 16px;
                padding: 15px;
            }
            
            td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 12px 0;
                border-bottom: 1px solid rgba(255,255,255,0.05);
                text-align: right;
            }
            
            td {
                display: flex;
                justify-content: space-between;
                align-items: flex-start; /* Alinha pelo topo para textos de múltiplas linhas ficarem bonitos */
                padding: 14px 0;
                border-bottom: 1px solid rgba(255,255,255,0.05);
                text-align: right;
                gap: 20px; /* Cria a barreira invisível entre o Rótulo e o Texto */
            }
            
            td:last-child { 
                border-bottom: none; 
                justify-content: flex-end; 
            }
        
            td::before {
                content: attr(data-label);
                font-weight: 600;
                color: var(--text-secondary);
                text-transform: uppercase;
                font-size: 0.8rem;
                text-align: left;
                flex-shrink: 0; /* Comando mágico: proíbe o rótulo de ser esmagado pelo texto da direita */
                margin-top: 2px; /* Alinha perfeitamente com a primeira linha do texto da direita */
            }

            /* Força os textos e imagens a respeitarem o espaço */
            .prod-img { flex-shrink: 0; }
            .prod-title { word-break: break-word; text-align: right; }
        }

        /* =========================================================
           RESPONSIVIDADE DA TABELA ADMIN (MOBILE) - BLINDADO CONTRA STYLE.CSS
           ========================================================= */
        @media (max-width: 768px) {
            .page-header { flex-direction: column; align-items: stretch; gap: 15px; margin-bottom: 15px; }
            .btn-novo-anuncio { width: 100%; text-align: center; }
            .table-wrapper { padding: 0px; border-radius: 16px; background: transparent; border: none; box-shadow: none; backdrop-filter: none; }
            .form-row { flex-direction: column; gap: 0; }
            .admin-title { font-size: 1rem; }
            .header-content { padding: 0 15px; }
            
            .modal-content { width: 100%; max-width: none; border-radius: 24px 24px 0 0; position: absolute; bottom: 0; transform: translateY(100%); max-height: 90vh; }
            .modal-footer { flex-direction: column; }
            .btn-cancelar, .btn-salvar-modal { width: 100%; text-align: center; padding: 16px;}

            /* MAGIA DO CARD NO MOBILE (BLINDAGEM TOTAL) */
            .admin-table thead {
                display: none !important;
            }
            
            .admin-table, .admin-table tbody, .admin-table tr, .admin-table td {
                display: block !important;
                width: 100% !important;
                box-sizing: border-box !important;
            }
            
            .admin-table tr {
                margin-bottom: 20px !important;
                background-color: var(--surface-color) !important;
                border: 1px solid var(--border-color) !important;
                border-radius: 16px !important;
                padding: 15px !important;
            }
            
            .admin-table td {
                display: flex !important;
                justify-content: space-between !important;
                align-items: center !important;
                padding: 14px 0 !important;
                border-bottom: 1px solid rgba(255,255,255,0.05) !important;
                text-align: right !important;
                gap: 20px !important;
                position: static !important; /* Reseta o relative do style.css */
            }
            
            .admin-table td:last-child { 
                border-bottom: none !important; 
                justify-content: center !important; 
            }
        
            /* Rótulo Esquerdo */
            .admin-table td::before {
                content: attr(data-label) !important;
                position: static !important; /* Reseta o absolute do style.css */
                font-weight: 600 !important;
                color: var(--text-secondary) !important;
                text-transform: uppercase !important;
                font-size: 0.8rem !important;
                text-align: left !important;
                width: auto !important; /* Reseta o 45% do style.css */
                flex-shrink: 0 !important; 
                margin-top: 0 !important;
            }

            /* Força os textos a respeitarem o espaço (Corte Inteligente) */
            .prod-img { flex-shrink: 0 !important; }
            
            .admin-table td[data-label="Título"] .prod-title {
                display: -webkit-box !important;
                -webkit-line-clamp: 2 !important; /* Trava em 2 linhas máximo */
                -webkit-box-orient: vertical !important;
                overflow: hidden !important;
                text-overflow: ellipsis !important;
                word-break: break-word !important;
                text-align: right !important;
                max-width: 60% !important; /* Impede de invadir a esquerda */
                white-space: normal !important; /* Reseta o nowrap do style.css */
                font-size: 0.9rem !important;
            }

            /* Reseta alinhamentos forçados do style.css */
            .admin-table td[data-label="Título"],
            .admin-table td[data-label="Preço"],
            .admin-table td[data-label="Ações"] {
                display: flex !important;
                justify-content: space-between !important;
                text-align: right !important;
            }

            /* Ações centralizadas no fundo */
            .admin-table td[data-label="Ações"] {
                justify-content: center !important;
                gap: 15px !important;
                padding-top: 15px !important;
            }
            .admin-table td[data-label="Ações"]::before { display: none !important; }
        }
        
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <a href="admin.html" class="back-arrow" title="Voltar ao Painel">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                <span>Voltar</span>
            </a>
            
            <div class="admin-title">ADMINISTRAÇÃO</div>
            
            <a href="store.html" class="store-link">
                Ver Loja <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5l7 7-7 7"></path></svg>
            </a>
        </div>
    </header>

    <main class="panel-container">
        
        <div class="page-header">
            <h1>🛍️ Gerir Produtos</h1>
            <a href="painel.html" style="text-decoration: none;">
                <button class="btn-novo-anuncio">+ Criar Novo Produto</button>
            </a>
        </div>

        <div class="table-wrapper">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Imagem</th>
                        <th>Título</th>
                        <th>Categoria</th>
                        <th>Preço (R$)</th>
                        <th style="text-align: right;">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-produtos">
                    <tr><td colspan="5" style="text-align: center; color: var(--accent); padding: 40px;">A carregar base de dados...</td></tr>
                </tbody>
            </table>
        </div>

    </main>

    <div id="modal-editar" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Editar Produto</h3>
                <button class="modal-close" onclick="fecharModal()">&times;</button>
            </div>
            
            <div class="modal-body">
                <form id="form-editar">
                    <input type="hidden" id="edit-id">
                    
                    <div class="input-group">
                        <label>Título do Produto</label>
                        <input type="text" id="edit-titulo" required>
                    </div>
                    
                    <div class="form-row">
                        <div class="input-group">
                            <label>Preço (Ex: 104,00)</label>
                            <input type="text" id="edit-preco" required>
                        </div>
                        <div class="input-group">
                            <label>Categoria</label>
                            <select id="edit-categoria" required>
                                <option value="cameras">Câmeras</option>
                                <option value="alarmes">Alarmes</option>
                                <option value="dvrs">DVRs / NVRs</option>
                                <option value="sensores">Sensores</option>
                                <option value="outros">Outros</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="input-group">
                        <label>Link da Imagem (URL)</label>
                        <input type="url" id="edit-imagem" required>
                    </div>

                    <div class="form-row">
                        <div class="input-group">
                            <label>Avaliação (Estrelas)</label>
                            <select id="edit-estrelas" required>
                                <option value="★★★★★">5 Estrelas (★★★★★)</option>
                                <option value="★★★★½">4.5 Estrelas (★★★★½)</option>
                                <option value="★★★★☆">4 Estrelas (★★★★☆)</option>
                                <option value="★★★☆☆">3 Estrelas (★★★☆☆)</option>
                                <option value="★★☆☆☆">2 Estrelas (★★☆☆☆)</option>
                                <option value="★☆☆☆☆">1 Estrela (★☆☆☆☆)</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>Avaliações</label>
                            <input type="number" id="edit-avaliacoes" placeholder="Ex: 15">
                        </div>
                    </div>

                    <h3 class="section-divider">Logística (Cálculo de Frete)</h3>
                    
                    <div class="form-row">
                        <div class="input-group">
                            <label>Peso (kg)</label>
                            <input type="number" id="edit-peso" step="0.01" min="0.01" required>
                        </div>
                        <div class="input-group">
                            <label>Altura (cm)</label>
                            <input type="number" id="edit-altura" min="1" required>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="input-group">
                            <label>Largura (cm)</label>
                            <input type="number" id="edit-largura" min="1" required>
                        </div>
                        <div class="input-group">
                            <label>Comprimento (cm)</label>
                            <input type="number" id="edit-comprimento" min="1" required>
                        </div>
                    </div>

                    <div class="input-group" style="margin-bottom: 0;">
                        <label>Descrição Completa</label>
                        <textarea id="edit-descricao" rows="4" style="resize: vertical;" required></textarea>
                    </div>
                </form>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
                <button type="submit" form="form-editar" class="btn-salvar-modal" id="btn-salvar-edicao">Salvar Alterações</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // =====================================================================
        // CREDENCIAIS FIREBASE
        // =====================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBLDntUspio2er8xe71wOCyObbYa-HaH20",
            authDomain: "loja-guard.firebaseapp.com",
            projectId: "loja-guard",
            storageBucket: "loja-guard.firebasestorage.app",
            messagingSenderId: "1084706871985",
            appId: "1:1084706871985:web:c3af274bfb7f99843d6090"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let produtosGlobal = [];

        // LER E EXIBIR PRODUTOS COM DATA-LABEL PARA MOBILE
        async function carregarProdutos() {
            const tbody = document.getElementById('tabela-produtos');
            tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--accent); padding: 40px;">Buscando produtos...</td></tr>';
            produtosGlobal = [];
            
            try {
                const querySnapshot = await getDocs(collection(db, "produtos"));
                let html = '';
                
                querySnapshot.forEach((documento) => {
                    const p = { id: documento.id, ...documento.data() };
                    produtosGlobal.push(p);
                    
                    html += `
                        <tr>
                            <td data-label="Imagem"><img src="${p.imagem}" alt="img" class="prod-img"></td>
                            <td data-label="Título"><span class="prod-title">${p.titulo}</span></td>
                            <td data-label="Categoria"><span class="badge-cat">${p.categoria}</span></td>
                            <td data-label="Preço" style="white-space: nowrap;">R$ ${p.preco}</td>
                            <td data-label="Ações" style="text-align: right; min-width: 160px; white-space: nowrap;">
                                <button class="btn-action btn-edit" onclick="abrirModal('${p.id}')">Editar</button>
                                <button class="btn-action btn-delete" onclick="apagarProduto('${p.id}')">Excluir</button>
                            </td>
                        </tr>
                    `;
                });
                
                if(html === '') html = '<tr><td colspan="5" style="text-align: center; padding: 40px; color: var(--text-secondary);">Nenhum produto cadastrado.</td></tr>';
                tbody.innerHTML = html;
                
            } catch (error) {
                console.error("Erro ao carregar:", error);
                tbody.innerHTML = '<tr><td colspan="5" style="color: var(--apple-red); text-align: center; padding: 40px;">Erro ao ligar ao banco de dados.</td></tr>';
            }
        }

        // DELETAR PRODUTO
        window.apagarProduto = async function(id) {
            if (confirm("ATENÇÃO: Tem certeza que deseja excluir este produto permanentemente?")) {
                try {
                    await deleteDoc(doc(db, "produtos", id));
                    alert("Produto apagado com sucesso!");
                    carregarProdutos();
                } catch (error) {
                    alert("Erro ao excluir o produto: " + error.message);
                }
            }
        };

        // MODAL DE EDIÇÃO
        const modalEditar = document.getElementById('modal-editar');

        window.abrirModal = function(id) {
            const produto = produtosGlobal.find(p => p.id === id);
            if(produto) {
                document.getElementById('edit-id').value = produto.id;
                document.getElementById('edit-titulo').value = produto.titulo || '';
                document.getElementById('edit-preco').value = produto.preco || '';
                document.getElementById('edit-categoria').value = produto.categoria || '';
                document.getElementById('edit-imagem').value = produto.imagem || '';
                
                document.getElementById('edit-estrelas').value = produto.estrelas || '★★★★★';
                document.getElementById('edit-avaliacoes').value = produto.avaliacoes || 0;
                document.getElementById('edit-descricao').value = produto.descricao || '';

                // Logística
                document.getElementById('edit-peso').value = produto.peso || 0.5;
                document.getElementById('edit-altura').value = produto.altura || 15;
                document.getElementById('edit-largura').value = produto.largura || 20;
                document.getElementById('edit-comprimento').value = produto.comprimento || 20;
                
                modalEditar.classList.add('active');
            }
        };

        window.fecharModal = function() {
            modalEditar.classList.remove('active');
        };

        // Fechar clicando fora
        modalEditar.addEventListener('click', (e) => {
            if (e.target === modalEditar) fecharModal();
        });

        // SALVAR ALTERAÇÕES (UPDATE)
        document.getElementById('form-editar').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btnSalvar = document.getElementById('btn-salvar-edicao');
            btnSalvar.textContent = "A salvar...";
            btnSalvar.style.pointerEvents = "none";

            const idProduto = document.getElementById('edit-id').value;
            const novosDados = {
                titulo: document.getElementById('edit-titulo').value,
                preco: document.getElementById('edit-preco').value,
                categoria: document.getElementById('edit-categoria').value,
                imagem: document.getElementById('edit-imagem').value,
                estrelas: document.getElementById('edit-estrelas').value,
                avaliacoes: Number(document.getElementById('edit-avaliacoes').value),
                descricao: document.getElementById('edit-descricao').value,
                
                peso: Number(document.getElementById('edit-peso').value),
                altura: Number(document.getElementById('edit-altura').value),
                largura: Number(document.getElementById('edit-largura').value),
                comprimento: Number(document.getElementById('edit-comprimento').value)
            };

            try {
                const refProduto = doc(db, "produtos", idProduto);
                await updateDoc(refProduto, novosDados);
                
                alert("Produto atualizado com sucesso!");
                fecharModal();
                carregarProdutos(); 
            } catch (error) {
                alert("Erro ao atualizar: " + error.message);
            } finally {
                btnSalvar.textContent = "Salvar Alterações";
                btnSalvar.style.pointerEvents = "auto";
            }
        });

        // Inicia o carregamento
        carregarProdutos();
    </script>
</body>
</html>
