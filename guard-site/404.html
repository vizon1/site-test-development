<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Página não encontrada - Guard Store</title>
    <link rel="icon" type="image/webp" href="/imagens/logo.webp">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================
           ESTILOS GERAIS (DARK MODE GUARD)
           ========================================== */
        :root {
            --bg-color: #000000;
            --surface-color: #111111;
            --text-primary: #f5f5f7;
            --text-secondary: #86868b;
            --accent: #FFFF00;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-color); color: var(--text-primary);
            font-family: 'Fira Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex; flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* HEADER MINIMALISTA */
        header {
            position: sticky; top: 0; z-index: 1000;
            background-color: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: center;
            height: 70px; flex-shrink: 0;
        }
        .logo-img { height: 45px; width: auto; }

        /* CONTEÚDO CENTRAL 404 */
        .not-found-container {
            flex-grow: 1;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center; padding: 40px 24px;
        }

        .error-code {
            font-size: 8rem; font-weight: 800; color: var(--surface-color);
            text-shadow: -1px -1px 0 var(--border-color), 1px -1px 0 var(--border-color), -1px 1px 0 var(--border-color), 1px 1px 0 var(--border-color);
            line-height: 1; margin: 0; letter-spacing: -5px;
            position: relative;
        }
        
        .error-code::after {
            content: '404'; position: absolute; left: 0; top: 0;
            color: transparent; text-shadow: none;
            background: linear-gradient(180deg, var(--accent) 0%, transparent 80%);
            -webkit-background-clip: text; background-clip: text;
        }

        .error-title {
            font-size: 2rem; font-weight: 700; margin: 20px 0 10px; letter-spacing: -0.5px;
        }

        .error-msg {
            color: var(--text-secondary); font-size: 1.1rem; max-width: 500px; margin: 0 auto 40px; line-height: 1.5;
        }

        /* BOTÃO DE AÇÃO */
        .btn-return {
            background-color: var(--accent); color: #000; text-decoration: none;
            padding: 16px 32px; border-radius: 40px; font-size: 1.05rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: 1px; transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
            display: inline-flex; align-items: center; gap: 10px;
        }
        .btn-return:hover {
            transform: translateY(-2px); box-shadow: 0 10px 25px rgba(255, 255, 0, 0.2); background-color: #fff433;
        }
        .btn-return:active { transform: translateY(0); }

        /* FOOTER */
        footer {
            text-align: center; padding: 30px 24px; border-top: 1px solid var(--border-color);
            font-size: 0.85rem; color: var(--text-secondary); flex-shrink: 0;
        }

        @media (max-width: 768px) {
            .error-code { font-size: 6rem; }
            .error-title { font-size: 1.6rem; }
            .error-msg { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <header>
        <a href="/index">
            <img src="/imagens/logo.webp" alt="Guard Store" class="logo-img" onerror="this.style.display='none'">
        </a>
    </header>

    <main class="not-found-container">
        <div class="error-code">404</div>
        <h1 class="error-title">Área Restrita ou Inexistente</h1>
        <p class="error-msg">A página que você tentou acessar não foi encontrada. O link pode estar quebrado ou o equipamento foi removido do nosso catálogo.</p>
        
        <a href="/store" class="btn-return">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Voltar para a Loja
        </a>
    </main>

    <footer>
        GUARD 2026 | CNPJ protegido e verificado.
    </footer>

</body>
</html>
