<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Painel Administrativo - Guard</title>
    <link rel="icon" type="image/webp" href="imagens/logo.webp">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&family=Fira+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Style.css">
    <style>
        /* =========================================================
           VARIÁVEIS APPLE DARK MODE
           ========================================================= */
        :root {
            --bg-color: #000000;
            --surface-color: rgba(28, 28, 30, 0.6);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f5f5f7;
            --text-secondary: #86868b;
            --apple-red: #ff453a;
            --accent: #FFFF00;
        }

        html, body {
            overflow-x: hidden; width: 100%; margin: 0; padding: 0;
            background-color: var(--bg-color); color: var(--text-primary);
            font-family: 'Fira Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-image: radial-gradient(circle at 50% 0%, rgba(255,255,0,0.02) 0%, transparent 60%);
            -webkit-font-smoothing: antialiased;
        }

        /* =========================================================
           CABEÇALHO ADMINISTRATIVO BLINDADO
           ========================================================= */
        header {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 1000;
        }

        .header-content {
            max-width: 1200px; margin: 0 auto; padding: 0 24px; height: 100px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .back-arrow { 
            color: var(--text-secondary); text-decoration: none; display: flex; align-items: center; 
            font-weight: 500; font-size: 1rem; transition: color 0.2s ease; gap: 4px; padding: 0 !important; border: 0 !important;
        }
        .back-arrow:hover { color: #ffffff; }

        .admin-title {
            color: var(--apple-red); font-weight: 700; font-size: 1.1rem; 
            letter-spacing: 1.5px; text-transform: uppercase;
        }

        .store-link {
            background: rgba(255, 255, 255, 0.1); color: #fff; text-decoration: none;
            padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 600;
            transition: all 0.2s ease; display: flex; align-items: center; gap: 6px; border: 0 !important;
        }
        .store-link:hover { background: rgba(255, 255, 255, 0.2); }

        /* =========================================================
           LAYOUT PRINCIPAL (GRID)
           ========================================================= */
        .panel-container {
            display: flex; flex-direction: row; max-width: 1200px; margin: 40px auto 60px; 
            gap: 30px; padding: 0 24px; box-sizing: border-box; align-items: flex-start; width: 100%; margin-top: 120px;
        }

        .panel-form-section {
            flex: 1.5; background: var(--surface-color); border: 1px solid var(--border-color);
            border-radius: 24px; padding: 35px; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            box-sizing: border-box; width: 100%;
        }

        /* Envolve a área da direita (Preview + Botões) para ficarem separados mas stickys juntos */
        .right-column-wrapper {
            flex: 1; position: sticky; top: 100px; display: flex; flex-direction: column; gap: 24px; width: 100%; box-sizing: border-box;
        }

        /* Estilo comum para os dois blocos da direita */
        .preview-box, .action-box {
            background: var(--surface-color); border: 1px solid var(--border-color);
            border-radius: 24px; padding: 35px; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            box-sizing: border-box; width: 100%;
        }

        .panel-form-section h2 { margin-top: 0; font-size: 1.8rem; letter-spacing: -0.5px; margin-bottom: 5px;}
        .panel-subtitle { color: var(--text-secondary); margin-bottom: 30px; font-size: 0.95rem;}

        /* =========================================================
           FORMULÁRIOS ESTILO APPLE
           ========================================================= */
        .form-row { display: flex; gap: 20px; width: 100%; }
        .input-group { display: flex; flex-direction: column; width: 100%; margin-bottom: 20px; }
        
        .input-group label {
            font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 8px; 
            font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px;
        }

        .input-group input, .input-group select, .input-group textarea {
            background-color: rgba(0,0,0,0.4) !important;
            border: 1.5px solid rgba(255,255,255,0.1) !important;
            color: #fff !important; padding: 16px 18px !important; border-radius: 12px !important;
            font-size: 1rem !important; font-family: inherit !important; transition: all 0.3s ease;
            outline: none; box-sizing: border-box; width: 100%;
        }

        .input-group select {
            appearance: none; -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2386868b%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat; background-position: right 15px top 50%; background-size: 12px auto; cursor: pointer;
        }
        .input-group select option { background-color: #1c1c1e; color: #fff; }

        .input-group input:focus, .input-group select:focus, .input-group textarea:focus {
            border-color: var(--accent) !important; background-color: rgba(0,0,0,0.6) !important; 
            box-shadow: 0 0 0 3px rgba(255, 255, 0, 0.1);
        }

        /* Checkbox Customizado */
        .custom-checkbox-container { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .custom-checkbox-container input { accent-color: var(--accent); width: 22px; height: 22px; cursor: pointer; flex-shrink: 0; }
        .custom-checkbox-container label { color: #d2d2d7; font-size: 0.95rem; font-weight: 500; cursor: pointer; user-select: none; text-transform: none; letter-spacing: normal;}

        /* Secionador Visual Logística */
        .section-divider {
            font-size: 1.1rem; color: #fff; margin-top: 10px; margin-bottom: 20px; 
            border-bottom: 1px solid var(--border-color); padding-bottom: 10px; font-weight: 600;
        }

        /* Botão Submeter */
        .btn-panel-submit {
            background-color: var(--accent); color: #000; border: none; padding: 20px;
            border-radius: 14px; font-size: 1.1rem; font-weight: 800; cursor: pointer; width: 100%;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); text-transform: uppercase; letter-spacing: 1px; margin-top: 20px;
        }
        .btn-panel-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(255, 255, 0, 0.2); background-color: #fff433; }

        /* =========================================================
           CARD DE PREVIEW (LOJA)
           ========================================================= */
        .preview-card-container { display: flex; justify-content: center; margin-top: 20px;}
        .shop-card { 
            background: #111; border: 1px solid #333; border-radius: 16px; padding: 20px; 
            width: 100%; max-width: 320px; box-sizing: border-box; display: flex; flex-direction: column;
        }
        .shop-card-category { font-size: 0.75rem; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
        .shop-card-img { width: 100%; height: 200px; background: rgba(255,255,255,0.02); border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; overflow: hidden;}
        .shop-card-img img { max-width: 80%; max-height: 80%; object-fit: contain; }
        .shop-card-body h4 { margin: 0 0 10px 0; font-size: 1.1rem; color: #fff; font-weight: 600; line-height: 1.3;}
        .shop-card-rating { display: flex; align-items: center; gap: 8px; margin-bottom: 15px; font-size: 0.9rem;}
        .shop-card-rating span:first-child { color: var(--accent); }
        .shop-card-rating span:last-child { color: var(--text-secondary); }
        .shop-card-price { font-size: 1.4rem; font-weight: 800; color: #fff; margin-bottom: 20px;}
        .shop-card-actions { display: flex; gap: 10px; }
        .btn-add-cart { flex: 1; background: #222; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 600;}
        .btn-buy-now { flex: 1; background: var(--accent); color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: 700;}

        .page-header h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 20px; margin-top: 10px; letter-spacing: -0.5px; margin-top: 100px;}
        
        /* =========================================================
           RESPONSIVIDADE MOBILE
           ========================================================= */
        @media (max-width: 900px) {
            .panel-container { flex-direction: column; padding: 0 16px; margin-top: 30px; }
            .panel-form-section { order: 1; }
            .right-column-wrapper { position: static; order: 2; margin-bottom: 40px; }
        }

        @media (max-width: 768px) {
            .form-row { flex-direction: column; gap: 0; }
            .panel-form-section, .preview-box, .action-box { padding: 24px 20px; border-radius: 16px;}
            .admin-title { font-size: 1rem; }
            .header-content { padding: 0 15px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <a href="admin.html" class="back-arrow" title="Voltar ao Painel">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                <span>Voltar</span>
            </a>
            
            <div class="admin-title">ADMINISTRAÇÃO</div>
            
            <a href="store.html" class="store-link">
                Ver Loja <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5l7 7-7 7"></path></svg>
            </a>
        </div>
    </header>

    <main class="panel-container">

        <div class="page-header">
            <h1>🏷️ Adicionar Novo Produto</h1>
        </div>
        
        <section class="panel-form-section">
            <p class="panel-subtitle">Preencha os dados abaixo para publicar um novo equipamento no catálogo.</p>

            <form id="productForm" class="panel-form">
                <div class="input-group">
                    <label for="productTitle">Título do Produto</label>
                    <input type="text" id="productTitle" placeholder="Ex: Câmera Dome IP 4K Intelbras" required>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label for="productCategory">Categoria</label>
                        <select id="productCategory" required>
                            <option value="cameras">Câmeras</option>
                            <option value="dvrs">DVRs / NVRs</option>
                            <option value="alarmes">Centrais de Alarme</option>
                            <option value="sensores">Sensores</option>
                            <option value="outros">Outros</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="productPrice">Preço (R$)</label>
                        <input type="text" id="productPrice" placeholder="0,00" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label for="productRating">Avaliação (Estrelas)</label>
                        <select id="productRating" required>
                            <option value="★★★★★">★★★★★ (5 Estrelas)</option>
                            <option value="★★★★½">★★★★½ (4.5 Estrelas)</option>
                            <option value="★★★★☆">★★★★☆ (4 Estrelas)</option>
                            <option value="★★★☆☆">★★★☆☆ (3 Estrelas)</option>
                            <option value="★★☆☆☆">★★☆☆☆ (2 Estrelas)</option>
                            <option value="★☆☆☆☆">★☆☆☆☆ (1 Estrela)</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="productReviews">Nº de Avaliações</label>
                        <input type="number" id="productReviews" placeholder="Ex: 24" value="0" min="0" required>
                    </div>
                </div>

                <h3 class="section-divider">Logística (Cálculo de Frete)</h3>
                
                <div class="form-row">
                    <div class="input-group">
                        <label for="productWeight">Peso (kg)</label>
                        <input type="number" id="productWeight" step="0.01" min="0.01" placeholder="Ex: 0.50" required>
                    </div>
                    <div class="input-group">
                        <label for="productHeight">Altura (cm)</label>
                        <input type="number" id="productHeight" min="1" placeholder="Ex: 15" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label for="productWidth">Largura (cm)</label>
                        <input type="number" id="productWidth" min="1" placeholder="Ex: 20" required>
                    </div>
                    <div class="input-group">
                        <label for="productLength">Comprimento (cm)</label>
                        <input type="number" id="productLength" min="1" placeholder="Ex: 20" required>
                    </div>
                </div>

                <h3 class="section-divider">Mídia e Destaque</h3>

                <div class="input-group">
                    <label for="productDescription">Descrição do Produto</label>
                    <textarea id="productDescription" rows="4" placeholder="Descreva os principais diferenciais técnicos deste item..." required style="resize: vertical;"></textarea>
                </div>

                <div class="input-group" style="margin-bottom: 0;">
                    <label for="productImageUrl">Link da Imagem do Produto</label>
                    <input type="url" id="productImageUrl" placeholder="Cole o link direto da foto (ex: https://i.imgur.com/...)" required>
                </div>
            </form>
        </section>

        <!-- COLUNA DA DIREITA: DIVIDIDA EM DOIS CARDS -->
        <div class="right-column-wrapper">
            
            <!-- Card 1: PREVIEW -->
            <section class="preview-box">
                <h3 style="font-size: 1.3rem; margin-top: 0; margin-bottom: 5px; color: #fff;">Visualização</h3>
                <p class="panel-subtitle">Como aparecerá na loja:</p>

                <div class="preview-card-container">
                    <div class="shop-card" id="livePreviewCard">
                        <span class="shop-card-category" id="previewCategory">Câmeras</span>
                        <div class="shop-card-img">
                            <img id="previewImg" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 24 24' fill='%23555'><path d='M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z'/></svg>" alt="Preview">
                        </div>
                        <div class="shop-card-body">
                            <h4 id="previewTitle">Nome do Equipamento</h4>
                            <div class="shop-card-rating">
                                <span id="previewStars">★★★★★</span> 
                                <span id="previewReviewCount">(0 avaliações)</span>
                            </div>
                            <div class="shop-card-price" id="previewPrice">R$ 0,00</div>
                            <div class="shop-card-actions">
                                <button type="button" class="btn-add-cart" style="pointer-events: none;">Carrinho</button>
                                <button type="button" class="btn-buy-now" style="pointer-events: none;">Comprar</button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="action-box">
                <h3 style="font-size: 1.2rem; margin-top: 0; margin-bottom: 15px; color: #fff;"></h3>
                <div class="custom-checkbox-container">
                    <input type="checkbox" id="productRecommended" form="productForm">
                    <label for="productRecommended">Destacar na aba "Explore as nossas recomendações"</label>
                </div>
                <button type="submit" form="productForm" id="btn-submit-desktop" class="btn-panel-submit">Publicar Item</button>
            </section>

        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // =====================================================================
        // FIREBASE CREDENCIAIS
        // =====================================================================
        const firebaseConfig = {
          apiKey: "AIzaSyBLDntUspio2er8xe71wOCyObbYa-HaH20",
          authDomain: "loja-guard.firebaseapp.com",
          projectId: "loja-guard",
          storageBucket: "loja-guard.firebasestorage.app",
          messagingSenderId: "1084706871985",
          appId: "1:1084706871985:web:c3af274bfb7f99843d6090"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Elementos da página
        const productTitle = document.getElementById('productTitle');
        const productCategory = document.getElementById('productCategory');
        const productPrice = document.getElementById('productPrice');
        const productRating = document.getElementById('productRating');
        const productReviews = document.getElementById('productReviews');
        
        const productWeight = document.getElementById('productWeight');
        const productHeight = document.getElementById('productHeight');
        const productWidth = document.getElementById('productWidth');
        const productLength = document.getElementById('productLength');

        const productDescription = document.getElementById('productDescription');
        const productImageUrl = document.getElementById('productImageUrl');
        const productRecommended = document.getElementById('productRecommended');

        const previewTitle = document.getElementById('previewTitle');
        const previewCategory = document.getElementById('previewCategory');
        const previewPrice = document.getElementById('previewPrice');
        const previewImg = document.getElementById('previewImg');
        const previewStars = document.getElementById('previewStars');
        const previewReviewCount = document.getElementById('previewReviewCount');
        
        const form = document.getElementById('productForm');
        const submitBtnDesktop = document.getElementById('btn-submit-desktop');

        const categoriaNomes = { cameras: 'Câmeras', dvrs: 'DVRs', alarmes: 'Alarmes', sensores: 'Sensores', outros: 'Outros' };
        const svgPadrao = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 24 24' fill='%23555'><path d='M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z'/></svg>";

        // --- Atualizações Visuais no Preview ---
        productTitle.addEventListener('input', (e) => previewTitle.textContent = e.target.value.trim() || 'Nome do Equipamento');
        productCategory.addEventListener('change', (e) => previewCategory.textContent = categoriaNomes[e.target.value]);
        productRating.addEventListener('change', (e) => {
            previewStars.innerHTML = e.target.value.replace('½', '<span class="star-half" style="color:var(--text-secondary)">☆<span class="star-fill" style="color:var(--accent); position:absolute; left:0; width:50%; overflow:hidden;">★</span></span>');
        });
        productReviews.addEventListener('input', (e) => previewReviewCount.textContent = `(${e.target.value || 0} avaliações)`);
        
        productPrice.addEventListener('input', (e) => {
            let v = e.target.value.replace(/\D/g, '');
            v = (v / 100).toFixed(2) + '';
            v = v.replace(".", ",");
            v = v.replace(/(\d)(\d{3})(?=\d)/g, "$1.$2");
            e.target.value = v === "0,00" ? "" : v;
            previewPrice.textContent = v === "0,00" ? "R$ 0,00" : "R$ " + v;
        });

        productImageUrl.addEventListener('input', (e) => {
            const url = e.target.value.trim();
            previewImg.src = url ? url : svgPadrao;
        });

        // --- Envio de dados para o Firestore ---
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            submitBtnDesktop.innerHTML = "PUBLICANDO..."; submitBtnDesktop.style.pointerEvents = "none"; submitBtnDesktop.style.opacity = "0.7";

            try {
                await addDoc(collection(db, "produtos"), {
                    titulo: productTitle.value,
                    categoria: productCategory.value,
                    preco: productPrice.value,
                    estrelas: productRating.value,
                    avaliacoes: Number(productReviews.value),
                    peso: Number(productWeight.value),
                    altura: Number(productHeight.value),
                    largura: Number(productWidth.value),
                    comprimento: Number(productLength.value),
                    descricao: productDescription.value,
                    imagem: productImageUrl.value,
                    recomendado: productRecommended.checked,
                    dataCadastro: new Date()
                });

                alert('✅ Produto publicado com sucesso!');
                form.reset();
                previewImg.src = svgPadrao;
                previewTitle.textContent = "Nome do Equipamento";
                previewPrice.textContent = "R$ 0,00";
                previewReviewCount.textContent = "(0 avaliações)";
                previewStars.textContent = "★★★★★";

            } catch (error) {
                console.error("Erro ao salvar:", error);
                alert('❌ Erro de conexão. Verifique o console.');
            } finally {
                submitBtnDesktop.innerHTML = "PUBLICAR ITEM"; submitBtnDesktop.style.pointerEvents = "auto"; submitBtnDesktop.style.opacity = "1";
            }
        });
    </script>
</body>
</html>
