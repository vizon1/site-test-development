<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Meus Pedidos - Guard</title>
    <link rel="icon" type="image/webp" href="imagens/logo.webp">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Style.css">
    <style>
        /* Estilos do Menu Suspenso de Perfil (Herdados da Loja) */
        .profile-dropdown {
            display: none; position: absolute; top: 100%; right: 0; margin-top: 15px;
            background-color: #1d1d1f; border: 1px solid #424245; border-radius: 12px;
            width: 200px; flex-direction: column; overflow: hidden; z-index: 1000; box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }
        .profile-dropdown.active { display: flex; animation: fadeIn 0.2s ease forwards; }
        .dropdown-item { padding: 12px 16px; color: #f5f5f7; text-decoration: none; font-size: 0.9rem; transition: background-color 0.2s ease; display: flex; align-items: center; }
        .dropdown-item:hover { background-color: #2c2c2e; }
        .dropdown-divider { height: 1px; background-color: #424245; margin: 4px 0; }
        .dropdown-item.logout { color: #ff4444; }
        .dropdown-item.logout:hover { background-color: rgba(255, 68, 68, 0.1); }
        
        #logged-in-ui:hover #user-first-name { color: #ffffff; }
        
        /* Estilo da Seta de Voltar */
        .back-arrow { color: #86868b; transition: color 0.2s ease; display: flex; align-items: center; }
        .back-arrow:hover { color: #ffffff; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        /* Ajuste do Header (Estilo Checkout Nível Apple) */
        header {
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
            will-change: transform;
        }

        #header { position: relative; display: flex; justify-content: space-between; align-items: center; padding: 0 24px; width: 100%; box-sizing: border-box; height: 80px; }
        
        .page-logo-img { height: 48px; width: auto; display: block; }
        .page-title-text { color: #fff; font-weight: 800; font-size: 1.15rem; letter-spacing: 0.5px; text-transform: uppercase; }
        .title-container { display: flex; align-items: center; gap: 15px; }

        /* =========================================================
           BADGES DE STATUS PROFISSIONAIS
           ========================================================= */
        .pedido-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        
        .status-pendente { background: rgba(255, 214, 10, 0.1); color: #ffd60a; border: 1px solid rgba(255, 214, 10, 0.2); }
        .status-aprovado { background: rgba(50, 215, 75, 0.1); color: #32d74b; border: 1px solid rgba(50, 215, 75, 0.2); }
        .status-preparando { background: rgba(255, 159, 10, 0.1); color: #ff9f0a; border: 1px solid rgba(255, 159, 10, 0.2); }
        .status-enviado { background: rgba(10, 132, 255, 0.1); color: #0a84ff; border: 1px solid rgba(10, 132, 255, 0.2); }
        .status-cancelado { background: rgba(255, 69, 58, 0.1); color: #ff453a; border: 1px solid rgba(255, 69, 58, 0.2); }

        /* ==== AJUSTES PARA MOBILE ==== */
        @media (max-width: 768px) {
            #header { padding: 0 15px; height: 65px; justify-content: flex-start; }
            .page-logo-img { height: 42px; } 
            .page-title-text { font-size: 1rem; }
            .title-container { gap: 8px; margin-left: 15px; } 
            #desktop-cart-group { display: none !important; }
        }

        @media (max-width: 480px) {
            .page-logo-img { height: 38px; } 
            .page-title-text { font-size: 0.9rem; }
            .title-separator { height: 20px !important; }
        }
    </style>
</head>
<body style="background-color: #0a0a0a;">

    <header>
        <div id="header">
            <div style="display: flex; align-items: center; gap: 20px;">
                <a href="store" class="back-arrow" title="Voltar à Loja">
                    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </a>
                
                <div style="display: flex; align-items: center; gap: 15px;">
                    <a href="index" style="display: flex;"><img src="imagens/logo.webp" alt="Logo Guard" class="page-logo-img"></a>
                    <div class="title-separator" style="height: 24px; width: 3px; background-color: #FFFF00; border-radius: 2px;"></div>
                    <span class="page-title-text">MEUS PEDIDOS</span>
                </div>
            </div>

            <div id="desktop-cart-group" style="display: flex; align-items: center;">
                <div id="auth-section" style="display: flex; align-items: center; position: relative;">
                    <div id="logged-in-ui" style="display: flex; align-items: center; gap: 10px; cursor: pointer; position: relative;">
                        <img id="user-avatar" src="" alt="Perfil" style="width: 30px; height: 30px; border-radius: 50%; object-fit: cover; border: 1px solid #424245;">
                        <span id="user-first-name" style="font-size: 0.9rem; font-weight: 500; color: #f5f5f7; transition: color 0.2s ease;"></span>
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#86868b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left: 2px;"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        
                        <div id="profile-dropdown" class="profile-dropdown">
                            <a href="meus-pedidos" class="dropdown-item" style="color:#FFFF00;">Meus pedidos</a>
                            <a href="minhas-informacoes" class="dropdown-item">Minhas informações</a>
                            <a href="help-informations" class="dropdown-item">Suporte</a>
                            <div class="dropdown-divider"></div>
                            <a href="#" id="btn-logout" class="dropdown-item logout">Sair</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="pedidos-wrapper">
        <h1 class="pedidos-title">Acompanhar Pedidos</h1>
        <p class="pedidos-subtitle">Verifique o status das suas compras recentes.</p>
        
        <div id="lista-pedidos" class="pedidos-grid">
            </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, query, where, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Credenciais do seu Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBLDntUspio2er8xe71wOCyObbYa-HaH20",
            authDomain: "loja-guard.firebaseapp.com",
            projectId: "loja-guard",
            storageBucket: "loja-guard.firebasestorage.app",
            messagingSenderId: "1084706871985",
            appId: "1:1084706871985:web:c3af274bfb7f99843d6090"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ==========================================
        // ELEMENTOS E LÓGICA DO MENU DE PERFIL
        // ==========================================
        const loggedInUI = document.getElementById('logged-in-ui');
        const profileDropdown = document.getElementById('profile-dropdown');
        const userFirstName = document.getElementById('user-first-name');
        const userAvatar = document.getElementById('user-avatar');
        const btnLogout = document.getElementById('btn-logout');

        if(loggedInUI) {
            loggedInUI.addEventListener('click', (e) => {
                e.stopPropagation();
                profileDropdown.classList.toggle('active');
            });
        }

        document.addEventListener('click', (e) => {
            if (loggedInUI && !loggedInUI.contains(e.target)) {
                profileDropdown.classList.remove('active');
            }
        });

        if(btnLogout) {
            btnLogout.addEventListener('click', async (e) => {
                e.preventDefault();
                await signOut(auth);
                window.location.href = "index";
            });
        }

        // ==========================================
        // MOTOR INTELIGENTE DE STATUS
        // ==========================================
        function processarStatusPedido(statusOriginal) {
            const s = (statusOriginal || '').toLowerCase();
            
            // 1. Pagamento Aprovado
            if (s.includes('aprovado') || s.includes('pago')) {
                return { 
                    texto: "Pagamento Aprovado", 
                    classe: "status-aprovado", 
                    icone: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>' 
                };
            }
            // 2. Preparando Envio / Separando no Estoque
            if (s.includes('preparan') || s.includes('separando')) {
                return { 
                    texto: "Preparando Envio", 
                    classe: "status-preparando", 
                    icone: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"></line><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>' 
                };
            }
            // 3. Em Rota de Entrega / Enviado
            if (s.includes('envia') || s.includes('caminho') || s.includes('trânsito') || s.includes('transito') || s.includes('rota')) {
                return { 
                    texto: "Em Trânsito", 
                    classe: "status-enviado", 
                    icone: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg>' 
                };
            }
            // 4. Pedido Entregue ao Cliente
            if (s.includes('entregue')) {
                return { 
                    texto: "Pedido Entregue", 
                    classe: "status-aprovado", 
                    icone: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>' 
                };
            }
            // 5. Cancelado / Falha no pagamento
            if (s.includes('cancelado') || s.includes('recusado') || s.includes('falha')) {
                return { 
                    texto: "Cancelado", 
                    classe: "status-cancelado", 
                    icone: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>' 
                };
            }
            // 6. Analisando / Processando o Cartão
            if (s.includes('processando') || s.includes('analisando')) {
                return { 
                    texto: "Analisando Pagamento", 
                    classe: "status-pendente", 
                    icone: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>' 
                };
            }
            
            // 7. Padrão: Boleto Pendente / PIX Pendente
            return { 
                texto: "Aguardando Pagamento", 
                classe: "status-pendente", 
                icone: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>' 
            };
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                let nome = user.displayName;
                if (!nome) {
                    try {
                        const snap = await getDoc(doc(db, "usuarios", user.uid));
                        if (snap.exists() && snap.data().nome) nome = snap.data().nome;
                    } catch (e) {
                        nome = "Cliente";
                    }
                }
                const primeiroNome = nome ? nome.split(' ')[0] : 'Cliente';
                if(userFirstName) userFirstName.textContent = primeiroNome;
                if(userAvatar) userAvatar.src = user.photoURL || `https://ui-avatars.com/api/?name=${primeiroNome}&background=2c2c2e&color=fff&rounded=true`;

                carregarPedidosProtegidos(user.uid);
            } else {
                window.location.href = "login";
            }
        });

        async function carregarPedidosProtegidos(userUid) {
            const container = document.getElementById('lista-pedidos');
            container.innerHTML = '<p style="color: #FFFF00; text-align: center;">A procurar os seus pedidos...</p>';

            try {
                const q = query(collection(db, "pedidos"), where("userId", "==", userUid));
                const querySnapshot = await getDocs(q);
                let html = '';

                if (querySnapshot.empty) {
                    container.innerHTML = '<p style="color: #888; text-align: center; margin-top: 20px;">Não tem pedidos registados nesta conta.</p>';
                    return;
                }

                const pedidosArray = [];
                querySnapshot.forEach((doc) => {
                    pedidosArray.push({ idReal: doc.id, ...doc.data() });
                });

                // Ordenação corrigida para interpretar a data guardada no checkout
                pedidosArray.sort((a, b) => {
                    const timeA = a.dataCriacao ? new Date(a.dataCriacao.seconds ? a.dataCriacao.seconds * 1000 : a.dataCriacao).getTime() : 0;
                    const timeB = b.dataCriacao ? new Date(b.dataCriacao.seconds ? b.dataCriacao.seconds * 1000 : b.dataCriacao).getTime() : 0;
                    return timeB - timeA;
                });

                pedidosArray.forEach((pedido) => {
                    const idCurto = pedido.idReal.substring(0, 8).toUpperCase();
                    
                    // Formatação correta da data (Lê Timestamp do Firebase ou String ISO)
                    let dataFormatada = "Data indisponível";
                    if (pedido.dataCriacao) {
                        const dataObj = typeof pedido.dataCriacao === 'string' 
                            ? new Date(pedido.dataCriacao) 
                            : new Date(pedido.dataCriacao.seconds * 1000);
                        
                        dataFormatada = dataObj.toLocaleDateString('pt-BR', { 
                            day: '2-digit', month: '2-digit', year: 'numeric' 
                        }) + ' às ' + dataObj.toLocaleTimeString('pt-BR', { 
                            hour: '2-digit', minute: '2-digit' 
                        });
                    }
                    
                    let nomeItem = "Equipamento Guard";
                    if (pedido.itens && Array.isArray(pedido.itens) && pedido.itens.length > 0) {
                        nomeItem = pedido.itens.length === 1 
                            ? pedido.itens[0].titulo 
                            : `${pedido.itens[0].titulo} e mais ${pedido.itens.length - 1} item(ns)`;
                    } else if (pedido.item) {
                        nomeItem = pedido.item; 
                    }

                    const total = pedido.total || "0,00";
                    const infoStatus = processarStatusPedido(pedido.status);

                    html += `
                        <div class="pedido-card">
                            <div class="pedido-header">
                                <div>
                                    <span class="pedido-id">Pedido #${idCurto}</span>
                                    <span class="pedido-data">${dataFormatada}</span>
                                </div>
                                <div class="pedido-badge ${infoStatus.classe}">${infoStatus.icone} ${infoStatus.texto}</div>
                            </div>
                            <div class="pedido-body">
                                <p class="pedido-item">${nomeItem}</p>
                                <p class="pedido-total">R$ ${total}</p>
                            </div>
                            <div class="pedido-footer">
                                <a href="detalhes-pedidos?id=${pedido.idReal}" style="text-decoration: none;">
                                    <button class="btn-detalhes">Ver Detalhes</button>
                                </a>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;

            } catch (error) {
                console.error("Erro ao carregar pedidos:", error);
                container.innerHTML = '<p style="color: #ff4444; text-align: center;">Erro ao processar o seu histórico. Tente novamente mais tarde.</p>';
            }
        }
    </script>
    <script src="apple-alerts.js"></script>
</body>
</html>
