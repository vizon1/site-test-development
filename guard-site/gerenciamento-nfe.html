<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Gerir Embalagens - Admin Guard</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/webp" href="imagens/logo.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&family=Fira+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Style.css">
    <style>
        /* =========================================================
           VARIÁVEIS APPLE DARK MODE E RESET
           ========================================================= */
        :root {
            --bg-color: #000000;
            --surface-color: rgba(28, 28, 30, 0.6);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f5f5f7;
            --text-secondary: #86868b;
            --apple-red: #ff453a;
            --accent: #FFFF00;
            --warning-yellow: #ffd60a;
            --safe-green: #32d74b;
        }

        html, body {
            overflow-x: hidden; width: 100%; margin: 0; padding: 0;
            background-color: var(--bg-color); color: var(--text-primary);
            font-family: 'Fira Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-image: radial-gradient(circle at 50% 0%, rgba(255,255,0,0.02) 0%, transparent 60%);
            -webkit-font-smoothing: antialiased;
        }

        /* BARRA DE ROLAGEM CUSTOMIZADA DARK MODE (Para os Modais) */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000000; border-radius: 4px;}
        ::-webkit-scrollbar-thumb { background: #333333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555555; }

        /* =========================================================
           CABEÇALHO ADMINISTRATIVO (ALTURA 100px)
           ========================================================= */
        header#admin-header {
            background: rgba(0, 0, 0, 0.75) !important;
            backdrop-filter: saturate(180%) blur(20px) !important; 
            -webkit-backdrop-filter: saturate(180%) blur(20px) !important;
            border-bottom: 1px solid var(--border-color) !important; 
            position: fixed !important; 
            top: 0 !important; left: 0 !important; right: 0 !important;
            height: 100px !important; 
            z-index: 1000 !important;
            display: flex !important;
            align-items: center !important;
            padding: 0 !important;
            margin: 0 !important;
        }

        #admin-header .header-content {
            max-width: 1200px !important; margin: 0 auto !important; padding: 0 24px !important; 
            width: 100% !important; display: flex !important; justify-content: space-between !important; 
            align-items: center !important;
        }

        #admin-header .back-arrow { 
            border: none !important; padding: 0 !important; margin: 0 !important; background: transparent !important;
            color: var(--text-secondary) !important; text-decoration: none !important; display: flex !important; 
            align-items: center !important; font-weight: 500 !important; font-size: 1rem !important; 
            transition: color 0.2s ease !important; gap: 4px !important; outline: none !important;
        }
        #admin-header .back-arrow:hover { color: #ffffff !important; }
        
        #admin-header .admin-title {
            color: var(--apple-red) !important; font-weight: 700 !important; font-size: 1.1rem !important; 
            letter-spacing: 1.5px !important; text-transform: uppercase !important; margin: 0 !important;
        }
        
        #admin-header .store-link {
            background: rgba(255, 255, 255, 0.1) !important; color: #fff !important; text-decoration: none !important;
            padding: 8px 16px !important; border-radius: 20px !important; font-size: 0.85rem !important; 
            font-weight: 600 !important; transition: all 0.2s ease !important; display: flex !important; 
            align-items: center !important; gap: 6px !important; border: none !important;
        }
        #admin-header .store-link:hover { background: rgba(255, 255, 255, 0.2) !important; }

        /* =========================================================
           CONTAINER PRINCIPAL
           ========================================================= */
        .panel-container-box { 
            max-width: 1000px; 
            margin: 120px auto 80px auto; 
            padding: 0 24px; 
            width: 100%; 
            box-sizing: border-box; 
            flex-direction: column;
        }

        .page-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 25px; }
        .page-header h1 { font-size: 2rem; font-weight: 700; margin: 0; letter-spacing: -0.5px; display: flex; align-items: center; gap: 10px;}
        .section-header { font-size: 1.4rem; font-weight: 700; margin-bottom: 20px; margin-top: 40px; color: #fff; letter-spacing: -0.5px; display: flex; align-items: center; justify-content: center; gap: 10px;}

        /* =========================================================
           AVISO PLÁSTICO BOLHA (ESTILO APPLE)
           ========================================================= */
        .bubble-wrap-alert {
            border-radius: 20px;
            padding: 24px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .bubble-wrap-alert.safe { background: rgba(50, 215, 75, 0.1); border-color: rgba(50, 215, 75, 0.3); }
        .bubble-wrap-alert.warning { background: rgba(255, 214, 10, 0.1); border-color: rgba(255, 214, 10, 0.3); }
        .bubble-wrap-alert.danger { background: rgba(255, 69, 58, 0.1); border-color: rgba(255, 69, 58, 0.3); }

        .bubble-wrap-info { display: flex; flex-direction: column; gap: 6px; }
        .bubble-wrap-title { font-size: 1.2rem; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px;}
        
        .bubble-wrap-alert.safe .bubble-wrap-title svg { color: var(--safe-green); }
        .bubble-wrap-alert.warning .bubble-wrap-title svg { color: var(--warning-yellow); }
        .bubble-wrap-alert.danger .bubble-wrap-title svg { color: var(--apple-red); }

        .bubble-wrap-details { font-size: 1rem; color: #d2d2d7; font-weight: 500;}
        .bubble-wrap-details strong { color: #fff; }

        .btn-manage-bubble {
            background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2);
            padding: 10px 20px; border-radius: 12px; font-weight: 600; font-size: 0.95rem;
            cursor: pointer; transition: all 0.2s ease; backdrop-filter: blur(10px);
        }
        .btn-manage-bubble:hover { background: rgba(255,255,255,0.2); transform: scale(1.05); }

        /* =========================================================
           CARDS DE CAIXAS & ROLOS
           ========================================================= */
        .grid-caixas { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-bottom: 50px;
        }
        
        .card-caixa { 
            background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 20px; 
            padding: 24px; position: relative; display: flex; flex-direction: column;
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); transition: transform 0.3s, border-color 0.3s;
        }
        .card-caixa:hover { transform: translateY(-5px); border-color: rgba(255,255,255,0.15); }
        .card-caixa h3 { margin: 0 0 15px 0; color: var(--accent); font-size: 1.3rem; font-weight: 700; letter-spacing: -0.5px;}
        
        .card-caixa.card-rolo h3 { color: #fff; }

        .card-caixa p { margin: 6px 0; color: var(--text-secondary); font-size: 0.95rem; display: flex; justify-content: space-between; align-items: center;}
        .card-caixa strong { color: #fff; font-weight: 600; text-align: right; }
        
        .badge-alerta { 
            background: rgba(255, 59, 48, 0.1); color: var(--apple-red); padding: 4px 10px; border-radius: 8px; 
            font-size: 0.75rem; font-weight: 700; text-transform: uppercase; position: absolute; 
            top: 24px; right: 24px; border: 1px solid rgba(255, 59, 48, 0.2); letter-spacing: 0.5px;
        }
        
        .acoes-caixa { display: flex; gap: 15px; margin-top: 20px; padding-top: 15px; border-top: 1px solid var(--border-color); align-items: center; justify-content: space-between;}
        
        /* Ações para a Caixa */
        .btn-editar { background: rgba(255,255,255,0.05); border: 1px solid transparent; color: #fff; border-radius: 8px; cursor: pointer; font-weight: 600; padding: 8px 16px; transition: all 0.2s; font-size: 0.85rem;}
        .btn-editar:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2);}
        .btn-excluir { background: rgba(255, 69, 58, 0.1); border: 1px solid transparent; color: var(--apple-red); border-radius: 8px; cursor: pointer; font-weight: 600; padding: 8px 16px; transition: all 0.2s; font-size: 0.85rem;}
        .btn-excluir:hover { background: rgba(255, 69, 58, 0.2); border-color: rgba(255, 69, 58, 0.3);}

        /* =========================================================
           CONTROLES DO ROLO (+/- E INPUT) - ESTILO APPLE/CARRINHO
           ========================================================= */
        .rolo-controls { 
            display: flex; align-items: center; background-color: #111; 
            border-radius: 20px; width: max-content; border: 1px solid #333; overflow: hidden;
            padding: 2px 4px; gap: 4px;
        }
        .btn-rolo-calc { 
            background: transparent; border: none; color: #fff; font-size: 1.2rem; 
            width: 32px; height: 32px; cursor: pointer; transition: background 0.2s; 
            display: flex; align-items: center; justify-content: center; border-radius: 50%;
        }
        .btn-rolo-calc:hover { background-color: rgba(255,255,255,0.1); }
        .rolo-val-input { 
            width: 45px; text-align: center; background: none; border: none; 
            color: #fff; font-size: 0.95rem; font-weight: 700; padding: 0; 
            -moz-appearance: textfield; outline: none;
        }
        .rolo-val-input::-webkit-outer-spin-button, 
        .rolo-val-input::-webkit-inner-spin-button { 
            -webkit-appearance: none; margin: 0; display: none;
        }

        /* NOVO: CARD HORIZONTAL PARA ADICIONAR ROLOS NO TOPO */
        .card-adicionar-sleek {
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed rgba(255, 255, 255, 0.15);
            display: flex; justify-content: center; align-items: center; gap: 10px;
            cursor: pointer; padding: 15px; border-radius: 16px;
            grid-column: 1 / -1; 
            transition: all 0.2s ease;
        }
        .card-adicionar-sleek:hover { 
            background: rgba(255, 255, 255, 0.05); 
            border-color: var(--accent); 
            color: var(--accent); 
        }
        .card-adicionar-sleek svg { width: 20px; height: 20px; color: inherit; }
        .card-adicionar-sleek span { font-size: 1rem; font-weight: 600; color: inherit; }

        /* CARD DE ADICIONAR (CAIXA) */
        .card-adicionar {
            background: rgba(255, 255, 255, 0.02);
            border: 2px dashed rgba(255, 255, 255, 0.15);
            justify-content: center;
            align-items: center;
            cursor: pointer;
            min-height: 197px;
        }
        .card-adicionar:hover { background: rgba(255, 255, 255, 0.05); border-color: var(--accent); }
        .card-adicionar svg { width: 48px; height: 48px; color: var(--accent); margin-bottom: 15px; transition: transform 0.3s ease; }
        .card-adicionar:hover svg { transform: scale(1.1); }
        .card-adicionar span { font-size: 1.2rem; font-weight: 600; color: #fff; }

        /* =========================================================
           ESTILOS GERAIS DE FORMULÁRIO (USADO NOS MODAIS)
           ========================================================= */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .input-group { display: flex; flex-direction: column; width: 100%;}
        .input-group label { font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; }
        .input-group input { 
            background-color: rgba(0,0,0,0.4) !important; border: 1.5px solid rgba(255,255,255,0.1) !important; 
            color: #fff !important; padding: 14px 16px !important; border-radius: 12px !important; 
            font-size: 0.95rem !important; font-family: inherit !important; transition: all 0.3s ease; 
            outline: none; box-sizing: border-box; width: 100%;
        }
        .input-group input:focus { border-color: var(--accent) !important; background-color: rgba(0,0,0,0.6) !important; box-shadow: 0 0 0 3px rgba(255, 255, 0, 0.1); }
        
        .btn-salvar { 
            background-color: var(--accent); color: #000; border: none; padding: 18px; 
            border-radius: 12px; font-size: 1.05rem; font-weight: 800; cursor: pointer; width: 100%; 
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); text-transform: uppercase; letter-spacing: 1px; margin-top: 10px; 
        }
        .btn-salvar:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(255, 255, 0, 0.2); background-color: #fff433; }

        /* =========================================================
           MODAIS (OVERLAY) - CAIXAS E ROLOS
           ========================================================= */
        .modal-overlay { 
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0, 0, 0, 0.75); 
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 2000; 
            display: none; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s ease; 
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-content { 
            background-color: #111; border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; 
            width: 95%; max-width: 600px; display: flex; flex-direction: column; 
            transform: translateY(20px) scale(0.98); transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); 
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8); overflow: hidden; max-height: 90vh;
        }
        
        #modal-gerir-rolos .modal-content { max-width: 800px; }
        .modal-overlay.active .modal-content { transform: translateY(0) scale(1); }
        
        .modal-header { padding: 24px 30px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; background: #111;}
        .modal-header h3 { margin: 0; color: #fff; font-size: 1.25rem; font-weight: 700;}
        .modal-close { background: #222; border: none; color: #86868b; width: 32px; height: 32px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .modal-close:hover { color: #fff; background: #333; }
        .modal-body { padding: 30px; overflow-y: auto; }

        /* =========================================================
           RESPONSIVIDADE MOBILE
           ========================================================= */
        @media (max-width: 768px) {
            #admin-header .header-content { padding: 0 15px !important; }
            #admin-header .admin-title { font-size: 1rem !important; }
            .form-grid { grid-template-columns: 1fr; gap: 0;}
            .page-header { flex-direction: column; align-items: flex-start; gap: 20px;}
            .page-header h1 { font-size: 1.6rem; }
            .modal-content { max-height: 90vh; border-radius: 24px 24px 0 0; position: absolute; bottom: 0; transform: translateY(100%); }
            .panel-container-box { margin-top: 130px; padding: 0 15px;}
            
            .bubble-wrap-alert { flex-direction: column; align-items: flex-start; gap: 15px; padding: 20px;}
            .btn-manage-bubble { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>

    <header id="admin-header">
        <div class="header-content">
            <a href="admin.html" class="back-arrow" title="Voltar ao Painel">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                <span>Voltar</span>
            </a>
            
            <div class="admin-title">ADMINISTRAÇÃO</div>
            
            <a href="store.html" class="store-link">
                Ver Loja <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5l7 7-7 7"></path></svg>
            </a>
        </div>
    </header>

    <main class="panel-container-box">
        <div class="page-header">
            <h1>📦 Gerenciar Embalagens</h1>
        </div>

        <div id="bubble-wrap-alert-container"></div>
        
        <h2 class="section-header">Caixas de Envio</h2>
        <div class="grid-caixas" id="lista-caixas">
            <p style="color: var(--text-secondary); width: 100%; text-align: center; padding: 40px 0;">A carregar base de dados de embalagens...</p>
        </div>
    </main>

    <div class="modal-overlay" id="modal-gerir-rolos">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="display: flex; align-items: center; gap: 8px;">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                    Estoque de Plástico Bolha
                </h3>
                <button class="modal-close" onclick="fecharModalRolos()">&times;</button>
            </div>
            <div class="modal-body" style="background: #000;">
                <div class="grid-caixas" id="lista-rolos-modal" style="margin-bottom: 0;">
                    </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-adicionar-rolo">
        <div class="modal-content" style="max-width: 500px;">
            <div class="modal-header">
                <h3>Cadastrar Rolo na Fábrica</h3>
                <button class="modal-close" onclick="fecharModalNovoRolo()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="form-novo-rolo">
                    <div class="form-grid" style="grid-template-columns: 1fr;">
                        <div class="input-group">
                            <label>Comprimento Total Inicial (Metros)</label>
                            <input type="number" step="0.1" id="rolo-comp" placeholder="Ex: 100" required>
                        </div>
                    </div>
                    <div class="form-grid">
                        <div class="input-group"><label>Largura do Rolo (cm)</label><input type="number" step="0.1" id="rolo-larg" placeholder="Ex: 50" required></div>
                        <div class="input-group"><label>Quantidade Recebida</label><input type="number" id="rolo-qtd" placeholder="Ex: 5" required></div>
                    </div>
                    <button type="submit" class="btn-salvar" id="btn-add-rolo" style="margin-top: 10px;">Adicionar ao Estoque</button>
                </form>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-editar">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Editar Caixa</h3>
                <button class="modal-close" onclick="fecharModalEdicao()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="form-editar-caixa">
                    <input type="hidden" id="edit-id">
                    <div class="form-grid" style="grid-template-columns: 1fr;">
                        <div class="input-group">
                            <label>Nome da Embalagem</label>
                            <input type="text" id="edit-nome" required>
                        </div>
                    </div>
                    <div class="form-grid">
                        <div class="input-group"><label>Altura (cm)</label><input type="number" step="0.1" id="edit-alt" required></div>
                        <div class="input-group"><label>Largura (cm)</label><input type="number" step="0.1" id="edit-larg" required></div>
                    </div>
                    <div class="form-grid">
                        <div class="input-group"><label>Comprimento (cm)</label><input type="number" step="0.1" id="edit-comp" required></div>
                        <div class="input-group"><label>Peso Vazia (kg)</label><input type="number" step="0.01" id="edit-peso" required></div>
                    </div>
                    <div class="form-grid" style="grid-template-columns: 1fr;">
                        <div class="input-group">
                            <label>Quantidade em Estoque</label>
                            <input type="number" id="edit-estoque" required>
                        </div>
                    </div>
                    <button type="submit" class="btn-salvar" id="btn-salvar-edicao" style="margin-top: 20px;">Salvar Alterações</button>
                </form>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-adicionar">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Cadastrar Nova Caixa</h3>
                <button class="modal-close" onclick="fecharModalAdicionar()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="form-caixa">
                    <div class="form-grid" style="grid-template-columns: 1fr;">
                        <div class="input-group">
                            <label>Nome (Ex: Caixa Padrão P)</label>
                            <input type="text" id="nome-caixa" placeholder="Identificação da embalagem" required>
                        </div>
                    </div>
                    <div class="form-grid">
                        <div class="input-group"><label>Altura (cm)</label><input type="number" step="0.1" id="alt" placeholder="Ex: 15" required></div>
                        <div class="input-group"><label>Largura (cm)</label><input type="number" step="0.1" id="larg" placeholder="Ex: 20" required></div>
                    </div>
                    <div class="form-grid">
                        <div class="input-group"><label>Comprimento (cm)</label><input type="number" step="0.1" id="comp" placeholder="Ex: 20" required></div>
                        <div class="input-group"><label>Peso Vazia (kg)</label><input type="number" step="0.01" id="peso" placeholder="Ex: 0.15" required></div>
                    </div>
                    <div class="form-grid" style="grid-template-columns: 1fr;">
                        <div class="input-group">
                            <label>Quantidade em Estoque</label>
                            <input type="number" id="estoque" placeholder="Ex: 100" required>
                        </div>
                    </div>
                    <button type="submit" class="btn-salvar" id="btn-add">Feito</button>
                </form>
            </div>
        </div>
    </div>

    <script src="apple-alerts.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBLDntUspio2er8xe71wOCyObbYa-HaH20", authDomain: "loja-guard.firebaseapp.com", projectId: "loja-guard" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);

        // =====================================================================
        // GESTÃO DE CAIXAS DE ENVIO
        // =====================================================================
        async function carregarCaixas() {
            const lista = document.getElementById('lista-caixas');
            const querySnapshot = await getDocs(collection(db, "caixas"));
            
            const cardAdicionarHTML = `
                <div class="card-caixa card-adicionar" onclick="abrirModalAdicionar()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <span>Nova Caixa</span>
                </div>
            `;
            
            if (querySnapshot.empty) {
                lista.innerHTML = '<p style="color: var(--text-secondary); width: 100%; text-align: center; padding: 40px 0; grid-column: 1 / -1;">Nenhuma caixa cadastrada no momento.</p>' + cardAdicionarHTML; 
                return;
            }

            let htmlRender = '';

            querySnapshot.forEach((doc) => {
                const cx = doc.data();
                const alerta = cx.estoque < 20 ? `<span class="badge-alerta">Restam ${cx.estoque}</span>` : '';
                htmlRender += `
                    <div class="card-caixa">
                        ${alerta}
                        <h3>${cx.nome}</h3>
                        <p><span>Dimensões (AxLxC):</span> <strong>${cx.altura}x${cx.largura}x${cx.comprimento} cm</strong></p>
                        <p><span>Peso Vazia:</span> <strong>${cx.pesoVazia} kg</strong></p>
                        <p><span>Estoque Atual:</span> <strong>${cx.estoque} un</strong></p>
                        
                        <div class="acoes-caixa">
                            <button class="btn-editar" onclick="abrirModalEdicao('${doc.id}', '${cx.nome}', ${cx.altura}, ${cx.largura}, ${cx.comprimento}, ${cx.pesoVazia}, ${cx.estoque})">Editar</button>
                            <button class="btn-excluir" onclick="excluirCaixa('${doc.id}')">Excluir</button>
                        </div>
                    </div>
                `;
            });
            
            htmlRender += cardAdicionarHTML;
            lista.innerHTML = htmlRender;
        }

        window.excluirCaixa = async function(id) {
            if(await guardConfirm("Tem certeza que deseja excluir permanentemente esta embalagem?", "Excluir Caixa")) {
                await deleteDoc(doc(db, "caixas", id));
                carregarCaixas();
            }
        };

        window.abrirModalEdicao = function(id, nome, alt, larg, comp, peso, estoque) {
            document.getElementById('edit-id').value = id;
            document.getElementById('edit-nome').value = nome;
            document.getElementById('edit-alt').value = alt;
            document.getElementById('edit-larg').value = larg;
            document.getElementById('edit-comp').value = comp;
            document.getElementById('edit-peso').value = peso;
            document.getElementById('edit-estoque').value = estoque;
            document.getElementById('modal-editar').classList.add('active');
        }

        window.fecharModalEdicao = function() { document.getElementById('modal-editar').classList.remove('active'); }
        window.abrirModalAdicionar = function() { document.getElementById('modal-adicionar').classList.add('active'); }
        window.fecharModalAdicionar = function() { 
            document.getElementById('modal-adicionar').classList.remove('active'); 
            document.getElementById('form-caixa').reset(); 
        }

        document.getElementById('form-editar-caixa').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-salvar-edicao');
            btn.textContent = "Salvando..."; btn.disabled = true;

            const id = document.getElementById('edit-id').value;
            const refDoc = doc(db, "caixas", id);

            await updateDoc(refDoc, {
                nome: document.getElementById('edit-nome').value,
                altura: Number(document.getElementById('edit-alt').value),
                largura: Number(document.getElementById('edit-larg').value),
                comprimento: Number(document.getElementById('edit-comp').value),
                pesoVazia: Number(document.getElementById('edit-peso').value),
                estoque: parseInt(document.getElementById('edit-estoque').value)
            });

            btn.textContent = "Salvar Alterações"; btn.disabled = false;
            fecharModalEdicao();
            carregarCaixas();
        });

        document.getElementById('form-caixa').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-add');
            btn.textContent = "Salvando..."; btn.disabled = true;

            await addDoc(collection(db, "caixas"), {
                nome: document.getElementById('nome-caixa').value,
                altura: Number(document.getElementById('alt').value),
                largura: Number(document.getElementById('larg').value),
                comprimento: Number(document.getElementById('comp').value),
                pesoVazia: Number(document.getElementById('peso').value),
                estoque: parseInt(document.getElementById('estoque').value)
            });
            
            document.getElementById('form-caixa').reset();
            btn.textContent = "Feito"; btn.disabled = false;
            fecharModalAdicionar(); carregarCaixas();
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // =====================================================================
        // GESTÃO DE PLÁSTICO BOLHA
        // =====================================================================
        let rolosDeBolha = [];
        let roloTimeout = null; 

        async function carregarPlasticoBolha() {
            const alertContainer = document.getElementById('bubble-wrap-alert-container');
            const listaModal = document.getElementById('lista-rolos-modal');
            
            try {
                const querySnapshot = await getDocs(collection(db, "plastico_bolha"));
                rolosDeBolha = [];
                let totalMetrosRestantes = 0;

                querySnapshot.forEach((doc) => {
                    const rolo = { id: doc.id, ...doc.data() };
                    rolosDeBolha.push(rolo);
                    totalMetrosRestantes += Number(rolo.comprimentoAtual);
                });

                rolosDeBolha.sort((a, b) => a.comprimentoAtual - b.comprimentoAtual);

                if (rolosDeBolha.length === 0) {
                    alertContainer.innerHTML = `
                        <div class="bubble-wrap-alert danger">
                            <div class="bubble-wrap-info">
                                <div class="bubble-wrap-title">
                                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                                    Sem Plástico Bolha!
                                </div>
                                <div class="bubble-wrap-details">Você não tem nenhum rolo registado no estoque.</div>
                            </div>
                            <button class="btn-manage-bubble" onclick="abrirModalRolos()">Configurar</button>
                        </div>
                    `;
                } else {
                    let descricoes = [];
                    let mapaGrupos = {};
                    rolosDeBolha.forEach(r => {
                        const m = Number(r.comprimentoAtual).toFixed(1);
                        if(!mapaGrupos[m]) mapaGrupos[m] = 0;
                        mapaGrupos[m]++;
                    });
                    
                    for (const [metros, qtd] of Object.entries(mapaGrupos)) {
                        descricoes.push(`${qtd} ${qtd > 1 ? 'rolos' : 'rolo'} de ${metros}m`);
                    }
                    const textoDetalhe = "Restam: " + descricoes.join(' e ');

                    let statusClass = 'safe';
                    let icon = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>';
                    let tituloTexto = "Estoque bom";

                    if (totalMetrosRestantes < 20) {
                        statusClass = 'danger';
                        tituloTexto = "Estoque crítico!";
                        icon = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>';
                    } else if (totalMetrosRestantes < 50) {
                        statusClass = 'warning';
                        tituloTexto = "Atenção ao estoque";
                        icon = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>';
                    }

                    alertContainer.innerHTML = `
                        <div class="bubble-wrap-alert ${statusClass}">
                            <div class="bubble-wrap-info">
                                <div class="bubble-wrap-title">${icon} ${tituloTexto} (${totalMetrosRestantes.toFixed(1)}m de plástico bolha no total)</div>
                                <div class="bubble-wrap-details">${textoDetalhe}</div>
                            </div>
                            <button class="btn-manage-bubble" onclick="abrirModalRolos()">Gerir</button>
                        </div>
                    `;
                }

                const cardAdicionarRoloHTML = `
                    <div class="card-adicionar-sleek" onclick="abrirModalNovoRolo()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        <span>Adicionar Novos Rolos</span>
                    </div>
                `;

                let htmlRolos = '';
                
                rolosDeBolha.forEach((rolo) => {
                    const pctg = (rolo.comprimentoAtual / rolo.comprimentoInicial) * 100;
                    const corRolo = pctg < 20 ? 'var(--apple-red)' : (pctg < 50 ? 'var(--warning-yellow)' : 'var(--safe-green)');

                    htmlRolos += `
                        <div class="card-caixa card-rolo">
                            <h3 style="display: flex; justify-content: space-between; align-items: center; font-size: 1.1rem; margin-bottom: 15px;">
                                Rolo
                                <button class="btn-excluir" onclick="excluirRolo('${rolo.id}')" style="padding: 6px 12px; font-size: 0.85rem; background: rgba(255,69,58,0.1); color: var(--apple-red); border-radius: 8px; font-weight: 600;">Excluir</button>
                            </h3>
                            <p style="margin: 4px 0;"><span>Largura Fixa:</span> <strong style="text-align: right;">${rolo.largura} cm</strong></p>
                            <p style="margin: 4px 0;"><span>Comp. Original:</span> <strong style="text-align: right;">${rolo.comprimentoInicial} m</strong></p>
                            
                            <div style="margin-top: 15px; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); display: flex; justify-content: space-between; align-items: center;">
                                <div style="display: flex; flex-direction: column; gap: 4px;">
                                    <span style="font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px;">Restante</span>
                                    <span id="label-restante-${rolo.id}" style="color: ${corRolo}; font-weight: 800; font-size: 1.1rem; transition: color 0.3s;">${Number(rolo.comprimentoAtual).toFixed(1)} m</span>
                                </div>
                                
                                <div class="rolo-controls">
                                    <button class="btn-rolo-calc" onclick="alterarRoloVisivo('${rolo.id}', -0.5)">-</button>
                                    <input type="number" class="rolo-val-input" id="rolo-input-${rolo.id}" value="${Number(rolo.comprimentoAtual).toFixed(1)}" step="0.1" onchange="salvarRoloManual('${rolo.id}')">
                                    <button class="btn-rolo-calc" onclick="alterarRoloVisivo('${rolo.id}', 0.5)">+</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                htmlRolos += cardAdicionarRoloHTML;
                listaModal.innerHTML = htmlRolos;

            } catch (error) {
                console.error("Erro ao puxar plástico bolha:", error);
            }
        }

        window.abrirModalRolos = function() { document.getElementById('modal-gerir-rolos').classList.add('active'); }
        window.fecharModalRolos = function() { document.getElementById('modal-gerir-rolos').classList.remove('active'); }

        window.abrirModalNovoRolo = function() { 
            document.getElementById('modal-gerir-rolos').classList.remove('active');
            document.getElementById('modal-adicionar-rolo').classList.add('active'); 
        }
        window.fecharModalNovoRolo = function() { 
            document.getElementById('modal-adicionar-rolo').classList.remove('active'); 
            document.getElementById('form-novo-rolo').reset();
            abrirModalRolos();
        }

        document.getElementById('form-novo-rolo').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-add-rolo');
            btn.textContent = "Adicionando..."; btn.disabled = true;

            const comp = Number(document.getElementById('rolo-comp').value);
            const larg = Number(document.getElementById('rolo-larg').value);
            const qtd = parseInt(document.getElementById('rolo-qtd').value);

            try {
                for(let i=0; i<qtd; i++) {
                    await addDoc(collection(db, "plastico_bolha"), {
                        comprimentoInicial: comp,
                        comprimentoAtual: comp,
                        largura: larg,
                        dataCadastro: new Date()
                    });
                }
                document.getElementById('form-novo-rolo').reset();
                fecharModalNovoRolo();
                await carregarPlasticoBolha();
            } catch(e) { console.error("Erro", e); }
            finally { btn.textContent = "Adicionar ao Estoque"; btn.disabled = false; }
        });

        window.alterarRoloVisivo = function(id, variacao) {
            const input = document.getElementById(`rolo-input-${id}`);
            const label = document.getElementById(`label-restante-${id}`);
            
            let valAtual = Number(input.value);
            let novoVal = Math.max(0, valAtual + variacao);
            
            input.value = novoVal.toFixed(1);
            label.textContent = novoVal.toFixed(1) + " m";
            
            const roloRef = rolosDeBolha.find(r => r.id === id);
            if(roloRef) {
                const pctg = (novoVal / roloRef.comprimentoInicial) * 100;
                label.style.color = pctg < 20 ? 'var(--apple-red)' : (pctg < 50 ? 'var(--warning-yellow)' : 'var(--safe-green)');
            }

            if (roloTimeout) clearTimeout(roloTimeout);
            
            roloTimeout = setTimeout(async () => {
                try {
                    await updateDoc(doc(db, "plastico_bolha", id), { comprimentoAtual: novoVal });
                    await carregarPlasticoBolha();
                } catch (e) { console.error("Erro ao alterar banco", e); }
            }, 800);
        }

        window.salvarRoloManual = async function(id) {
            const input = document.getElementById(`rolo-input-${id}`);
            let novoVal = Math.max(0, Number(input.value));
            
            try {
                await updateDoc(doc(db, "plastico_bolha", id), { comprimentoAtual: novoVal });
                await carregarPlasticoBolha(); 
            } catch (e) { console.error("Erro ao alterar", e); }
        }

        window.excluirRolo = async function(id) {
            if(await guardConfirm("Deseja remover este rolo do estoque permanentemente?", "Remover Rolo")) {
                await deleteDoc(doc(db, "plastico_bolha", id));
                await carregarPlasticoBolha();
            }
        }

        document.addEventListener('click', (e) => {
            if (e.target.id === 'modal-editar') fecharModalEdicao();
            if (e.target.id === 'modal-adicionar') fecharModalAdicionar();
            if (e.target.id === 'modal-gerir-rolos') fecharModalRolos();
            if (e.target.id === 'modal-adicionar-rolo') fecharModalNovoRolo();
        });

        carregarCaixas();
        carregarPlasticoBolha();
    </script>
</body>
</html>
