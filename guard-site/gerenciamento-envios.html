<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Logística e Envios - Admin Guard</title>
    <link rel="icon" type="image/webp" href="imagens/logo.webp">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&family=Fira+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Todo o CSS embutido, sem depender do Style.css -->
    <style>
        /* =========================================================
           VARIÁVEIS APPLE DARK MODE E RESET GERAL
           ========================================================= */
        :root {
            --bg-color: #000000;
            --surface-color: rgba(28, 28, 30, 0.6);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f5f5f7;
            --text-secondary: #86868b;
            --apple-red: #ff453a;
            --accent: #FFFF00;
            --safe-green: #32d74b;
            --apple-blue: #0a84ff;
            --apple-orange: #ff9f0a;
        }

        html, body {
            overflow-x: hidden; width: 100%; margin: 0; padding: 0;
            background-color: var(--bg-color); color: var(--text-primary);
            font-family: 'Fira Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-image: radial-gradient(circle at 50% 0%, rgba(255,255,0,0.02) 0%, transparent 60%);
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000000; border-radius: 4px;}
        ::-webkit-scrollbar-thumb { background: #333333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555555; }

        /* =========================================================
           CABEÇALHO ADMINISTRATIVO
           ========================================================= */
        header {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 1000;
        }
        .header-content {
            max-width: 1200px; margin: 0 auto; padding: 0 24px; height: 100px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .back-arrow { 
            color: var(--text-secondary); text-decoration: none; display: flex; align-items: center; 
            font-weight: 500; font-size: 1rem; transition: color 0.2s ease; gap: 4px;
        }
        .back-arrow:hover { color: #ffffff; }
        .admin-title {
            color: var(--apple-red); font-weight: 700; font-size: 1.1rem; 
            letter-spacing: 1.5px; text-transform: uppercase;
        }
        .store-link {
            background: rgba(255, 255, 255, 0.1); color: #fff; text-decoration: none;
            padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 600;
            transition: all 0.2s ease; display: flex; align-items: center; gap: 6px;
        }
        .store-link:hover { background: rgba(255, 255, 255, 0.2); }

        /* =========================================================
           LAYOUT PRINCIPAL E TABELA
           ========================================================= */
        .panel-container {
            display: block; max-width: 1200px; margin: 40px auto 80px; padding: 0 24px; 
            width: 100%; box-sizing: border-box;
        }
        
        .page-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; width: 100%;
        }
        .page-header h1 { font-size: 2rem; font-weight: 700; margin: 0; letter-spacing: -0.5px;}

        .table-wrapper {
            background: var(--surface-color); border: 1px solid var(--border-color);
            border-radius: 24px; padding: 20px 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            width: 100%; box-sizing: border-box; overflow-x: auto;
        }

        .admin-table { width: 100%; border-collapse: collapse; }
        .admin-table th {
            text-align: left; padding: 15px 10px; color: var(--text-secondary); 
            font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .admin-table td {
            padding: 18px 10px; vertical-align: middle; border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.95rem; color: #fff; font-weight: 500;
        }
        .admin-table tbody tr:hover { background-color: rgba(255,255,255,0.02); }
        .admin-table tbody tr:last-child td { border-bottom: none; }

        /* Estilo das Células */
        .client-name { font-weight: 700; font-size: 1.05rem; display: block; margin-bottom: 4px; }
        .order-id { color: var(--text-secondary); font-size: 0.8rem; font-family: monospace; }
        
        .rastreio-code-display { font-family: monospace; font-size: 1rem; color: var(--accent); font-weight: 700; letter-spacing: 1px; display: block; margin-top: 4px;}
        .transportadora-display { font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase;}

        /* Badges */
        .badge {
            padding: 6px 12px; border-radius: 50px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; display: inline-flex; align-items: center; gap: 6px;
        }
        .badge-pendente { background: rgba(255, 159, 10, 0.1); color: var(--apple-orange); border: 1px solid rgba(255, 159, 10, 0.3); }
        .badge-sucesso { background: rgba(50, 215, 75, 0.1); color: var(--safe-green); border: 1px solid rgba(50, 215, 75, 0.3); }

        /* Botões */
        .btn-action {
            background: none; border: none; padding: 8px 16px; border-radius: 8px; font-size: 0.85rem; 
            font-weight: 700; cursor: pointer; transition: all 0.2s ease; border: 1px solid transparent; text-transform: uppercase;
        }
        .btn-upload { background: var(--accent); color: #000; box-shadow: 0 4px 10px rgba(255,255,0,0.1); }
        .btn-upload:hover { background: #e6e600; transform: translateY(-2px); }
        
        .btn-edit { background: rgba(255,255,255,0.05); color: #fff; border-color: rgba(255,255,255,0.1); }
        .btn-edit:hover { background: rgba(255,255,255,0.1); }

        /* =========================================================
           MODAIS (DESIGN APPLE) E FORMULÁRIOS
           ========================================================= */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 2000;
            display: none; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s ease;
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        
        .modal-content {
            background-color: #111; border: 1px solid rgba(255,255,255,0.1); border-radius: 20px;
            width: 95%; max-width: 500px; display: flex; flex-direction: column;
            transform: translateY(20px) scale(0.98); transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8); overflow: hidden; max-height: 90vh;
        }
        .modal-overlay.active .modal-content { transform: translateY(0) scale(1); }

        .modal-header { padding: 24px 30px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { margin: 0; color: #fff; font-size: 1.25rem; font-weight: 700;}
        .modal-close { background: #222; border: none; color: #86868b; width: 32px; height: 32px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0;}
        .modal-close:hover { color: #fff; background: #333; }

        .modal-body { padding: 30px; text-align: left; overflow-y: auto;}

        /* Inputs do Modal */
        .input-group { display: flex; flex-direction: column; margin-bottom: 20px;}
        .input-group label { font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; }
        .input-group input, .input-group select { 
            background-color: rgba(0,0,0,0.4); border: 1.5px solid rgba(255,255,255,0.1); 
            color: #fff; padding: 16px 18px; border-radius: 12px; font-size: 1rem; 
            font-family: inherit; transition: all 0.3s ease; outline: none; width: 100%; box-sizing: border-box;
        }
        .input-group input:focus, .input-group select:focus { border-color: var(--accent); background-color: rgba(0,0,0,0.6); box-shadow: 0 0 0 3px rgba(255, 255, 0, 0.1); }
        .input-group select { appearance: none; -webkit-appearance: none; background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2386868b%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E"); background-repeat: no-repeat; background-position: right 20px top 50%; background-size: 12px auto; }
        
        .checkbox-container { display: flex; align-items: center; gap: 12px; margin-top: 5px; cursor: pointer; background: rgba(50, 215, 75, 0.05); padding: 15px; border-radius: 12px; border: 1px dashed rgba(50, 215, 75, 0.3);}
        .checkbox-container input { accent-color: var(--safe-green); width: 20px; height: 20px; cursor: pointer; }
        .checkbox-container label { color: var(--safe-green); font-size: 0.9rem; cursor: pointer; font-weight: 600; user-select: none; }

        .modal-footer { padding: 20px 30px; border-top: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: flex-end; gap: 15px;}
        .btn-cancelar { background: transparent; color: #86868b; border: 1px solid #424245; padding: 12px 24px; border-radius: 10px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-cancelar:hover { color: #fff; border-color: #666; background: rgba(255,255,255,0.05);}
        .btn-salvar-modal { background-color: var(--accent); color: #000; border: none; padding: 12px 32px; border-radius: 10px; font-size: 0.95rem; font-weight: 800; cursor: pointer; transition: all 0.2s; text-transform: uppercase; }
        .btn-salvar-modal:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255, 255, 0, 0.2); background-color: #fff433; }
        .btn-salvar-modal:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

        /* =========================================================
           RESPONSIVIDADE MOBILE (ATÉ 1024px) - CARDS APPLE
           ========================================================= */
        @media (max-width: 1024px) {
            .page-header { flex-direction: column; align-items: flex-start; gap: 10px; margin-bottom: 20px; margin-top: 20px; }
            .page-header h1 { font-size: 1.8rem; }
            .table-wrapper { padding: 0; background: transparent; border: none; box-shadow: none; backdrop-filter: none; }
            .admin-title { font-size: 1rem; }
            .header-content { padding: 0 15px; height: 65px;}
            
            .modal-content { width: 100%; max-width: none; border-radius: 24px 24px 0 0; position: absolute; bottom: 0; transform: translateY(100%); max-height: 90vh; }
            .modal-footer { flex-direction: column; }
            .btn-cancelar, .btn-salvar-modal { width: 100%; text-align: center; padding: 16px;}

            /* Conversão da tabela para Cards */
            .admin-table thead { display: none !important; }
            .admin-table, .admin-table tbody { display: block !important; width: 100% !important; }
            
            .admin-table tr { 
                display: flex !important; flex-direction: column !important;
                background-color: #111 !important; 
                border: 1px solid rgba(255,255,255,0.08) !important; 
                border-radius: 20px !important; 
                margin-bottom: 20px !important; 
                padding: 24px !important; 
                gap: 12px !important;
                box-shadow: 0 10px 20px rgba(0,0,0,0.3) !important;
            }
            
            .admin-table td {
                display: flex !important; justify-content: space-between !important; align-items: center !important;
                padding: 0 !important; border: none !important;
                text-align: right !important; width: 100% !important; box-sizing: border-box !important;
            }

            .admin-table td::before {
                content: attr(data-label); font-weight: 600 !important;
                color: var(--text-secondary) !important; text-transform: uppercase !important; font-size: 0.8rem !important;
                text-align: left !important;
            }

            /* Células Customizadas no Mobile */
            .admin-table td[data-label="Cliente"] { flex-direction: column !important; align-items: flex-start !important; gap: 8px !important; }
            .admin-table td[data-label="Cliente"]::before { display: none !important; }
            .admin-table td[data-label="Cliente"] .client-name { font-size: 1.3rem !important; font-weight: 700 !important; color: #fff !important; text-align: left !important; margin: 0 !important;}
            .admin-table td[data-label="Cliente"] .order-id { font-size: 0.8rem !important; background: rgba(255,255,255,0.05) !important; color: #fff !important; padding: 6px 12px !important; border-radius: 8px !important; font-weight: 700 !important; letter-spacing: 1px;}

            .admin-table td[data-label="Status do Pedido"] { padding-bottom: 16px !important; border-bottom: 1px solid rgba(255,255,255,0.05) !important; }
            
            .admin-table td[data-label="Rastreio"] { flex-direction: column; align-items: flex-end !important; justify-content: center !important;}
            .admin-table td[data-label="Rastreio"]::before { margin-bottom: 8px;}

            .admin-table td[data-label="Ações"] { justify-content: space-between !important; padding-top: 12px !important; gap: 12px !important; flex-wrap: wrap !important; flex-direction: row !important;}
            .admin-table td[data-label="Ações"]::before { display: none !important; }
            
            .btn-action { flex: 1 1 auto !important; margin: 0 !important; padding: 16px !important; font-size: 0.95rem !important; border-radius: 12px !important; display: flex !important; justify-content: center !important; align-items: center !important; }
            .btn-upload { background: var(--accent) !important; color: #000 !important; min-width: 100% !important;}
        }

        .spinner { width: 18px; height: 18px; border: 3px solid rgba(0,0,0,0.2); border-top-color: #000; border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; margin-right: 8px;}
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <a href="admin.html" class="back-arrow" title="Voltar ao Painel">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                <span>Voltar</span>
            </a>
            <div class="admin-title">ADMINISTRAÇÃO</div>
            <a href="store.html" class="store-link">
                Ver Loja <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5l7 7-7 7"></path></svg>
            </a>
        </div>
    </header>

    <main class="panel-container">
        <div class="page-header">
            <h1>Logística e Envios</h1>
        </div>

        <div class="table-wrapper">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Cliente / Pedido</th>
                        <th>Status do Pedido</th>
                        <th>Rastreio</th>
                        <th style="text-align: right;">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-envios">
                    <tr><td colspan="4" style="text-align: center; color: var(--accent); padding: 40px;">Buscando pedidos...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- MODAL VINCULAR RASTREIO -->
    <div id="modal-rastreio" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Vincular Rastreio</h3>
                <button class="modal-close" onclick="fecharModalRastreio()">&times;</button>
            </div>
            
            <div class="modal-body">
                <p style="color: #888; margin-top: 0; margin-bottom: 20px;">Cliente: <strong id="upload-cliente-nome" style="color: #fff;">...</strong></p>
                
                <form id="form-rastreio">
                    <input type="hidden" id="hidden-pedido-id">
                    
                    <div class="input-group">
                        <label>Transportadora</label>
                        <select id="input-transportadora" required>
                            <option value="" disabled selected>Selecione...</option>
                            <option value="Correios">Correios - Sedex</option>
                            <option value="Correios">Correios - PAC</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Código de Rastreamento</label>
                        <input type="text" id="input-codigo" placeholder="Ex: QA123456789BR" required style="text-transform: uppercase;">
                    </div>

                    <div class="checkbox-container">
                        <input type="checkbox" id="chk-atualizar-status" checked>
                        <label for="chk-atualizar-status">Mudar status do pedido para "Em Trânsito" automaticamente.</label>
                    </div>

                    <div class="modal-footer" style="padding: 20px 0 0 0; border: none; margin-top: 10px;">
                        <button type="button" class="btn-cancelar" onclick="fecharModalRastreio()">Cancelar</button>
                        <button type="submit" class="btn-salvar-modal" id="btn-salvar-rastreio">Salvar Envio</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Script de Alertas (Importando o Padrão do Projeto) -->
    <script src="apple-alerts.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Credenciais do Banco
        const firebaseConfig = {
            apiKey: "AIzaSyBLDntUspio2er8xe71wOCyObbYa-HaH20",
            authDomain: "loja-guard.firebaseapp.com",
            projectId: "loja-guard",
            storageBucket: "loja-guard.firebasestorage.app",
            messagingSenderId: "1084706871985",
            appId: "1:1084706871985:web:c3af274bfb7f99843d6090"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let pedidosGlobal = [];

        async function carregarEnvios() {
            const tbody = document.getElementById('tabela-envios');
            tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: var(--accent); padding: 40px;">Buscando pedidos...</td></tr>';
            pedidosGlobal = [];
            
            try {
                // Traz todos os pedidos do mais novo pro mais antigo
                const q = query(collection(db, "pedidos"), orderBy("dataCriacao", "desc"));
                const querySnapshot = await getDocs(q);
                let html = '';
                
                querySnapshot.forEach((documento) => {
                    const pedido = { id: documento.id, ...documento.data() };
                    pedidosGlobal.push(pedido);
                    
                    const idCurto = pedido.id.substring(0, 8).toUpperCase();
                    const statusAtual = pedido.status || "Aguardando Pagamento";
                    const temRastreio = pedido.codigoRastreio && pedido.codigoRastreio !== "";
                    
                    // Renderiza Badge de Rastreio
                    let badgeRastreio = '';
                    if (temRastreio) {
                        badgeRastreio = `
                            <span class="badge badge-sucesso">
                                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                Anexado
                            </span>
                            <span class="transportadora-display">${pedido.transportadora || 'Correios'}</span>
                            <span class="rastreio-code-display">${pedido.codigoRastreio}</span>
                        `;
                    } else {
                        badgeRastreio = `
                            <span class="badge badge-pendente">
                                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                                Aguardando Envio
                            </span>
                        `;
                    }

                    // Renderiza Botões
                    const botaoAcao = temRastreio
                        ? `<button class="btn-action btn-edit" onclick="abrirModalRastreio('${pedido.id}')">Editar Código</button>`
                        : `<button class="btn-action btn-upload" onclick="abrirModalRastreio('${pedido.id}')">Adicionar Rastreio</button>`;

                    html += `
                        <tr>
                            <td data-label="Cliente">
                                <span class="client-name">${pedido.clienteNome}</span>
                                <span class="order-id">#${idCurto}</span>
                            </td>
                            <td data-label="Status do Pedido">
                                <span>${statusAtual}</span>
                            </td>
                            <td data-label="Rastreio">
                                ${badgeRastreio}
                            </td>
                            <td data-label="Ações" style="text-align: right; min-width: 180px;">
                                ${botaoAcao}
                            </td>
                        </tr>
                    `;
                });
                
                if(html === '') html = '<tr><td colspan="4" style="text-align: center; padding: 40px; color: var(--text-secondary);">Nenhum pedido encontrado.</td></tr>';
                tbody.innerHTML = html;
                
            } catch (error) {
                console.error("Erro ao carregar envios:", error);
                tbody.innerHTML = '<tr><td colspan="4" style="color: var(--apple-red); text-align: center; padding: 40px;">Erro ao ler o banco de dados.</td></tr>';
            }
        }

        // ==========================================
        // LÓGICA DO MODAL
        // ==========================================
        const modalRastreio = document.getElementById('modal-rastreio');
        const inputCodigo = document.getElementById('input-codigo');
        const inputTransportadora = document.getElementById('input-transportadora');
        const checkboxStatus = document.getElementById('chk-atualizar-status');
        const btnSalvar = document.getElementById('btn-salvar-rastreio');

        window.abrirModalRastreio = function(idPedido) {
            const pedido = pedidosGlobal.find(p => p.id === idPedido);
            if(!pedido) return;

            document.getElementById('hidden-pedido-id').value = pedido.id;
            document.getElementById('upload-cliente-nome').textContent = pedido.clienteNome;
            
            // Preenche dados se já existir rastreio
            inputCodigo.value = pedido.codigoRastreio || "";
            inputTransportadora.value = pedido.transportadora || "";
            
            // Se o pedido já estiver enviado ou entregue, desmarca a checkbox por padrão
            if (pedido.status && (pedido.status.includes('Trânsito') || pedido.status.includes('Entregue'))) {
                checkboxStatus.checked = false;
            } else {
                checkboxStatus.checked = true;
            }

            modalRastreio.classList.add('active');
        };

        window.fecharModalRastreio = function() {
            modalRastreio.classList.remove('active');
        };

        modalRastreio.addEventListener('click', (e) => {
            if (e.target === modalRastreio) fecharModalRastreio();
        });

        // Formata o código para sempre maiúsculo
        inputCodigo.addEventListener('input', function() {
            this.value = this.value.toUpperCase().replace(/\s/g, '');
        });

        // ==========================================
        // SALVAR NO FIREBASE
        // ==========================================
        document.getElementById('form-rastreio').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const pedidoId = document.getElementById('hidden-pedido-id').value;
            const codigo = inputCodigo.value.trim();
            const transp = inputTransportadora.value;
            const mudarStatus = checkboxStatus.checked;

            btnSalvar.disabled = true;
            btnSalvar.innerHTML = '<span class="spinner"></span> Salvando...';

            try {
                const dadosParaAtualizar = {
                    codigoRastreio: codigo,
                    transportadora: transp
                };

                // Lógica de Ouro: Atualiza o status do pedido para o cliente ver no Dashboard dele
                if (mudarStatus) {
                    dadosParaAtualizar.status = "Em Trânsito";
                }

                const pedidoDocRef = doc(db, "pedidos", pedidoId);
                await updateDoc(pedidoDocRef, dadosParaAtualizar);

                if (typeof guardAlert === "function") {
                    await guardAlert("Código de rastreio vinculado com sucesso!", "Envio Registrado");
                } else {
                    alert("Código de rastreio vinculado com sucesso!");
                }
                
                fecharModalRastreio();
                carregarEnvios(); // Recarrega a tabela para mostrar a badge verde

            } catch (error) {
                console.error("Erro ao salvar rastreio:", error);
                if (typeof guardAlert === "function") {
                    guardAlert("Ocorreu um erro ao salvar o código. Verifique sua conexão.", "Erro");
                } else {
                    alert("Erro ao salvar o código.");
                }
            } finally {
                btnSalvar.innerHTML = 'Salvar Envio';
                btnSalvar.disabled = false;
            }
        });

        // Inicia
        carregarEnvios();
    </script>
</body>
</html>
