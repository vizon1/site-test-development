<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Gerir Caixas - Admin Guard</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/webp" href="imagens/logo.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&family=Fira+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Style.css">
    <style>
        /* =========================================================
           VARIÁVEIS APPLE DARK MODE E RESET
           ========================================================= */
        :root {
            --bg-color: #000000;
            --surface-color: rgba(28, 28, 30, 0.6);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f5f5f7;
            --text-secondary: #86868b;
            --apple-red: #ff453a;
            --accent: #FFFF00;
        }

        html, body {
            overflow-x: hidden; width: 100%; margin: 0; padding: 0;
            background-color: var(--bg-color); color: var(--text-primary);
            font-family: 'Fira Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-image: radial-gradient(circle at 50% 0%, rgba(255,255,0,0.02) 0%, transparent 60%);
            -webkit-font-smoothing: antialiased;
        }

        /* =========================================================
           CABEÇALHO ADMINISTRATIVO (ALTURA 100px)
           ========================================================= */
        header#admin-header {
            background: rgba(0, 0, 0, 0.75) !important;
            backdrop-filter: saturate(180%) blur(20px) !important; 
            -webkit-backdrop-filter: saturate(180%) blur(20px) !important;
            border-bottom: 1px solid var(--border-color) !important; 
            position: fixed !important; /* Fixed garante que flutue */
            top: 0 !important; left: 0 !important; right: 0 !important;
            height: 100px !important; /* ALTURA CRAVADA EM 100PX */
            z-index: 1000 !important;
            display: flex !important;
            align-items: center !important;
            padding: 0 !important;
            margin: 0 !important;
        }

        #admin-header .header-content {
            max-width: 1200px !important; margin: 0 auto !important; padding: 0 24px !important; 
            width: 100% !important; display: flex !important; justify-content: space-between !important; 
            align-items: center !important;
        }

        /* BOTÃO VOLTAR (SEM PADDING OU BORDER) */
        #admin-header .back-arrow { 
            border: none !important; padding: 0 !important; margin: 0 !important; background: transparent !important;
            color: var(--text-secondary) !important; text-decoration: none !important; display: flex !important; 
            align-items: center !important; font-weight: 500 !important; font-size: 1rem !important; 
            transition: color 0.2s ease !important; gap: 4px !important; outline: none !important;
        }
        #admin-header .back-arrow:hover { color: #ffffff !important; }
        
        #admin-header .admin-title {
            color: var(--apple-red) !important; font-weight: 700 !important; font-size: 1.1rem !important; 
            letter-spacing: 1.5px !important; text-transform: uppercase !important; margin: 0 !important;
        }
        
        #admin-header .store-link {
            background: rgba(255, 255, 255, 0.1) !important; color: #fff !important; text-decoration: none !important;
            padding: 8px 16px !important; border-radius: 20px !important; font-size: 0.85rem !important; 
            font-weight: 600 !important; transition: all 0.2s ease !important; display: flex !important; 
            align-items: center !important; gap: 6px !important; border: none !important;
        }
        #admin-header .store-link:hover { background: rgba(255, 255, 255, 0.2) !important; }

        /* =========================================================
           CONTAINER PRINCIPAL (MARGIN-TOP 120px)
           ========================================================= */
        .panel-container { 
            max-width: 1000px; 
            margin: 120px auto 80px auto; /* 120PX DE MARGEM NO TOPO PARA NÃO ESCONDER */
            padding: 0 24px; 
            width: 100%; 
            box-sizing: border-box; 
        }

        .page-header {
            display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 25px;
        }
        .page-header h1 { font-size: 2rem; font-weight: 700; margin: 0; letter-spacing: -0.5px; display: flex; align-items: center; gap: 10px;}

        /* =========================================================
           CARDS DE CAIXAS
           ========================================================= */
        .grid-caixas { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-bottom: 50px;
        }
        
        .card-caixa { 
            background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 20px; 
            padding: 24px; position: relative; display: flex; flex-direction: column;
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); transition: transform 0.3s, border-color 0.3s;
        }
        .card-caixa:hover { transform: translateY(-5px); border-color: rgba(255,255,255,0.15); }
        .card-caixa h3 { margin: 0 0 15px 0; color: var(--accent); font-size: 1.3rem; font-weight: 700; letter-spacing: -0.5px;}
        .card-caixa p { margin: 6px 0; color: var(--text-secondary); font-size: 0.95rem; display: flex; justify-content: space-between;}
        .card-caixa strong { color: #fff; font-weight: 600; }
        
        .badge-alerta { 
            background: rgba(255, 59, 48, 0.1); color: var(--apple-red); padding: 4px 10px; border-radius: 8px; 
            font-size: 0.75rem; font-weight: 700; text-transform: uppercase; position: absolute; 
            top: 24px; right: 24px; border: 1px solid rgba(255, 59, 48, 0.2); letter-spacing: 0.5px;
        }
        
        .acoes-caixa { display: flex; gap: 15px; margin-top: 20px; padding-top: 15px; border-top: 1px solid var(--border-color); align-items: center; justify-content: space-between;}
        .btn-editar { background: rgba(255,255,255,0.05); border: 1px solid transparent; color: #fff; border-radius: 8px; cursor: pointer; font-weight: 600; padding: 8px 16px; transition: all 0.2s; font-size: 0.85rem;}
        .btn-editar:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2);}
        .btn-excluir { background: rgba(255, 69, 58, 0.1); border: 1px solid transparent; color: var(--apple-red); border-radius: 8px; cursor: pointer; font-weight: 600; padding: 8px 16px; transition: all 0.2s; font-size: 0.85rem;}
        .btn-excluir:hover { background: rgba(255, 69, 58, 0.2); border-color: rgba(255, 69, 58, 0.3);}

        /* =========================================================
           FORMULÁRIO DE NOVA CAIXA
           ========================================================= */
        .form-box { 
            background: var(--surface-color); border: 1px solid var(--border-color); 
            border-radius: 24px; padding: 35px; backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .form-box h2 { margin-top: 0; margin-bottom: 25px; font-size: 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 15px;}
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .input-group { display: flex; flex-direction: column; width: 100%;}
        .input-group label { font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; }
        .input-group input { 
            background-color: rgba(0,0,0,0.4) !important; border: 1.5px solid rgba(255,255,255,0.1) !important; 
            color: #fff !important; padding: 14px 16px !important; border-radius: 12px !important; 
            font-size: 0.95rem !important; font-family: inherit !important; transition: all 0.3s ease; 
            outline: none; box-sizing: border-box; width: 100%;
        }
        .input-group input:focus { border-color: var(--accent) !important; background-color: rgba(0,0,0,0.6) !important; box-shadow: 0 0 0 3px rgba(255, 255, 0, 0.1); }
        
        .btn-salvar { 
            background-color: var(--accent); color: #000; border: none; padding: 18px; 
            border-radius: 12px; font-size: 1.05rem; font-weight: 800; cursor: pointer; width: 100%; 
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); text-transform: uppercase; letter-spacing: 1px; margin-top: 10px; 
        }
        .btn-salvar:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(255, 255, 0, 0.2); background-color: #fff433; }

        /* =========================================================
           MODAL DE EDIÇÃO APPLE
           ========================================================= */
        .modal-overlay { 
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0, 0, 0, 0.75); 
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 2000; 
            display: none; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s ease; 
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-content { 
            background-color: #111; border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; 
            width: 95%; max-width: 600px; display: flex; flex-direction: column; 
            transform: translateY(20px) scale(0.98); transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); 
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8); overflow: hidden; 
        }
        .modal-overlay.active .modal-content { transform: translateY(0) scale(1); }
        
        .modal-header { padding: 24px 30px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { margin: 0; color: #fff; font-size: 1.25rem; font-weight: 700;}
        .modal-close { background: #222; border: none; color: #86868b; width: 32px; height: 32px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .modal-close:hover { color: #fff; background: #333; }
        .modal-body { padding: 30px; }

        @media (max-width: 768px) {
            #admin-header .header-content { padding: 0 15px !important; }
            #admin-header .admin-title { font-size: 1rem !important; }
            .form-grid { grid-template-columns: 1fr; gap: 0;}
            .page-header h1 { font-size: 1.6rem; }
            .modal-content { max-height: 90vh; overflow-y: auto; border-radius: 24px 24px 0 0; position: absolute; bottom: 0; transform: translateY(100%); }
            .panel-container { margin-top: 130px; padding: 0 15px;}
            .form-box { padding: 25px 20px; border-radius: 16px; }
        }
    </style>
</head>
<body>

    <header id="admin-header">
        <div class="header-content">
            <a href="admin.html" class="back-arrow" title="Voltar ao Painel">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                <span>Voltar</span>
            </a>
            
            <div class="admin-title">ADMINISTRAÇÃO</div>
            
            <a href="store.html" class="store-link">
                Ver Loja <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5l7 7-7 7"></path></svg>
            </a>
        </div>
    </header>

    <main class="panel-container">
        <div class="page-header">
            <h1>📦 Gerir Caixas</h1>
        </div>
        
        <div class="grid-caixas" id="lista-caixas">
            <p style="color: var(--text-secondary); width: 100%; text-align: center; padding: 40px 0;">A carregar base de dados de embalagens...</p>
        </div>

        <div class="form-box">
            <h2>Cadastrar Nova Caixa</h2>
            <form id="form-caixa">
                <div class="form-grid" style="grid-template-columns: 1fr;">
                    <div class="input-group">
                        <label>Nome (Ex: Caixa Padrão P)</label>
                        <input type="text" id="nome-caixa" placeholder="Identificação da embalagem" required>
                    </div>
                </div>
                <div class="form-grid">
                    <div class="input-group"><label>Altura (cm)</label><input type="number" step="0.1" id="alt" placeholder="Ex: 15" required></div>
                    <div class="input-group"><label>Largura (cm)</label><input type="number" step="0.1" id="larg" placeholder="Ex: 20" required></div>
                </div>
                <div class="form-grid">
                    <div class="input-group"><label>Comprimento (cm)</label><input type="number" step="0.1" id="comp" placeholder="Ex: 20" required></div>
                    <div class="input-group"><label>Peso Vazia (kg)</label><input type="number" step="0.01" id="peso" placeholder="Ex: 0.15" required></div>
                </div>
                <div class="form-grid" style="grid-template-columns: 1fr;">
                    <div class="input-group">
                        <label>Quantidade em Estoque</label>
                        <input type="number" id="estoque" placeholder="Ex: 100" required>
                    </div>
                </div>
                <button type="submit" class="btn-salvar" id="btn-add">Adicionar Caixa ao Sistema</button>
            </form>
        </div>
    </main>

    <div class="modal-overlay" id="modal-editar">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Editar Caixa</h3>
                <button class="modal-close" onclick="fecharModalEdicao()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="form-editar-caixa">
                    <input type="hidden" id="edit-id">
                    <div class="form-grid" style="grid-template-columns: 1fr;">
                        <div class="input-group">
                            <label>Nome da Embalagem</label>
                            <input type="text" id="edit-nome" required>
                        </div>
                    </div>
                    <div class="form-grid">
                        <div class="input-group"><label>Altura (cm)</label><input type="number" step="0.1" id="edit-alt" required></div>
                        <div class="input-group"><label>Largura (cm)</label><input type="number" step="0.1" id="edit-larg" required></div>
                    </div>
                    <div class="form-grid">
                        <div class="input-group"><label>Comprimento (cm)</label><input type="number" step="0.1" id="edit-comp" required></div>
                        <div class="input-group"><label>Peso Vazia (kg)</label><input type="number" step="0.01" id="edit-peso" required></div>
                    </div>
                    <div class="form-grid" style="grid-template-columns: 1fr;">
                        <div class="input-group">
                            <label>Quantidade em Estoque</label>
                            <input type="number" id="edit-estoque" required>
                        </div>
                    </div>
                    <button type="submit" class="btn-salvar" id="btn-salvar-edicao" style="margin-top: 20px;">Salvar Alterações</button>
                </form>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // =====================================================================
        // CREDENCIAIS FIREBASE
        // =====================================================================
        const firebaseConfig = { apiKey: "AIzaSyBLDntUspio2er8xe71wOCyObbYa-HaH20", authDomain: "loja-guard.firebaseapp.com", projectId: "loja-guard" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);

        // LER CAIXAS DO FIREBASE
        async function carregarCaixas() {
            const lista = document.getElementById('lista-caixas');
            lista.innerHTML = '';
            const querySnapshot = await getDocs(collection(db, "caixas"));
            
            if (querySnapshot.empty) {
                lista.innerHTML = '<p style="color: var(--text-secondary); width: 100%; text-align: center; padding: 40px 0;">Nenhuma caixa cadastrada no momento.</p>'; return;
            }

            querySnapshot.forEach((doc) => {
                const cx = doc.data();
                const alerta = cx.estoque < 10 ? `<span class="badge-alerta">Restam ${cx.estoque}</span>` : '';
                lista.innerHTML += `
                    <div class="card-caixa">
                        ${alerta}
                        <h3>${cx.nome}</h3>
                        <p><span>Dimensões (AxLxC):</span> <strong>${cx.altura}x${cx.largura}x${cx.comprimento} cm</strong></p>
                        <p><span>Soma dos lados:</span> <strong>${Number(cx.altura)+Number(cx.largura)+Number(cx.comprimento)} cm</strong></p>
                        <p><span>Peso Vazia:</span> <strong>${cx.pesoVazia} kg</strong></p>
                        <p><span>Estoque Atual:</span> <strong>${cx.estoque} un</strong></p>
                        
                        <div class="acoes-caixa">
                            <button class="btn-editar" onclick="abrirModalEdicao('${doc.id}', '${cx.nome}', ${cx.altura}, ${cx.largura}, ${cx.comprimento}, ${cx.pesoVazia}, ${cx.estoque})">Editar</button>
                            <button class="btn-excluir" onclick="excluirCaixa('${doc.id}')">Excluir</button>
                        </div>
                    </div>
                `;
            });
        }

        // EXCLUIR
        window.excluirCaixa = async function(id) {
            if(confirm("Tem certeza que deseja excluir permanentemente esta embalagem?")) {
                await deleteDoc(doc(db, "caixas", id));
                carregarCaixas();
            }
        };

        // MODAL
        window.abrirModalEdicao = function(id, nome, alt, larg, comp, peso, estoque) {
            document.getElementById('edit-id').value = id;
            document.getElementById('edit-nome').value = nome;
            document.getElementById('edit-alt').value = alt;
            document.getElementById('edit-larg').value = larg;
            document.getElementById('edit-comp').value = comp;
            document.getElementById('edit-peso').value = peso;
            document.getElementById('edit-estoque').value = estoque;
            document.getElementById('modal-editar').classList.add('active');
        }

        window.fecharModalEdicao = function() {
            document.getElementById('modal-editar').classList.remove('active');
        }
        
        // Fechar ao clicar fora
        document.getElementById('modal-editar').addEventListener('click', (e) => {
            if (e.target.id === 'modal-editar') fecharModalEdicao();
        });

        // SALVAR EDIÇÃO
        document.getElementById('form-editar-caixa').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-salvar-edicao');
            btn.textContent = "Salvando..."; btn.disabled = true;

            const id = document.getElementById('edit-id').value;
            const refDoc = doc(db, "caixas", id);

            await updateDoc(refDoc, {
                nome: document.getElementById('edit-nome').value,
                altura: Number(document.getElementById('edit-alt').value),
                largura: Number(document.getElementById('edit-larg').value),
                comprimento: Number(document.getElementById('edit-comp').value),
                pesoVazia: Number(document.getElementById('edit-peso').value),
                estoque: parseInt(document.getElementById('edit-estoque').value)
            });

            btn.textContent = "Salvar Alterações"; btn.disabled = false;
            fecharModalEdicao();
            carregarCaixas();
        });

        // ADICIONAR NOVA
        document.getElementById('form-caixa').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-add');
            btn.textContent = "Adicionando..."; btn.disabled = true;

            const novaCaixa = {
                nome: document.getElementById('nome-caixa').value,
                altura: Number(document.getElementById('alt').value),
                largura: Number(document.getElementById('larg').value),
                comprimento: Number(document.getElementById('comp').value),
                pesoVazia: Number(document.getElementById('peso').value),
                estoque: parseInt(document.getElementById('estoque').value)
            };

            await addDoc(collection(db, "caixas"), novaCaixa);
            document.getElementById('form-caixa').reset();
            btn.textContent = "Adicionar Caixa ao Sistema"; btn.disabled = false;
            carregarCaixas();
            
            // Rola suavemente para ver o grid atualizado
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // Init
        carregarCaixas();
    </script>
</body>
</html>
